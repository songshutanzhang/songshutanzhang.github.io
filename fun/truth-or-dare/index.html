    questionArea: document.getElementById("questionArea"),
    questionCopy: document.getElementById("questionCopy"),
    memoryWindow: document.getElementById("memoryWindow"),
    personNumber: document.getElementById("personNumber"),
    peopleTotal: document.getElementById("peopleTotal"),
    questionHead: document.getElementById("questionHead"),
    questionText: document.getElementById("questionText"),
    questionEmpty: document.getElementById("questionEmpty"),
    questionIndex: document.getElementById("questionIndex"),
    actionRow: document.getElementById("actionRow"),
    primaryBtn: document.getElementById("primaryBtn"),
    rerollBtn: document.getElementById("rerollBtn"),
    liveStatus: document.getElementById("liveStatus")
  };

  const wheelSvg = document.getElementById("wheelSvg");
  const clock = createClock(wheelSvg, document.getElementById("memoryTrack"));
  const homeAtmosphere = createHomeAtmosphere(wheelSvg, document.getElementById("homeParticles"),
    document.getElementById("homeMotion"));
  let replaceRoundId = null;
  let questionExit = null;
  const state = {
    playerCount: 4,
    phase: "setup",
    roundId: "",
    resumedSave: null,
    currentPlayer: null,
    previousPlayer: null,
    candidates: [],
    legacyPoolIds: null,
    budget: 0,
    judge: null,
    seenIds: new Set(),
    history: [],
    selectionOptions: {},
    currentQuestion: null,
    pendingQuestion: null,
    personToken: 0,
    timers: new Set()
  };
  const judgeUI = JudgeInterface.init(updateGameControls);

  function setTimer(callback, delay) {
    const timer = window.setTimeout(() => {
      state.timers.delete(timer);
      callback();
    }, delay);
    state.timers.add(timer);
    return timer;
  }

  function clearTimers() {
    clock.cancel();
    questionExit?.cancel();
    questionExit = null;
    state.timers.forEach((timer) => window.clearTimeout(timer));
    state.timers.clear();
  }

  function initFilters() {
    const { taxonomy } = bank;
    const sceneSelect = document.getElementById("scene");
    for (const [value, preset] of Object.entries(taxonomy.scenes)) sceneSelect.add(new Option(preset.label, value));
    const checkOptions = {
      includeDomains: taxonomy.domains,
      excludeDomains: taxonomy.domains,
      excludePresets: Object.fromEntries(Object.entries(taxonomy.exclusions).map(([key, item]) => [key, item.label]))
    };
    for (const [id, choices] of Object.entries(checkOptions)) {
      const container = document.getElementById(id);
      for (const [value, caption] of Object.entries(choices)) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = value;
        label.append(input, document.createTextNode(caption));
        container.appendChild(label);
      }
    }
    const list = document.getElementById("topicOptions");
    for (const [key, caption] of Object.entries(taxonomy.topics)) list.appendChild(new Option(key, caption));
    sceneSelect.value = "all";
  }

  function initMobileMenus() {
    const narrow = matchMedia("(max-width: 980px)");
    initTopicSuggestions(narrow);
    let picker;
    const isTrigger = target => narrow.matches && target instanceof HTMLSelectElement &&
      !target.disabled && !target.multiple && target.size <= 1;

    function open(select, fromPointer = false) {
      if (picker?.open || !select.options.length) return;
      const dialog = document.createElement("dialog");
      const list = document.createElement("div");
      const label = select.labels?.[0]?.cloneNode(true);
      label?.querySelector("select")?.remove();
      const name = select.getAttribute("aria-label") || label?.textContent.trim() || "选择选项";
      dialog.className = "mobile-options";
      dialog.toggleAttribute("data-pointer", fromPointer);
      dialog.setAttribute("aria-label", name);
      list.setAttribute("role", "listbox");
      list.setAttribute("aria-label", name);
      dialog.append(list);
      for (const option of select.options) {
        if (option.hidden || option.parentElement.hidden) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option.label;
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", String(option.selected));
        button.disabled = option.disabled || option.parentElement.matches("optgroup:disabled");
        button.tabIndex = -1;
        button.addEventListener("click", () => {
          const changed = select.selectedIndex !== option.index;
          select.selectedIndex = option.index;
          dialog.close();
          if (changed) {
            select.dispatchEvent(new Event("input", { bubbles: true }));
            select.dispatchEvent(new Event("change", { bubbles: true }));
          }
        });
        list.append(button);
      }
      const options = [...list.querySelectorAll("button:enabled")];
      if (!options.length) return;
      const selected = options.find(button => button.getAttribute("aria-selected") === "true") || options[0];
      selected.tabIndex = 0;
      dialog.addEventListener("keydown", event => {
        dialog.removeAttribute("data-pointer");
        const index = options.indexOf(document.activeElement);
        if (index >= 0 && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          if (!event.repeat) options[index].click();
          return;
        }
        const position = { ArrowDown: Math.min(index + 1, options.length - 1), ArrowUp: Math.max(index - 1, 0),
          Home: 0, End: options.length - 1 }[event.key];
        if (position === undefined) return;
        event.preventDefault();
        if (index >= 0) options[index].tabIndex = -1;
        options[position].tabIndex = 0;
        options[position].focus();
      });
      dialog.addEventListener("click", event => {
        if (event.target === dialog) {
          const r = dialog.getBoundingClientRect();
          if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) dialog.close();
        }
      });
      dialog.addEventListener("close", () => {
        dialog.remove();
        if (picker === dialog) picker = null;
        if (select.isConnected) select.focus({ preventScroll: true });
      }, { once: true });
      (select.closest("[popover], dialog") || document.body).append(dialog);
      picker = dialog;
      dialog.showModal();
      selected.focus();
    }
    // 原生移动端选择面板由系统排版，移动端用同一个居中菜单写回原 select。
    document.addEventListener("mousedown", event => {
      if (event.button === 0 && isTrigger(event.target)) event.preventDefault();
    });
    document.addEventListener("click", event => {
      if (!isTrigger(event.target)) return;
      event.preventDefault();
      open(event.target, event.detail > 0);
    });
    document.addEventListener("keydown", event => {
      if (!isTrigger(event.target) || ![" ", "Enter", "ArrowDown", "ArrowUp", "F4"].includes(event.key)) return;
      event.preventDefault();
      open(event.target);
    });
    narrow.addEventListener("change", () => { if (!narrow.matches && picker?.open) picker.close(); });
  }

  function initTopicSuggestions(narrow) {
    const data = document.getElementById("topicOptions");
    const fields = [...document.querySelectorAll('input[list="topicOptions"]')];
    const list = document.createElement("div");
    list.className = "topic-suggestions";
    list.id = "mobileTopicSuggestions";
    list.setAttribute("role", "listbox");
    fields[0].closest(".filters-grid").append(list);
    let field, active = -1;

    function dismiss() {
      list.hidden = true;
      active = -1;
      if (field) {
        field.setAttribute("aria-expanded", "false");
        field.removeAttribute("aria-activedescendant");
      }
    }
    function render(input) {
      if (!narrow.matches) return;
      field = input;
      dismiss();
      const terms = input.value.split(/[,，、]/).map(term => term.trim().toLowerCase());
      const query = terms.pop();
      const options = [...data.options].filter(option => !terms.includes(option.value.toLowerCase()) &&
        (option.value.toLowerCase().includes(query) || option.label.toLowerCase().includes(query)));
      list.replaceChildren(...options.map((option, index) => {
        const item = document.createElement("div");
        item.setAttribute("role", "option");
        item.id = "topicSuggestion-" + index;
        item.dataset.value = item.textContent = option.value;
        return item;
      }));
      list.scrollTop = 0;
      list.hidden = !options.length;
      field.setAttribute("aria-expanded", String(!list.hidden));
    }
    function choose(item) {
      const prefix = field.value.match(/^.*[,，、]\s*/)?.[0] || "";
      field.value = prefix + item.dataset.value;
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      dismiss();
    }
    list.addEventListener("mousedown", event => event.preventDefault());
    list.addEventListener("click", event => {
      if (event.target.matches('[role="option"]')) choose(event.target);
    });
    for (const input of fields) {
      input.addEventListener("focus", () => render(input));
      input.addEventListener("input", () => render(input));
      input.addEventListener("blur", dismiss);
      input.addEventListener("keydown", event => {
        if (!narrow.matches || event.isComposing) return;
        if (list.hidden && event.key === "ArrowDown") render(input);
        if (list.hidden) return;
        if (event.key === "Escape") {
          event.preventDefault(); event.stopPropagation(); dismiss();
        } else if (event.key === "Enter" && active >= 0) {
          event.preventDefault(); choose(list.children[active]);
        } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          list.children[active]?.removeAttribute("aria-selected");
          active = Math.max(0, Math.min(list.children.length - 1, active + (event.key === "ArrowDown" ? 1 : -1)));
          const item = list.children[active];
          item.setAttribute("aria-selected", "true");
          input.setAttribute("aria-activedescendant", item.id);
          item.scrollIntoView({ block: "nearest" });
        }
      });
    }
    function adapt() {
      dismiss();
      for (const input of fields) {
        if (narrow.matches) {
          input.removeAttribute("list");
          input.setAttribute("role", "combobox");
          input.setAttribute("aria-autocomplete", "list");
          input.setAttribute("aria-controls", list.id);
          input.setAttribute("aria-expanded", "false");
        } else {
          input.setAttribute("list", data.id);
          for (const key of ["role", "aria-autocomplete", "aria-controls", "aria-expanded"]) input.removeAttribute(key);
        }
      }
      field = null;
    }
    narrow.addEventListener("change", adapt);
    adapt();
  }

  function initFilterMenu() {
    const trigger = document.getElementById("filtersToggle");
    const menu = document.getElementById("filtersMenu");
    const viewport = window.visualViewport;
    const inset = 12;
    const gap = 6;
    const hasPopover = typeof menu.showPopover === "function";
    const isOpen = () => hasPopover ? menu.matches(":popover-open") : menu.hasAttribute("data-open");
    function place() {
      const anchor = trigger.getBoundingClientRect();
      if (!anchor.width) return;
      const left = (viewport?.offsetLeft ?? 0) + inset;
      const top = (viewport?.offsetTop ?? 0) + inset;
      const right = left + (viewport?.width ?? document.documentElement.clientWidth) - 2 * inset;
      const bottom = top + (viewport?.height ?? document.documentElement.clientHeight) - 2 * inset;
      const below = bottom - anchor.bottom - gap;
      const above = anchor.top - gap - top;
      // Prefer the space above the trigger when two settings rows fit.
      const down = above < Math.min(156, below);
      const width = Math.min(anchor.width, right - left);
      menu.dataset.side = down ? "down" : "up";
      trigger.dataset.side = menu.dataset.side;
      menu.style.width = width + "px";
      menu.style.left = Math.max(left, Math.min(anchor.left, right - width)) + "px";
      menu.style.maxHeight = Math.max(0, down ? below : above) + "px";
      menu.style.top = down ? (anchor.bottom + gap) + "px" : "auto";
      menu.style.bottom = down ? "auto" : (document.documentElement.clientHeight - anchor.top + gap) + "px";
    }
    if (hasPopover) {
      menu.addEventListener("beforetoggle", ({ newState }) => {
        const open = newState === "open";
        trigger.setAttribute("aria-expanded", String(open));
        if (open) place();
      });
    } else {
      function toggle(open) {
        trigger.setAttribute("aria-expanded", String(open));
        if (open) place();
        menu.toggleAttribute("data-open", open);
      }
      trigger.addEventListener("click", () => toggle(!isOpen()));
      document.addEventListener("pointerdown", (event) => {
        if (isOpen() && !el.filters.contains(event.target)) toggle(false);
      });
      document.addEventListener("keydown", (event) => {
        if (isOpen() && event.key === "Escape") {
          toggle(false);
          trigger.focus({ preventScroll: true });
        }
      });
    }
    function reposition() { if (isOpen()) place(); }
    window.addEventListener("resize", reposition);
    window.addEventListener("scroll", reposition, { passive: true });
    viewport?.addEventListener("resize", reposition);
    viewport?.addEventListener("scroll", reposition);
  }

  function readFilters() {
    const input = (id) => document.getElementById(id);
    const value = (id) => input(id).value;
    const checked = (id) => Array.from(input(id).querySelectorAll("input:checked"), (item) => item.value);
    const topicByLabel = new Map(Object.entries(bank.taxonomy.topics).map(([key, label]) => [label, key]));
    const topics = (id) => value(id).split(/[,，、]/).map((item) => item.trim())
      .filter(Boolean).map((item) => topicByLabel.get(item) ?? item);
    const presets = checked("excludePresets").flatMap((key) => bank.taxonomy.exclusions[key].tags);
    if (!input("drawCount").validity.valid) throw new Error("请输入正整数作为抽题数量。");
    return {
      scene: value("scene"),
      minDepth: Number(value("minDepth")),
      maxDepth: Number(value("maxDepth")),
      count: value("drawCount") ? Number(value("drawCount")) : undefined,
      playerOrder: value("playerOrder"),
      includeDomains: checked("includeDomains"),
      excludeDomains: checked("excludeDomains"),
      includeTopics: topics("includeTopics"),
      excludeTopics: [...presets, ...topics("excludeTopics")]
    };
  }

  function updateSetup() {
    try {
      const options = readFilters();
      const { candidates } = QuestionSelector.eligibility(bank, options);
      const available = candidates.length;
      const tooFew = options.count > available;
      el.newSession.disabled = available === 0 || tooFew;
      el.startBtn.disabled = el.newSession.disabled && el.resumeBtn.disabled;
      if (available === 0) {
        el.poolSummary.textContent = "没有符合条件的题目，请调整筛选。";
      } else if (tooFew) {
        el.poolSummary.textContent = `有 ${available} 道可用题，少于所需的 ${options.count} 道。请调整数量或筛选。`;
      } else {
        el.poolSummary.textContent = "";
      }
      return el.newSession.disabled ? null : options;
    } catch (error) {
      el.newSession.disabled = true;
      el.startBtn.disabled = el.resumeBtn.disabled;
      el.poolSummary.textContent = error.message;
      return null;
    }
  }

  function eligibleQuestions(options, poolIds = null) {
    const { candidates } = QuestionSelector.eligibility(bank, options);
    return poolIds ? candidates.filter((question) => poolIds.has(question.id)) : candidates;
  }

  function availableQuestions(settings = state.judge) {
    return JudgeSelection.remaining(state.candidates, state.seenIds, settings.excludedScopes);
  }

  function remainingBudget() {
    return Math.max(0, state.budget - state.seenIds.size);
  }

  function savedPool(saved) {
    const ids = saved.version === SAVED_ROUND_VERSION ? saved.legacyPoolIds : saved.remainingIds;
    return ids ? new Set(ids) : null;
  }

  function savedBudget(saved, seen, pool) {
    if (saved.version === SAVED_ROUND_VERSION) return saved.budget;
    return seen.size + [...pool].filter((id) => !seen.has(id)).length;
  }

  function historyFromSave(saved) {
    const byId = new Map((Array.isArray(saved.history) ? saved.history : [])
      .filter((entry) => typeof entry?.id === "string" && typeof entry.question === "string")
      .map((entry) => [entry.id, entry.question]));
    return saved.seenIds.map((id) => ({
      id,
      question: byId.get(id) ?? bank.questions.find((q) => q.id === id)?.question ?? "当前题库中已找不到这道题。"
    }));
  }

  function renderRoundHistory(items) {
    const fragment = document.createDocumentFragment();
    for (const { id, question } of [...items].reverse()) {
      const row = document.createElement("li");
      const heading = document.createElement("div");
      heading.className = "history-row-head";
      const index = document.createElement("span");
      index.className = "field-hint";
      index.textContent = id;
      heading.append(index);
      const text = document.createElement("p");
      text.textContent = question;
      row.append(heading, text);
      fragment.appendChild(row);
    }
    document.getElementById("roundHistoryList").replaceChildren(fragment);
    document.getElementById("roundHistoryEmpty").hidden = items.length > 0;
  }

  function openRoundHistory(items) {
    renderRoundHistory(items);
    const dialog = document.getElementById("roundHistory");
    dialog.showModal();
    document.getElementById("roundHistoryList").scrollTop = 0;
  }

  function readSavedRound() {
    try {
      const saved = JSON.parse(window.localStorage.getItem(SAVED_ROUND_KEY));
      const isPlayer = (player) => Number.isInteger(player) && player >= 1 && player <= saved.playerCount;
      const isId = (id) => typeof id === "string" && /^Q\d{3,}$/.test(id);
      const isIdList = (ids) => Array.isArray(ids) && ids.every(isId);
      if (typeof saved?.roundId !== "string" || !Number.isInteger(saved.playerCount) ||
          saved.playerCount < 2 || saved.playerCount > 99 ||
          (saved.previousPlayer != null && !isPlayer(saved.previousPlayer)) || !isIdList(saved.seenIds) ||
          !saved.options || typeof saved.options !== "object" || Array.isArray(saved.options)) return null;
      if (saved.version == null) {
        return isIdList(saved.remainingIds) && (saved.readyPlayer == null || isPlayer(saved.readyPlayer)) ? saved : null;
      }
      if (saved.version !== SAVED_ROUND_VERSION || !Number.isSafeInteger(saved.budget) ||
          saved.budget < new Set(saved.seenIds).size || (saved.legacyPoolIds != null && !isIdList(saved.legacyPoolIds))) return null;
      const { turn, judge } = saved;
      if (!["between", "ready", "question", "end"].includes(turn?.phase) ||
          (turn.player != null && !isPlayer(turn.player)) ||
          (["ready", "question"].includes(turn.phase) && !isPlayer(turn.player)) ||
          (turn.phase === "question" && !turn.question) ||
          (turn.question && (!isId(turn.question.id) || !saved.seenIds.includes(turn.question.id) ||
            typeof turn.question.question !== "string"))) return null;
      const { min, max } = JudgeSelection.checkIn;
      if (!Number.isSafeInteger(judge?.completedQuestions) || judge.completedQuestions < 0 ||
          judge.completedQuestions > saved.seenIds.length || !Number.isSafeInteger(judge.sequenceStartAt) ||
          judge.sequenceStartAt < 0 || judge.sequenceStartAt > judge.completedQuestions ||
          !Number.isInteger(judge.checkIn?.triggerAt) || judge.checkIn.triggerAt < min || judge.checkIn.triggerAt > max ||
          !["waiting", "pending", "done"].includes(judge.checkIn.status) ||
          (judge.checkIn.status === "pending" && turn.phase !== "between")) return null;
      return saved;
    } catch {
      return null;
    }
  }

  function updateSavedRound() {
    const saved = readSavedRound();
    const seen = new Set(saved?.seenIds);
    const historyButton = document.getElementById("savedHistoryBtn");
    el.savedRound.hidden = !historyButton || !seen.size;
    if (historyButton) historyButton.hidden = !seen.size;
    let resumable = false;
    if (saved) {
      try {
        const pool = savedPool(saved);
        const candidates = eligibleQuestions(saved.options, pool);
        resumable = saved.version === SAVED_ROUND_VERSION
          ? savedBudget(saved, seen, pool) > seen.size || saved.turn.phase === "question" || saved.judge.checkIn.status === "pending"
          : candidates.some(question => !seen.has(question.id));
      } catch { /* Invalid legacy filters cannot be resumed. */ }
    }
    el.resumeBtn.disabled = !resumable;
    updateSetup();
    if (!resumable && el.sessionChoices.open) el.sessionChoices.close();
  }

  function forgetSave(expected) {
    if (!expected || JSON.stringify(readSavedRound()) !== JSON.stringify(expected)) return true;
    try {
      window.localStorage.removeItem(SAVED_ROUND_KEY);
      return true;
    } catch {
      return false;
    }
  }

  function showHomeFeedback(text) {
    el.homeFeedback.hidden = !text;
    el.homeFeedback.textContent = text;
  }

  function refreshHomeChoices(saved) {
    const replacing = saved && saved.roundId !== state.roundId;
    replaceRoundId = replacing ? saved.roundId : null;
    el.homeNote.hidden = !saved;
    el.homeNote.textContent = replacing ? "已有另一局存档，保留本轮会替换它。" : "选择不保存将结束本次会话。";
    showHomeFeedback("");
  }

  function openHomeChoices() {
    refreshHomeChoices(readSavedRound());
    el.homeChoices.showModal();
  }

  function storeRound(existing) {
    const sameRound = existing?.roundId === state.roundId;
    if (sameRound && JSON.stringify(existing) !== state.resumedSave) {
      showHomeFeedback("另一个页面已更新这局存档。");
      return false;
    }
    const stablePhase = ["between", "question", "end"].includes(state.phase) ? state.phase : "ready";
    const question = state.currentQuestion;
    const turn = { phase: stablePhase, player: state.currentPlayer };
    if (question) turn.question = { id: question.id, question: question.question };
    const saved = {
      version: SAVED_ROUND_VERSION,
      roundId: state.roundId,
      options: state.selectionOptions,
      playerCount: state.playerCount,
      previousPlayer: state.previousPlayer,
      turn,
      seenIds: [...state.seenIds],
      history: state.history,
      budget: state.budget,
      judge: state.judge
    };
    if (state.legacyPoolIds) saved.legacyPoolIds = [...state.legacyPoolIds];
    try {
      window.localStorage.setItem(SAVED_ROUND_KEY, JSON.stringify(saved));
      return true;
    } catch {
      showHomeFeedback("浏览器未能保存进度，请保持当前页面打开。");
      return false;
    }
  }

  function saveAndReturn() {
    if (state.phase === "setup") return;
    const existing = readSavedRound();
    if (existing && existing.roundId !== state.roundId && existing.roundId !== replaceRoundId) {
      refreshHomeChoices(existing);
      return;
    }
    if (!storeRound(existing)) return;
    returnToSetup();
  }

  function resumeGame() {
    const saved = readSavedRound();
    if (!saved) {
      updateSavedRound();
      return;
    }
    const legacy = saved.version !== SAVED_ROUND_VERSION;
    const pool = savedPool(saved);
    let candidates;
    try {
      candidates = eligibleQuestions(saved.options, pool);
    } catch {
      updateSavedRound();
      return;
    }
    const seen = new Set(saved.seenIds);
    if (legacy && !candidates.some((question) => !seen.has(question.id))) {
      updateSavedRound();
      return;
    }

    state.roundId = saved.roundId;
    state.resumedSave = JSON.stringify(saved);
    state.seenIds = seen;
    state.history = historyFromSave(saved);
    state.candidates = candidates;
    state.legacyPoolIds = pool;
    state.budget = savedBudget(saved, seen, pool);
    // 旧存档只记录亮过的题号，无法据此区分回答和换题。
    state.judge = legacy ? JudgeSelection.createState({ sequence: saved.options.gradual ? "gradual" : "random" }, randomInt)
      : { ...JudgeSelection.preferences(saved.judge), completedQuestions: saved.judge.completedQuestions,
        sequenceStartAt: saved.judge.sequenceStartAt, checkIn: { ...saved.judge.checkIn } };
    el.drawOrder.value = state.judge.sequence;
    const playerOrder = saved.options.playerOrder === "sequential" ? "sequential" : "random";
    const { gradual, ...options } = saved.options;
    state.selectionOptions = { ...options, playerOrder };
    document.getElementById("playerOrder").value = playerOrder;
    state.playerCount = saved.playerCount;
    state.previousPlayer = saved.previousPlayer ?? null;
    setCount(state.playerCount);
    showGame();
    const turn = legacy ? { phase: saved.readyPlayer == null ? "between" : "ready", player: saved.readyPlayer } : saved.turn;
    if (turn.phase === "ready") revealPlayer(turn.player);
    else if (["question", "end"].includes(turn.phase)) restoreDisplayedTurn(turn);
    else if (state.judge.checkIn.status === "pending") showCheckIn();
    else advanceTurn();
    if (!judgeUI.mode && !el.primaryBtn.disabled) el.primaryBtn.focus();
  }

  function padNumber(value) {
    return String(value).padStart(2, "0");
  }

  function randomInt(maxExclusive) {
    if (maxExclusive <= 0) return 0;
    if (window.crypto && typeof window.crypto.getRandomValues === "function") {
      const buffer = new Uint32Array(1);
      const ceiling = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
      let value;
      do {
        window.crypto.getRandomValues(buffer);
        value = buffer[0];
      } while (value >= ceiling);
      return value % maxExclusive;
    }
    return Math.floor(Math.random() * maxExclusive);
  }

  function createHomeDust(canvas) {
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;
    const grains = [];
    let width = 0, height = 0, scale = 0;
    let seed = 0x716d58c3;
    function random() {
      seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
      return seed / 0x100000000;
    }
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (!w || !h || (w === width && h === height && dpr === scale)) return;
      width = w;
      height = h;
      scale = dpr;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(canvas.width / w, 0, 0, canvas.height / h, 0, 0);
      const density = w <= 620 ? 133 : 163;
      const count = Math.max(12, Math.min(410, Math.round(w * h * density / 1e6)));
      // 位置以比例保存。旋转屏幕、改变窗口大小时，同一颗微粒仍在原来的相对位置。
      while (grains.length < count) {
        const radius = .9 + 1.3 * random() ** 1.65;
        grains.push({
          x: random(), y: random(), radius, stretch: 1 + .32 * random(),
          speed: 4 + 10 * random(), phase: random() * Math.PI * 2,
          frequency: .16 + .25 * random(), amplitude: 2 + 4 * random(),
          opacity: .23 + .077 * radius + .04 * random(),
          color: random() < .40 ? (random() < .6 ? "#9A784E" : "#9C7960") : "#77766C"
        });
      }
      grains.length = count;
    }
    function paint(seconds, flow) {
      // 窗口移到另一块屏幕时，CSS 尺寸可能相同，后备画布仍须匹配新像素密度。
      if (Math.min(window.devicePixelRatio || 1, 2) !== scale) resize();
      if (!width || !height) return;
      ctx.clearRect(0, 0, width, height);
      for (const grain of grains) {
        grain.x += seconds * grain.speed * flow / (width + 12);
        grain.x -= Math.floor(grain.x);
        grain.phase = (grain.phase + seconds * grain.frequency) % (2 * Math.PI);
        const x = grain.x * (width + 12) - 6;
        const y = grain.y * height + grain.amplitude * Math.sin(grain.phase);
        ctx.fillStyle = grain.color;
        ctx.globalAlpha = grain.opacity;
        ctx.beginPath();
        const stretch = 1 + .085 * Math.max(0, Math.abs(flow) - 1);
        ctx.ellipse(x, y, grain.radius * grain.stretch * stretch, grain.radius, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    return { resize, paint };
  }

  function createHomeAtmosphere(svg, canvas, toggle) {
    const wheel = svg.parentElement;
    const grip = wheel.querySelector("#minuteGrip"), axis = grip.parentElement;
    const second = svg.querySelector("#secondHand");
    const dust = createHomeDust(canvas);
    const forcedColors = matchMedia("(forced-colors: active)");
    const preference = "truth-wheel/home-motion/v1";
    const dustInterval = 1000 / 30, gearStep = 3;
    const calibrationMs = 336;
    let home = false, pageHidden = false, frame = 0, timer = 0;
    let flight = null, drag = null, offset = 0;
    let calibration = null, touchStart = null, lastTap = null;
    let gearEpoch = null, gearOrigin = 0, dialGear = 0;
    let lastSecond = null, lastWall = 0, lastFrame = 0, ticking = false;
    let lastPaint = 0, nextPaint = 0, flow = 1, light = 0;
    let shownSecond = null, shownMinute = null;
    try { toggle.checked = localStorage.getItem(preference) !== "off"; } catch { /* 当页仍可切换。 */ }

    const modulo = (n, period) => ((n % period) + period) % period;
    const shortest = (n, period) => modulo(n + period / 2, period) - period / 2;
    function forwardArc(from, to) {
      const turn = modulo(to - from, 360);
      return turn > 300 ? turn - 360 : turn;
    }
    function localTime(wall = Date.now()) {
      const date = new Date(wall);
      if (!Number.isFinite(date.getTime())) return { degrees: 4050, s: 0, ms: 0, epoch: null };
      const s = date.getSeconds(), ms = date.getMilliseconds();
      return { degrees: date.getHours() % 12 * 360 + date.getMinutes() * 6 + (s + ms / 1000) / 10,
        s, ms, epoch: Math.floor(wall / 1000) };
    }
    function beat(time, stamp, snap) {
      const wall = time.epoch * 1000 + time.ms;
      if (snap || time.epoch === null || stamp - lastFrame > 250 ||
          Math.abs(wall - lastWall - (stamp - lastFrame)) > 100) ticking = false;
      else if (time.epoch !== lastSecond) ticking = lastSecond !== null && time.epoch === lastSecond + 1;
      lastSecond = time.epoch;
      lastWall = wall;
      lastFrame = stamp;
      let correction = 0;
      if (ticking && time.ms < 85) {
        const p = time.ms / 85;
        correction = -6 + 6.38 * p * (2 - p);
      } else if (ticking && time.ms < 180) correction = .38 * ((180 - time.ms) / 95) ** 2;
      const angle = time.s * 6 + correction;
      if (angle !== shownSecond) second.setAttribute("transform", `rotate(${angle})`);
      shownSecond = angle;
      return correction / 6;
    }
    function updateGrip(degrees) {
      axis.style.transform = `rotate(${degrees % 360}deg)`;
      const value = Math.floor(modulo(degrees, 4320) / 6);
      if (value === shownMinute) return;
      shownMinute = value;
      wheel.setAttribute("aria-valuenow", value);
      wheel.setAttribute("aria-valuetext", `${Math.floor(value / 60) || 12}点${value % 60}分`);
    }
    function paintHome(stamp, snap) {
      const time = localTime();
      const fraction = beat(time, stamp, snap);
      if (gearEpoch === null) gearEpoch = time.epoch;
      const elapsed = time.epoch === null ? 0 : (time.epoch - gearEpoch) % 360;
      const degrees = drag ? drag.degrees : time.degrees + offset;
      let minuteError = 0, hourError = 0;
      if (calibration) {
        const t = Math.min(1, Math.max(0, (stamp - calibration.start) / calibrationMs));
        const remaining = 1 - t * t * (3 - 2 * t);
        minuteError = calibration.minute * remaining;
        hourError = calibration.hour * remaining;
        if (t === 1) calibration = null;
      }
      clock.position({ minute: (degrees + minuteError) % 360, hour: degrees / 12 + hourError,
        gear: gearOrigin + dialGear + minuteError * .32 + gearStep * (elapsed + fraction), orbit: 0, lever: 0 });
      updateGrip(degrees + minuteError);
      return 1000 - time.ms;
    }
    function fade(value) {
      light = value;
      second.style.opacity = canvas.style.opacity = String(value);
    }
    function resizeDust() {
      if (!canvas.hidden) { dust.resize(); dust.paint(0, flow); }
    }
    const observer = dust && window.ResizeObserver ? new ResizeObserver(resizeDust) : null;
    function layers() {
      const visible = (home || flight) && !document.hidden && !pageHidden;
      document.body.toggleAttribute("data-clock-ready", Boolean(visible));
      canvas.hidden = !(visible && dust && toggle.checked && !REDUCED_MOTION.matches && !forcedColors.matches);
      if (canvas.hidden) observer?.disconnect();
      else { resizeDust(); observer?.observe(canvas); }
    }
    function paintDust(stamp) {
      if (canvas.hidden || light === 0 || stamp < nextPaint) return;
      const dt = Math.min(.2, Math.max(0, stamp - lastPaint) / 1000);
      lastPaint = stamp;
      nextPaint += (Math.floor((stamp - nextPaint) / dustInterval) + 1) * dustInterval;
      let target = 1;
      if (drag) {
        const v = drag.speed * Math.exp(-Math.max(0, stamp - drag.lastMove - 36) / 65);
        target = Math.sign(v) * Math.min(9, 1 - Math.exp(-Math.abs(v) / 12) + Math.abs(v) / 60);
      }
      flow += (target - flow) * (1 - Math.exp(-dt / .13));
      dust.paint(dt, flow);
    }
    function stopLoop() {
      cancelAnimationFrame(frame); clearTimeout(timer);
      frame = timer = 0;
    }
    function discreteClock() {
      timer = setTimeout(discreteClock, paintHome(performance.now(), true));
    }
    function animate() { return toggle.checked && !REDUCED_MOTION.matches && !document.hidden && !pageHidden; }
    function refresh() {
      stopLoop();
      if (!animate()) calibration = null;
      if (flight && !animate()) { finishTransfer(); return; }
      layers();
      if ((!home && !flight) || pageHidden || document.hidden) return;
      const stamp = performance.now();
      lastPaint = stamp;
      nextPaint = stamp + dustInterval;
      if (!flight) {
        fade(1);
        const delay = paintHome(stamp, true);
        if (!toggle.checked) return;
        if (REDUCED_MOTION.matches) { timer = setTimeout(discreteClock, delay); return; }
      }
      frame = requestAnimationFrame(drawFrame);
    }
    function drawFrame(stamp) {
      if (flight) {
        const p = Math.min(1, Math.max(0, (stamp - flight.start) / flight.duration));
        if (p >= 1) { finishTransfer(); return; }
        paintTransfer(p, stamp);
      } else paintHome(stamp, false);
      paintDust(stamp);
      frame = requestAnimationFrame(drawFrame);
    }

    // 指针捕获让手指移出表盘后仍能拨动。逐事件展开夹角，跨十二点时保留方向与圈数。
    function pointerAngle(e) {
      const r = wheel.getBoundingClientRect();
      const dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;

    function turnDial(delta) {

      const degrees = clock.pose.hour * 12 + delta;

      else offset = degrees - localTime().degrees;
      clock.position({ ...clock.pose, minute: degrees % 360, hour: degrees / 12, gear: clock.pose.gear + delta * .32 });

    function resetToNow() {

      const now = localTime();
      const minute = shortest(clock.pose.minute - now.degrees, 360);
      const hour = shortest(clock.pose.hour - now.degrees / 12, 360);
      offset = 0;
      dialGear -= minute * .32;
      if (animate()) calibration = { start: performance.now(), minute, hour };
      paintHome(performance.now(), !animate());
    }
    document.getElementById("resetHomeClock").addEventListener("click", resetToNow);
    wheel.addEventListener("dblclick", e => {
      if (home && !flight && !e.sourceCapabilities?.firesTouchEvents) resetToNow();
    });
    // 触屏的双击事件因浏览器而异，只接受两次短距离轻点，滑动或取消会中断手势。
    wheel.addEventListener("pointerdown", e => {
      if (e.pointerType !== "touch" || !home || flight) return;
      if (!e.isPrimary) { touchStart = lastTap = null; return; }
      touchStart = { id: e.pointerId, x: e.clientX, y: e.clientY, at: e.timeStamp };
    });
    wheel.addEventListener("pointermove", e => {
      if (touchStart?.id === e.pointerId && Math.hypot(e.clientX - touchStart.x, e.clientY - touchStart.y) > 12) {
        touchStart = lastTap = null;
      }
    });
    wheel.addEventListener("pointercancel", () => { touchStart = lastTap = null; });
    wheel.addEventListener("pointerup", e => {
      if (touchStart?.id !== e.pointerId) return;
      const tap = touchStart;
      touchStart = null;
      if (e.timeStamp - tap.at > 350 || Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 12) {
        lastTap = null; return;
      }
      if (lastTap && e.timeStamp - lastTap.at < 380 && Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) <= 24) {
        lastTap = null; resetToNow();
      } else lastTap = { x: tap.x, y: tap.y, at: e.timeStamp };
    });
    grip.addEventListener("pointerdown", e => {
      if (!home || flight || calibration || drag || !e.isPrimary || e.button !== 0) return;
      const angle = pointerAngle(e);
      if (angle === null) return;
      e.preventDefault();
      drag = { id: e.pointerId, angle, degrees: clock.pose.hour * 12, lastMove: e.timeStamp, speed: 0 };
      grip.setPointerCapture(e.pointerId);
    });
    function move(e) {
      const angle = pointerAngle(e);
      if (angle !== null && drag.angle !== null) {
        const delta = shortest(angle - drag.angle, 360);
        const dt = Math.max(4, Math.min(160, e.timeStamp - drag.lastMove));
        turnDial(delta);
        drag.speed += (delta * 1000 / dt - drag.speed) * (1 - Math.exp(-dt / 32));
      }
      drag.angle = angle;
      drag.lastMove = e.timeStamp;
    }
    grip.addEventListener("pointermove", e => {
      if (drag?.id !== e.pointerId) return;
      const samples = e.getCoalescedEvents?.();
      if (samples?.length) samples.forEach(move);
      else move(e);
    });
    for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
      grip.addEventListener(type, e => { if (drag?.id === e.pointerId) release(); });
    }
    wheel.addEventListener("keydown", e => {
      if (!home || flight || calibration || drag) return;
      const steps = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -5, PageUp: 5 };
      let delta = steps[e.key] * 6;
      if (e.key === "Home" || e.key === "End") delta = (e.key === "Home" ? 0 : 4314) - modulo(clock.pose.hour * 12, 4320);
      if (!Number.isFinite(delta)) return;
      e.preventDefault();
      turnDial(delta);
    });

    function homeControl() {
      if (home) {
        wheel.disabled = !!flight;
        wheel.setAttribute("role","slider");
        wheel.setAttribute("aria-label","拨动分针");
        wheel.title = "拖动分针，双击表盘重置钟表";
        wheel.setAttribute("aria-valuemin","0");
        wheel.setAttribute("aria-valuemax","719");
        wheel.removeAttribute("aria-pressed");
        shownMinute = null;
      } else {
        wheel.removeAttribute("title");
        for (const attr of ["role","aria-valuemin","aria-valuemax","aria-valuenow","aria-valuetext"]) wheel.removeAttribute(attr);
      }
    }
    function setHome() {
      home = true;
      homeControl();
      refresh();
    }

    // 共享表盘直接从屏幕上的位置移动。旋转设备或布局重排时从上一帧的可见位置接续。
    function placeWheel(f, eased) {
      const box = wheel.getBoundingClientRect();
      const end = { x: box.left + scrollX - f.dx, y: box.top + scrollY - f.dy, w: box.width / f.scale };
      if (f.end && (Math.abs(end.x - f.end.x) > .5 || Math.abs(end.y - f.end.y) > .5 ||
          Math.abs(end.w - f.end.w) > .5)) {
        f.fromBox = f.visibleBox;
        f.rebase = f.lastEase;
      }
      const t = (eased - f.rebase) / (1 - f.rebase);
      f.dx = (f.fromBox.x - end.x) * (1 - t);
      f.dy = (f.fromBox.y - end.y) * (1 - t);
      f.scale = 1 + (f.fromBox.w / end.w - 1) * (1 - t);
      f.visibleBox = { x: end.x + f.dx, y: end.y + f.dy, w: end.w * f.scale };
      f.end = end; f.lastEase = eased;
      if (Math.abs(f.dx) + Math.abs(f.dy) + Math.abs(f.scale - 1) > .0001 || wheel.style.transform) {
        wheel.style.transform = `translate(${f.dx}px, ${f.dy}px) scale(${f.scale})`;
      }
    }
    function paintTransfer(p, stamp) {
      const f = flight, eased = p * p * (3 - 2 * p);
      placeWheel(f, eased);
      const { from, travel } = f;
      clock.position({
        minute: from.minute + travel.minute * eased, hour: from.hour + travel.hour * eased,
        gear: from.gear + travel.gear * eased, orbit: from.orbit + travel.orbit * eased,
        lever: from.lever * (1 - eased)
      });
      if (p > 0 || home) beat(localTime(), stamp, home && p === 0);
      const alpha = Math.min(1, home ? p / .68 : p / .35);
      fade(f.light + ((home ? 1 : 0) - f.light) * alpha * alpha * (3 - 2 * alpha));
    }
    function finishTransfer() {
      if (!flight) return;
      flight = null;
      wheel.style.removeProperty("transform");
      delete document.body.dataset.clockTransfer;
      if (home) {
        gearEpoch = localTime().epoch;
        homeControl();
      } else { clock.reset(); fade(0); }
      refresh();
      if (!home) {
        updateGameControls();
        if (!el.primaryBtn.disabled && !judgeUI.mode && document.activeElement === document.body &&
            !document.querySelector("dialog[open]") && !document.hidden) {
          el.primaryBtn.focus({ preventScroll: true });
        }
      }
    }
    function transfer(toHome, firstBox) {
      release(); stopLoop();
      calibration = touchStart = lastTap = null;
      const from = clock.pose;
      const duration = toHome ? 960 : firstDrawMs;
      const arrival = localTime(Date.now() + duration);
      const target = toHome ? { minute: arrival.degrees % 360, hour: arrival.degrees / 12 } : clock.rest;
      const minute = forwardArc(from.minute, target.minute);
      // 两齿轮同时回到原始朝向的周期为主轮 1080°（30:18）。使用最近的等价姿态。
      const gear = toHome ? minute * .32 : shortest(-from.gear, 1080);
      home = toHome;
      if (home) { offset = dialGear = 0; gearOrigin = from.gear + gear; }
      wheel.style.removeProperty("transform");
      document.body.dataset.clockTransfer = home ? "home" : "game";
      if (matchMedia("(max-width: 980px)").matches) window.scrollTo({top:0, behavior:"instant"});
      flight = { start: performance.now(), duration, from, light,
        travel: {minute, hour:forwardArc(from.hour,target.hour), gear, orbit:shortest(-from.orbit,360)},
        fromBox:{x:firstBox.left + scrollX,y:firstBox.top + scrollY,w:firstBox.width},
        dx:0,dy:0,scale:1,rebase:0,lastEase:0 };
      homeControl();
      if (!animate()) { finishTransfer(); return; }
      layers();
      paintTransfer(0, flight.start);
      refresh();
    }
    toggle.addEventListener("change", () => {
      try { localStorage.setItem(preference, toggle.checked ? "on" : "off"); } catch { /* 当页仍可切换。 */ }
      refresh();
    });
    window.addEventListener("storage", event => {
      if (event.key !== preference && event.key !== null) return;
      toggle.checked = event.key === null || event.newValue !== "off"; refresh();
    });
    window.addEventListener("resize", () => { release(); resizeDust(); });
    window.addEventListener("blur", release);
    window.addEventListener("pagehide", () => { pageHidden = true; release(); refresh(); });
    window.addEventListener("pageshow", () => { pageHidden = false; refresh(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) release(); refresh(); });
    REDUCED_MOTION.addEventListener("change", refresh);
    forcedColors.addEventListener("change", refresh);
    return { setHome, transfer, get transferring() { return !!flight; } };
  }

  function createClock(svg, memoryTrack) {
    const ns = "http://www.w3.org/2000/svg";
    const ticks = svg.querySelector("#ticks");
    const markers = svg.querySelector("#hourMarkers");
    const minuteHand = svg.querySelector("#minuteHand");
    const hourHand = svg.querySelector("#hourHand");
    const initialMinuteAngle = minuteHand.transform.baseVal.getItem(0).angle;
    const initialHourAngle = hourHand.transform.baseVal.getItem(0).angle;
    const mainGear = svg.querySelector("#mainGear");
    const auxGear = svg.querySelector("#auxGear");
    const orbit = svg.querySelector("#orbitRing");
    const pressLever = svg.querySelector("#pressLever");
    const engraving = svg.querySelector("#dialEngraving");

    function add(parent, name, attributes) {
      const part = document.createElementNS(ns, name);
      for (const [key, value] of Object.entries(attributes)) part.setAttribute(key, value);
      parent.appendChild(part);
    }

    for (let minute = 0; minute < 60; minute++) {
      const major = minute % 5 === 0;
      const transform = `rotate(${minute * 6} 320 320)`;
      add(ticks, "line", { class: major ? "tick is-major" : "tick", x1: 320, y1: 26,
        x2: 320, y2: major ? 49 : 37, transform });
      if (!major) continue;
      add(engraving, "path", { class: "dial-engraving-mark", d: "M320 104l3.2 5-3.2 5-3.2-5z", transform });
      if (minute % 15 !== 0) {
        add(markers, "path", { class: "hour-lozenge", d: "M320 73l2.8 6-2.8 6-2.8-6z", transform });
      }
    }

    function buildGear(group, radius, teeth, spokes) {
      const inner = radius * .79;
      const hub = radius * .18;
      const outline = [];
      const toothProfile = [[-.5, -4.5], [-.32, -4.5], [-.24, -1.6], [-.16, 3.5],
        [.16, 3.5], [.24, -1.6], [.32, -4.5]];
      for (let tooth = 0; tooth < teeth; tooth++) {
        for (const [offset, distance] of toothProfile) {
          const angle = (tooth + offset) * 2 * Math.PI / teeth;
          const r = radius + distance;
          outline.push(`${(r * Math.cos(angle)).toFixed(2)},${(r * Math.sin(angle)).toFixed(2)}`);
        }
      }
      const bore = `M ${inner} 0 a ${inner} ${inner} 0 1 0 ${-2 * inner} 0 a ${inner} ${inner} 0 1 0 ${2 * inner} 0Z`;
      add(group, "path", { class: "gear-body", "fill-rule": "evenodd", d: "M" + outline.join(" L") + "Z " + bore });
      add(group, "circle", { class: "gear-engraving", r: radius - 6.5 });
      add(group, "circle", { class: "gear-engraving", r: inner + 2.3 });
      const width = radius * .048;
      const spoke = `M ${-hub * .56} ${-hub * .58} Q ${-width * 2.2} ${-inner * .54} ${-width} ${-inner - 1}
        h ${2 * width} Q ${-width * .35} ${-inner * .54} ${hub * .56} ${-hub * .58} Z`;
      for (let i = 0; i < spokes; i++) {
        add(group, "path", { class: "gear-body", d: spoke, transform: `rotate(${i * 360 / spokes})` });
      }
      add(group, "circle", { class: "gear-body", r: hub });
      add(group, "circle", { class: "gear-engraving", r: hub * .7 });
    }

    const mainTeeth = 30, auxTeeth = 18;
    buildGear(mainGear, 85, mainTeeth, 6);
    buildGear(auxGear, 51, auxTeeth, 5);
    // Two identical lengths of type keep the scrolling strip seamless.
    memoryTrack.append(memoryTrack.firstElementChild.cloneNode(true));

    const topSpeed = .78; // degrees per millisecond
    const accelerationMs = 290;
    const releaseMs = 165;
    let frame = 0;
    let speed = 0;
    let handTravel = 0;
    let gearTravel = 0;
    let leverLift = 0;
    const rest = { minute: initialMinuteAngle, hour: initialHourAngle, gear: 0, orbit: 0, lever: 0 };
    let pose = { ...rest };

    function smoothstep(progress) {
      const t = Math.max(0, Math.min(1, progress));
      return t * t * (3 - 2 * t);
    }

    function position(next) {
      if (next.minute !== pose.minute) minuteHand.setAttribute("transform", `rotate(${next.minute})`);
      if (next.hour !== pose.hour) hourHand.setAttribute("transform", `rotate(${next.hour})`);
      if (next.gear !== pose.gear) {
        mainGear.setAttribute("transform", `rotate(${next.gear})`);
        auxGear.setAttribute("transform", `rotate(${10 - next.gear * mainTeeth / auxTeeth})`);
      }
      if (next.orbit !== pose.orbit) orbit.setAttribute("transform", `rotate(${next.orbit})`);
      if (next.lever !== pose.lever) pressLever.setAttribute("transform", `rotate(${next.lever})`);
      pose = next;
    }

    function paint({ minute, hour, gear, orbitAngle, ink, lift }) {
      position({ minute: initialMinuteAngle - minute, hour: initialHourAngle - hour,
        gear: -gear, orbit: -orbitAngle, lever: -14 * lift });
      memoryTrack.style.transform = `translateY(${-(ink % 210) * 50 / 210}%)`;
    }

    function paintRewind(hand, gears, lift) {
      handTravel = hand;
      gearTravel = gears;
      leverLift = lift;
      paint({ minute: hand, hour: hand / 12, gear: gears * .32, orbitAngle: gears / 10, ink: hand, lift });
    }

    function cancel() {
      window.cancelAnimationFrame(frame);
      frame = 0;
    }

    function rewind() {
      cancel();
      speed = 0;
      if (REDUCED_MOTION.matches) {
        paintRewind(handTravel, gearTravel, 0);
        return;
      }
      const start = performance.now();
      const hand = handTravel, gears = gearTravel;
      const travel = (elapsed) => {
        const ramp = Math.min(elapsed, accelerationMs);
        return topSpeed * (ramp * ramp / (2 * accelerationMs) + Math.max(0, elapsed - accelerationMs));
      };
      function advance(now) {
        const elapsed = Math.max(0, now - start);
        speed = topSpeed * Math.min(1, elapsed / accelerationMs);
        paintRewind(hand + travel(elapsed), gears + travel(Math.max(0, elapsed - 60)), smoothstep(elapsed / releaseMs));
        frame = window.requestAnimationFrame(advance);
      }
      frame = window.requestAnimationFrame(advance);
    }

    function settle(onStop) {
      cancel();
      if (REDUCED_MOTION.matches) {
        frame = window.requestAnimationFrame(() => {
          frame = 0;
          speed = 0;
          paintRewind(handTravel, gearTravel, 0);
          onStop();
        });
        return;
      }
      const start = performance.now();
      const hand = handTravel, gears = gearTravel;
      const lift = leverLift;
      const entrySpeed = Math.max(speed, .16);
      const handBrake = 440, rebound = 130, gearLag = 48, gearBrake = 590;
      const duration = gearLag + gearBrake;
      // The hands pass a minute mark, then recoil while the wheels run out.
      const stop = Math.round((hand + entrySpeed * handBrake / 3) / 6) * 6;
      const overshoot = 2.2;
      const easeOut = (p) => 1 - (1 - Math.min(1, p)) ** 3;
      function advance(now) {
        const elapsed = Math.max(0, now - start);
        const recoil = Math.min(1, Math.max(0, elapsed - handBrake) / rebound);
        const hands = elapsed < handBrake
          ? hand + (stop + overshoot - hand) * easeOut(elapsed / handBrake)
          : stop + overshoot * (1 + Math.cos(Math.PI * recoil)) / 2;
        const runout = entrySpeed * Math.min(elapsed, gearLag) +
          entrySpeed * gearBrake / 3 * easeOut(Math.max(0, elapsed - gearLag) / gearBrake);
        paintRewind(hands, gears + runout, lift * smoothstep((duration - elapsed) / releaseMs));
        if (elapsed < duration) {
          frame = window.requestAnimationFrame(advance);
        } else {
          frame = 0;
          speed = 0;
          onStop();
        }
      }
      frame = window.requestAnimationFrame(advance);
    }

    function turnOnce(duration, onBrake, onStop) {
      cancel();
      if (REDUCED_MOTION.matches) {
        frame = window.requestAnimationFrame(() => {
          frame = 0;
          onBrake();
          onStop();
        });
        return;
      }

      const start = performance.now();
      const hand = handTravel, gears = gearTravel;
      let braking = false;
      function advance(now) {
        const elapsed = Math.max(0, now - start);
        if (!braking && elapsed >= duration - 570) {
          braking = true;
          onBrake();
        }
        if (elapsed >= duration) {
          // Carry the hour advance into the next draw while the gears return to their starting angles.
          paintRewind(hand + 360, gears, 0);
          frame = 0;
          onStop();
          return;
        }
        const turn = smoothstep(elapsed / duration);
        const minute = hand + 360 * turn;
        const gearTurns = 3 * smoothstep((elapsed - 60) / (duration - 60));
        paint({
          minute,
          hour: minute / 12,
          gear: gears * .32 + 360 * gearTurns,
          orbitAngle: gears / 10 + 360 * turn,
          ink: hand + duration * .64 * turn,
          lift: smoothstep(Math.min(elapsed, duration - elapsed) / releaseMs)
        });
        frame = window.requestAnimationFrame(advance);
      }
      frame = window.requestAnimationFrame(advance);
    }

    function reset() {
      cancel();
      speed = 0;
      paintRewind(0, 0, 0);
    }

    return { rewind, settle, turnOnce, cancel, reset, rest, position, get pose() { return pose; } };
  }

  function updateStepperButtons() {
    const value = Number.parseInt(el.peopleInput.value, 10);
    el.minusBtn.disabled = !Number.isFinite(value) || value <= 2;
    el.plusBtn.disabled = !Number.isFinite(value) || value >= 99;
  }

  let countAnimations = [];

  function stopCountMotion() {
    const previous = countAnimations;
    countAnimations = [];
    for (const animation of previous) animation.cancel();
    el.peopleInput.removeAttribute("data-count-motion");
    el.peopleReel.hidden = true;
    el.peopleReel.replaceChildren();
  }

  function playCountMotion(previous, next) {
    if (REDUCED_MOTION.matches || previous === next || !/^\d+$/.test(previous)) return;
    const style = getComputedStyle(el.stepper);
    const distance = Math.sign(Number(next) - Number(previous)) * parseFloat(style.getPropertyValue("--stepper-travel"));
    const blur = "blur(" + style.getPropertyValue("--stepper-blur").trim() + ")";
    const options = {
      duration: parseFloat(style.getPropertyValue("--motion-standard")),
      easing: style.getPropertyValue("--ease-enter").trim(),
      fill: "both"
    };
    const outgoing = document.createElement("span");
    const incoming = document.createElement("span");
    outgoing.textContent = previous;
    incoming.textContent = next;
    el.peopleReel.replaceChildren(outgoing, incoming);
    el.peopleReel.hidden = false;
    el.peopleInput.setAttribute("data-count-motion", "");
    const shift = (value) => "translateY(" + value + "px)";
    const run = countAnimations = [
      outgoing.animate([
        { transform: shift(0), opacity: 1, filter: "blur(0px)" },
        { transform: shift(-distance * .45), opacity: .5, filter: blur, offset: .45 },
        { transform: shift(-distance), opacity: 0, filter: blur }
      ], options),
      incoming.animate([
        { transform: shift(distance), opacity: 0, filter: blur },
        { transform: shift(distance * .45), opacity: .5, filter: blur, offset: .45 },
        { transform: shift(0), opacity: 1, filter: "blur(0px)" }
      ], options)
    ];
    Promise.allSettled(run.map((animation) => animation.finished)).then(() => {
      if (countAnimations === run) stopCountMotion();
    });
  }

  function setCount(value, animate = false) {
    const previous = el.peopleInput.value;
    const next = String(Math.min(99, Math.max(2, value)));
    stopCountMotion();
    el.peopleInput.value = next;
    el.peopleInput.classList.remove("has-error");
    el.stepper.classList.remove("has-error");
    el.formError.textContent = "";
    updateStepperButtons();
    if (animate) playCountMotion(previous, next);
  }

  function readPlayerCount() {
    const raw = el.peopleInput.value.trim();
    const value = Number(raw);
    if (!/^\d+$/.test(raw) || !Number.isInteger(value) || value < 2 || value > 99) {
      el.formError.textContent = "请输入 2–99 之间的整数。";
      el.stepper.classList.add("has-error");
      el.peopleInput.focus();
      return null;
    }
    return value;
  }

  function showSetup() {
    const firstBox = el.wheelWrap.getBoundingClientRect();
    state.personToken += 1;
    clearTimers();
    judgeUI.closeInline();
    state.phase = "setup";
    state.roundId = "";
    state.resumedSave = null;
    state.currentPlayer = null;
    state.previousPlayer = null;
    state.candidates = [];
    state.legacyPoolIds = null;
    state.budget = 0;
    state.judge = null;
    state.seenIds.clear();
    state.history = [];
    state.currentQuestion = null;
    state.pendingQuestion = null;
    updateGameControls();
    state.playerCount = 4;

    updateSetup();
    el.personNumber.textContent = "00";
    el.personNumber.classList.remove("is-rolling");
    clearQuestion();
    el.primaryBtn.textContent = "抽人中";
    el.primaryBtn.disabled = true;
    el.rerollBtn.hidden = true;
    el.homeChoices.close();
    el.homeBtn.hidden = true;
    el.remainingText.hidden = true;
    el.judgeEntry.hidden = true;
    el.gameView.hidden = true;
    el.setupView.hidden = false;
    el.body.dataset.view = "setup";
    el.liveStatus.textContent = "";
    el.peopleTotal.textContent = "共 4 人";
    updateSavedRound();
    homeAtmosphere.transfer(true, firstBox);
  }

  function startGame(previousSave) {
    const count = readPlayerCount();
    if (count === null) return;
    const options = updateSetup();
    if (!options) return;
    const candidates = eligibleQuestions(options);
    const budget = options.count ?? candidates.length;
    const initial = JudgeSelection.preferences({ sequence: el.drawOrder.value });
    function begin(settings) {
      if (!forgetSave(previousSave)) {
        el.formError.textContent = "无法清除旧存档，请重试。";
        return;
      }
      state.playerCount = count;
      state.selectionOptions = options;
      state.candidates = candidates;
      state.budget = budget;
      state.judge = JudgeSelection.createState(settings, randomInt);
      state.roundId = `${Date.now().toString(36)}-${randomInt(0x1000000).toString(36)}`;
      el.drawOrder.value = state.judge.sequence;
      showGame();
      drawPerson(true);
    }
    if (!el.guideEnabled.checked) return begin(initial);
    judgeUI.open(initial, settings => ({
      budget, available: JudgeSelection.remaining(candidates, state.seenIds, settings.excludedScopes).length
    }), begin);
  }

  function showGame() {
    const firstBox = el.wheelWrap.getBoundingClientRect();
    state.personToken += 1;
    clearTimers();
    state.currentPlayer = null;
    state.currentQuestion = null;
    state.pendingQuestion = null;
    state.phase = "between";

    el.peopleInput.classList.remove("has-error");
    el.stepper.classList.remove("has-error");
    el.formError.textContent = "";
    el.peopleTotal.textContent = `共 ${padNumber(state.playerCount)} 人`;
    el.gameView.hidden = false;
    el.setupView.hidden = true;
    el.homeBtn.hidden = false;
    el.remainingText.hidden = false;
    el.judgeEntry.hidden = false;
    el.body.dataset.view = "game";
    el.personNumber.textContent = "—";
    el.personNumber.classList.remove("is-rolling");
    clearQuestion();
    homeAtmosphere.transfer(false, firstBox);
    updateGameControls();

    el.gameView.classList.remove("view-in");
    void el.gameView.offsetWidth;
    el.gameView.classList.add("view-in");
  }

  function pickPlayer() {
    if (state.selectionOptions.playerOrder === "sequential" && state.previousPlayer !== null) {
      return (state.previousPlayer % state.playerCount) + 1;
    }
    return 1 + randomInt(state.playerCount);
  }

  function drawPerson(focus = false, drawNextQuestion = false) {
    const token = ++state.personToken;
    const player = pickPlayer();
    state.currentPlayer = player;
    state.phase = "drawing-person";
    updateGameControls();

    el.personNumber.classList.add("is-rolling");
    clearQuestion();
    state.currentQuestion = null;

    const rollDuration = REDUCED_MOTION.matches ? 40 : state.previousPlayer === null && !state.seenIds.size ? firstDrawMs : nextDrawMs;

    if (REDUCED_MOTION.matches) {
      el.personNumber.textContent = padNumber(player);
    } else {
      let display = state.previousPlayer ?? 1 + randomInt(state.playerCount);
      el.personNumber.textContent = padNumber(display);
      let landed = false;
      // 两端稍慢，中段密集。沿用五次随机预览，在它们之间插入相邻号码。
      const beats = [75, 132, 177, 216, 252, 286, 320, 357, 401, 458, 534, 640];
      beats.forEach((delay, index) => {
        setTimer(() => {
          if (landed || token !== state.personToken || state.phase !== "drawing-person") return;
          if (index === beats.length - 1 || REDUCED_MOTION.matches) {
            landed = true;
            display = player;
          } else {
            const sample = index % 2 === 1 ? 1 + randomInt(state.playerCount) : display;
            display = sample === display ? display % state.playerCount + 1 : sample;
          }
          const number = padNumber(display);
          if (el.personNumber.textContent !== number) el.personNumber.textContent = number;
        }, delay / 760 * rollDuration);
      });
    }

    setTimer(() => {
      if (token !== state.personToken || state.phase !== "drawing-person") return;
      revealPlayer(player);
      if (drawNextQuestion) startRewind(true);
      if (focus && !el.primaryBtn.disabled && document.activeElement === document.body && !document.querySelector("dialog[open]")) {
        el.primaryBtn.focus({ preventScroll: true });
      }
    }, rollDuration);
  }

  function revealPlayer(player) {
    state.currentPlayer = player;
    state.previousPlayer = player;
    state.phase = "ready";
    updateGameControls();
    el.personNumber.textContent = padNumber(player);
    el.personNumber.classList.remove("is-rolling");
    el.liveStatus.textContent = `轮到 ${player} 号，共 ${state.playerCount} 人。`;
  }

  function takeQuestion() {
    return remainingBudget() ? JudgeSelection.draw(availableQuestions(), state.judge, randomInt) : null;
  }

  function updateGameControls() {
    const { phase } = state;
    const inline = Boolean(judgeUI.mode);
    const checkIn = judgeUI.mode === "check-in";
    const leavingCheckIn = checkIn && state.judge.checkIn.status === "done";
    const budget = remainingBudget();
    const remaining = budget ? Math.min(budget, availableQuestions().length) : 0;
    const running = phase === "rewinding";
    const stable = !questionExit && ["ready", "question", "between"].includes(phase);
    const canDraw = !inline && remaining > 0 && (phase === "ready" || phase === "question");
    if (phase !== "setup") {
      el.wheelWrap.disabled = homeAtmosphere.transferring || (!running && !canDraw);
      el.wheelWrap.setAttribute("aria-label", running ? "停止时间回溯并抽题" : "启动时间回溯");
      el.wheelWrap.setAttribute("aria-pressed", String(running));
    }
    el.judgeEntry.disabled = !stable || leavingCheckIn;
    el.remainingText.textContent = remaining ? `剩余 ${remaining} 题` : budget ? "暂无可抽题目" : "题目已抽完";
    el.rerollBtn.hidden = !checkIn && (phase !== "question" || !remaining);
    el.rerollBtn.disabled = leavingCheckIn;
    el.rerollBtn.textContent = checkIn ? "跳过问询" : "换一道题";
    el.actionRow.hidden = phase === "end";
    el.primaryBtn.disabled = checkIn ? leavingCheckIn : inline || !(phase === "question" || (stable && remaining > 0));
    if (homeAtmosphere.transferring && phase !== "setup") {
      el.primaryBtn.disabled = el.rerollBtn.disabled = el.judgeEntry.disabled = true;
    }
    el.primaryBtn.textContent = checkIn ? "下一题" : {
      "drawing-person": "抽人中",
      ready: "转动转盘",
      rewinding: "时间回溯中...",
      spinning: "时间回溯中...",
      settling: "定格中...",
      question: !budget ? "完成本局" : remaining ? "下一位" : "完成本题",
      between: "下一位"
    }[phase] ?? "抽人中";
    el.roundPoolNotice.hidden = checkIn || !stable || remaining >= budget;
    if (!el.roundPoolNotice.hidden) {
      const canExpand = state.candidates.some((question) => !state.seenIds.has(question.id));
      el.roundPoolNotice.textContent = remaining
        ? `当前范围可抽${remaining}/${budget}题`
        : canExpand ? "当前范围没有可抽题目，可呼唤法官调整回避范围。" : "本局筛选范围内的题目已抽完。";
    }
  }

  function showStream(motion) {
    el.memoryWindow.hidden = !motion;
    if (motion) el.questionArea.dataset.motion = motion;
    else delete el.questionArea.dataset.motion;
  }

  function clearQuestion(motion = null) {
    el.questionCopy.scrollTop = 0;
    showStream(motion);
    el.questionText.textContent = "";
    el.questionText.classList.remove("is-revealed");
    el.questionHead.classList.remove("is-revealed");
    resetQuestionHead();
    el.questionEmpty.hidden = Boolean(motion);
  }

  function startRewind(automatic) {
    if (homeAtmosphere.transferring || judgeUI.mode || !["ready", "question"].includes(state.phase) || state.currentPlayer === null ||
        !remainingBudget() || !availableQuestions().length) return;
    const duration = state.phase === "question" ? 2450 : 3650;
    state.pendingQuestion = automatic ? takeQuestion() : null;
    state.phase = automatic ? "spinning" : "rewinding";
    state.currentQuestion = null;
    clearQuestion("running");
    el.liveStatus.textContent = automatic ? "正在回溯。" : "时间回溯中，再点表盘停下。";
    updateGameControls();
    if (automatic) clock.turnOnce(duration, beginSettling, finishSpin);
    else clock.rewind();
  }

  function beginSettling() {
    state.phase = "settling";
    updateGameControls();
    showStream("settling");
    el.liveStatus.textContent = "表盘正在减速。";
  }

  function stopRewind() {
    state.pendingQuestion = takeQuestion();
    if (!state.pendingQuestion) {
      clock.cancel();
      clearQuestion();
      revealPlayer(state.currentPlayer);
      return;
    }
    beginSettling();
    clock.settle(finishSpin);
  }

  function toggleRewind() {
    if (state.phase === "rewinding") stopRewind();
    else startRewind(false);
  }

  function resetQuestionHead() {
    el.questionIndex.textContent = "问题";
    el.questionIndex.classList.remove("has-number");
  }

  function setQuestionHead(question) {
    el.questionIndex.textContent = question.id;
    el.questionIndex.classList.add("has-number");
  }

  function finishSpin() {
    const question = state.pendingQuestion;
    if (state.phase !== "settling" || !question) return;
    state.pendingQuestion = null;
    state.seenIds.add(question.id);
    state.history.push({ id: question.id, question: question.question });
    if (document.getElementById("roundHistory")?.open) renderRoundHistory(state.history);
    state.phase = "question";
    displayQuestion(question, true);
  }

  function displayQuestion(question, animate = false) {
    state.currentQuestion = question;
    showStream(null);
    setQuestionHead(question);
    el.questionEmpty.hidden = true;
    el.questionText.textContent = question.question;
    el.questionText.classList.toggle("is-revealed", animate);
    el.questionHead.classList.toggle("is-revealed", animate);
    updateGameControls();
    el.liveStatus.textContent = `轮到 ${state.currentPlayer} 号。${question.id}。${question.question}`;
  }

  function restoreDisplayedTurn(turn) {
    state.phase = turn.phase;
    state.currentPlayer = turn.player;
    if (turn.player) el.personNumber.textContent = padNumber(turn.player);
    const question = turn.question;
    if (!question) return updateGameControls();
    const record = bank.questions.find(({ id }) => id === question.id);
    displayQuestion({ ...record, ...question });
  }

  function showCheckIn() {
    const check = state.judge.checkIn;
    judgeUI.openCheckIn(state.judge.temperature, check.choice, choice => { check.choice = choice; });
  }

  function finishCheckIn(skip) {
    const check = state.judge.checkIn;
    if (check.status !== "pending" || judgeUI.mode !== "check-in") return;
    const levels = JudgeSelection.temperatures;
    const delta = skip ? 0 : check.choice || 0;
    state.judge.temperature = levels[levels.indexOf(state.judge.temperature) + delta] ?? state.judge.temperature;
    check.status = "done";
    delete check.choice;
    updateGameControls();
    judgeUI.leaveCheckIn(() => advanceTurn(true, true));
  }

  function advanceTurn(focus = false, drawNextQuestion = false) {
    if (state.phase !== "between" || judgeUI.mode || questionExit) return;
    const { checkIn, completedQuestions } = state.judge;
    if (checkIn.status === "waiting" && completedQuestions >= checkIn.triggerAt && remainingBudget() &&
        state.candidates.some((question) => !state.seenIds.has(question.id))) {
      checkIn.status = "pending";
      showCheckIn();
      return;
    }
    if (remainingBudget() && availableQuestions().length) drawPerson(focus, drawNextQuestion);
    else updateGameControls();
  }

  async function completeQuestion() {
    state.judge.completedQuestions += 1;
    if (!remainingBudget()) {
      state.phase = "end";
      updateGameControls();
      el.liveStatus.textContent = "题目已全部抽完。";
      return;
    }
    state.phase = "between";
    state.currentPlayer = state.currentQuestion = null;
    if (!REDUCED_MOTION.matches) {
      const style = getComputedStyle(el.questionCopy);
      const fade = el.questionCopy.animate([{ opacity: 1 }, { opacity: 0 }], {
        duration: parseFloat(style.getPropertyValue("--motion-standard")),
        easing: style.getPropertyValue("--ease-exit").trim(),
        fill: "forwards"
      });
      questionExit = fade;
      updateGameControls();
      await Promise.allSettled([fade.finished]);
      if (questionExit !== fade) return;
      questionExit = null;
      fade.cancel();
    }
    clearQuestion();
    advanceTurn(true);
  }

  function handlePrimary() {
    if (judgeUI.mode === "check-in") return finishCheckIn(false);
    if (judgeUI.mode || questionExit) return;
    if (state.phase === "ready") startRewind(true);
    else if (state.phase === "question") void completeQuestion();
    else if (state.phase === "between") advanceTurn(true);
  }

  function handleReroll() {
    if (judgeUI.mode === "check-in") return finishCheckIn(true);
    if (state.phase === "question") startRewind(true);
  }

  function openJudgeAdjustment() {
    if (el.judgeEntry.disabled) return;
    if (judgeUI.mode === "adjust") {
      judgeUI.dismissSettings();
      return;
    }
    el.questionText.classList.remove("is-revealed");
    el.questionHead.classList.remove("is-revealed");
    const fromCheckIn = judgeUI.mode === "check-in";
    if (state.judge.checkIn.status === "waiting") state.judge.checkIn.status = "done";
    judgeUI.openAdjustment(state.judge, (settings) => ({
      budget: remainingBudget(),
      available: availableQuestions(settings).length
    }), (settings) => {
      if (settings.sequence !== state.judge.sequence) state.judge.sequenceStartAt = state.judge.completedQuestions;
      if (fromCheckIn && settings.temperature !== state.judge.temperature) {
        state.judge.checkIn.status = "done";
        delete state.judge.checkIn.choice;
      }
      Object.assign(state.judge, settings);
      el.drawOrder.value = state.judge.sequence;
    }, fromCheckIn ? () => {
      if (state.judge.checkIn.status === "pending") showCheckIn();
      else advanceTurn(true, true);
    } : null);
  }

  function returnToSetup() {
    const previousCount = state.playerCount;
    showSetup();
    el.peopleInput.value = String(previousCount || 4);
    updateStepperButtons();
    el.startBtn.focus({ preventScroll: true });
  }

  initFilters();
  initMobileMenus();
  const questionOverflow = new ResizeObserver(() => {
    if (el.questionCopy.scrollHeight > el.questionCopy.clientHeight) el.questionCopy.tabIndex = 0;
    else el.questionCopy.removeAttribute("tabindex");
  });
  questionOverflow.observe(el.questionCopy);
  questionOverflow.observe(el.questionText);
  initFilterMenu();
  homeAtmosphere.setHome();
  updateSetup();
  updateStepperButtons();
  updateSavedRound();

  el.filters.addEventListener("input", updateSetup);

  el.startForm.addEventListener("submit", (event) => {
    event.preventDefault();
    updateSavedRound();
    if (el.resumeBtn.disabled) startGame(readSavedRound());
    else el.sessionChoices.showModal();
  });

  el.minusBtn.addEventListener("click", () => {
    const value = Number.parseInt(el.peopleInput.value, 10) || 2;
    setCount(value - 1, true);
  });

  el.plusBtn.addEventListener("click", () => {
    const value = Number.parseInt(el.peopleInput.value, 10) || 2;
    setCount(value + 1, true);
  });

  el.peopleInput.addEventListener("focus", stopCountMotion);
  el.peopleInput.addEventListener("input", () => {
    stopCountMotion();
    el.formError.textContent = "";
    el.stepper.classList.remove("has-error");
    updateStepperButtons();
  });

  el.peopleInput.addEventListener("blur", () => {
    const value = Number(el.peopleInput.value);
    if (el.peopleInput.value.trim() === "") {
      updateStepperButtons();
      return;
    }
    if (Number.isInteger(value) && value >= 2 && value <= 99) {
      setCount(value);
    }
  });

  REDUCED_MOTION.addEventListener("change", () => {
    if (REDUCED_MOTION.matches) {
      stopCountMotion();
      questionExit?.finish();
    }
    if (state.phase === "rewinding") clock.rewind();
    else if (REDUCED_MOTION.matches && ["spinning", "settling"].includes(state.phase)) {
      beginSettling();
      clock.settle(finishSpin);
    }
  });
  el.wheelWrap.addEventListener("click", toggleRewind);
  el.primaryBtn.addEventListener("click", handlePrimary);
  el.rerollBtn.addEventListener("click", handleReroll);
  el.judgeEntry.addEventListener("click", openJudgeAdjustment);
  el.homeBtn.addEventListener("click", openHomeChoices);
  const scrollbarTimers = new WeakMap();
  const scrollbarFades = new WeakMap();
  const systemScrollbars = matchMedia("(forced-colors: active)");
  function showScrollbar(scroller, active) {
    const previous = getComputedStyle(scroller).scrollbarColor;
    scrollbarFades.get(scroller)?.cancel();
    scroller.toggleAttribute("data-scroll-active", active);
    if (!REDUCED_MOTION.matches && !systemScrollbars.matches) {
      const fade = scroller.animate([
        { scrollbarColor: previous },
        { scrollbarColor: active ? "#81827b transparent" : "transparent transparent" }
      ], { duration: active ? 144 : 264, easing: "ease-out" });
      scrollbarFades.set(scroller, fade);
    }
  }
  document.addEventListener("scroll", (event) => {
    const scroller = event.target === document ? document.scrollingElement : event.target;
    if (!(scroller instanceof Element) || systemScrollbars.matches) return;
    if (!scroller.hasAttribute("data-scroll-active")) showScrollbar(scroller, true);
    clearTimeout(scrollbarTimers.get(scroller));
    scrollbarTimers.set(scroller, setTimeout(() => showScrollbar(scroller, false), 750));
  }, { capture: true, passive: true });
  el.homeSave.addEventListener("click", saveAndReturn);
  document.getElementById("homeDiscard").addEventListener("click", () => {
    const saved = readSavedRound();
    if (saved && JSON.stringify(saved) === state.resumedSave && !forgetSave(saved)) {
      showHomeFeedback("无法清除本次存档，请重试。");
      return;
    }
    returnToSetup();
  });
  el.resumeBtn.addEventListener("click", () => {
    el.sessionChoices.close();
    resumeGame();
  });
  el.newSession.addEventListener("click", () => {
    const previousSave = readSavedRound();
    el.sessionChoices.close();
    startGame(previousSave);
  });
  document.getElementById("roundHistoryBtn")?.addEventListener("click", () => openRoundHistory(state.history));
  document.getElementById("savedHistoryBtn")?.addEventListener("click", () => {
    const saved = readSavedRound();
    if (saved) openRoundHistory(historyFromSave(saved));
  });
  window.addEventListener("storage", (event) => {
    if (event.key === SAVED_ROUND_KEY || event.key === null) updateSavedRound();
  });
})();
</script>
</body>
</html>
