<script>
(() => {
  window.__syncThemeMeta = (theme) => {
    const night = theme === "night";
    const assets = window.__themeIconAssets?.[night ? "night" : "day"];
    const scheme = document.querySelector('meta[name="color-scheme"]');
    if (scheme) scheme.setAttribute("content", night ? "dark" : "light");
    if (!assets) return;
    const themeColor = document.querySelector('meta[name="theme-color"]');
    if (themeColor) themeColor.setAttribute("content", assets.color);
    if (assets.og) {
      for (const sel of ['meta[property="og:image"]', 'meta[name="twitter:image"]']) {
        const tag = document.querySelector(sel);
        if (tag) tag.setAttribute("content", assets.og);
      }
    }
    if (assets.desc) {
      for (const sel of ['meta[property="og:description"]', 'meta[name="twitter:description"]']) {
        const tag = document.querySelector(sel);
        if (tag) tag.setAttribute("content", assets.desc);
      }
    }
    const head = document.head;
    if (!head) return;
    for (const old of head.querySelectorAll("link[data-theme-icon]")) old.remove();
    const specs = [];
    if (assets.png) {
      specs.push({ rel: "icon", type: "image/png", sizes: "180x180", href: assets.png, kind: "png" });
      specs.push({ rel: "shortcut icon", href: assets.png, kind: "shortcut" });
      specs.push({ rel: "apple-touch-icon", sizes: "180x180", href: assets.png, kind: "apple" });
    }
    if (assets.png512) {
      specs.push({ rel: "icon", type: "image/png", sizes: "512x512", href: assets.png512, kind: "png512" });
    }
    if (assets.svg) {
      specs.push({ rel: "icon", type: "image/svg+xml", href: assets.svg, kind: "svg" });
    }
    for (const spec of specs) {
      const link = document.createElement("link");
      link.rel = spec.rel;
      if (spec.type) link.type = spec.type;
      if (spec.sizes) link.sizes = spec.sizes;
      link.href = spec.href;
      link.dataset.themeIcon = spec.kind;
      head.appendChild(link);
    }
  };
  try {
    const queryTheme = new URLSearchParams(location.search).get("theme");
    let theme = "day";
    if (queryTheme === "night" || queryTheme === "day") {
      theme = queryTheme;
      try { localStorage.setItem("truth-wheel/theme/v1", theme); } catch {}
    } else if (localStorage.getItem("truth-wheel/theme/v1") === "night") {
      theme = "night";
    }
    if (theme === "night") document.documentElement.dataset.theme = "night";
    else delete document.documentElement.dataset.theme;
    window.__syncThemeMeta(theme);
  } catch {}
})();
</script>

    opacity: 0;
    transform: rotate(28deg) scale(0.82);
    pointer-events: none;

    opacity: 0;
    transform: rotate(-28deg) scale(0.82);
  }

  :root[data-theme="night"] .brand-mark-moon {
    opacity: 1;
    transform: none;
  }

  .brand-mark svg,
  .brand-mark-moon svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  :root[data-theme-ripple] .brand-mark-host {
    view-transition-name: brand-theme-mark;
  }
  ::view-transition-group(root) {
    animation: none;
  }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) {
    z-index: 2;
    will-change: clip-path;
  }
  ::view-transition-group(brand-theme-mark) {
    z-index: 3;
    animation-duration: var(--motion-theme);
  }
  ::view-transition-old(brand-theme-mark) {
    animation: brand-mark-out var(--motion-theme) var(--ease-enter) both;
  }
  ::view-transition-new(brand-theme-mark) {
    animation: brand-mark-in var(--motion-theme) var(--ease-enter) both;
  }
  @keyframes brand-mark-out {
    from { opacity: 1; transform: none; }
    to { opacity: 0; transform: rotate(-28deg) scale(0.82); }
  }
  @keyframes brand-mark-in {
    from { opacity: 0; transform: rotate(28deg) scale(0.82); }
    to { opacity: 1; transform: none; }

  .clock-face { fill: var(--clock-face); stroke: var(--clock-rim); stroke-width: 1.4; }
  .clock-hairline { fill: none; stroke: var(--clock-hairline); stroke-width: 1; opacity: var(--clock-hairline-opacity); }

  .orbit-track { fill: none; stroke: var(--clock-orbit); stroke-width: 1.2; }

    .fluid-slider__explanation[data-open] .fluid-slider__summary:focus-visible {
      outline: 2px solid var(--focus);
    }
  }

  .fluid-slider__explanation--compact {
    display: grid;
    place-items: center;
    min-block-size: 44px;
  }

  .fluid-slider__text-toggle {
    inline-size: fit-content;
    max-inline-size: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .fluid-slider__text-toggle:focus-visible { outline: 2px solid var(--focus); }
  .fluid-slider__text-detail,
  .fluid-slider__explanation--compact[data-open] .fluid-slider__caption { display: none; }
  .fluid-slider__explanation--compact[data-open] .fluid-slider__text-detail { display: inline; }

  .fluid-slider__hit {
    position: relative;
    height: 56px;
    touch-action: pan-y pinch-zoom;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    --position: 0px;
    --unfilled: 100%;
  }

  .fluid-slider__rail {
    position: absolute;
    inset: calc((100% - var(--rail-height)) / 2) 0;
    overflow: hidden;
    border-radius: 99px;
    background: var(--rail);
    box-shadow: var(--rail-shadow);
    pointer-events: none;
  }

  .fluid-slider__water {
    position: absolute;
    inset: 0;
    clip-path: inset(0 var(--unfilled) 0 0);
    background: var(--water-sheen), var(--water);
  }

  .fluid-slider__particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .fluid-slider__lane {
    position: absolute;
    inset: 0 var(--end-inset) 0 var(--start-inset);
    pointer-events: none;
  }

  .fluid-slider__tick {
    position: absolute;
    left: var(--stop);
    top: 50%;
    width: 6px;
    height: 6px;
    background: var(--tick);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: background-color 100ms;
  }

  .fluid-slider__tick[data-filled="true"] { visibility: hidden; }
  .fluid-slider__tick[data-selected="true"] {
    background: var(--tick-selected-bg);
    box-shadow: 0 0 0 2px var(--tick-selected-ring);
  }

  .fluid-slider__thumb {
    position: absolute;
    top: 50%;
    left: 0;
    width: var(--thumb-size);
    height: var(--thumb-size);
    transform: translate(var(--position), -50%) translateX(-50%);
  }

  .fluid-slider__thumb::before {
    content: "";
    position: absolute;
    inset: -1px;
    border: 1.5px solid var(--thumb-halo-border);
    border-radius: 50%;
    box-shadow: 0 0 9px 3px var(--thumb-halo-glow);
    opacity: 0;
    pointer-events: none;
    transform: scale(1);
    transition: opacity 240ms ease-out, transform 240ms ease-out;
  }

  .fluid-slider__face {
    position: absolute;
    inset: 0;
    z-index: 1;
    border: 1px solid var(--thumb-border);
    border-radius: 50%;
    background: var(--thumb-bg);
    box-shadow: var(--thumb-shadow);
    transform: scale(var(--shape-x, 1), var(--shape-y, 1));
    transition: transform var(--shape-time) cubic-bezier(.2, .7, .25, 1),
                box-shadow var(--shape-time) ease-out;
  }

  @keyframes fluid-slider-halo-breath {
    0%, 100% {
      transform: scale(1);
      opacity: 0;
    }
    50% {
      transform: scale(1.13);
      opacity: 0.88;
    }
  }

  @keyframes fluid-slider-face-breath {
    0%, 100% {
      scale: 1;
      box-shadow: var(--thumb-shadow);
    }
    50% {
      scale: 1.032;
      box-shadow: var(--thumb-shadow-breath);
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .fluid-slider[data-off-default="true"][data-phase="idle"] .fluid-slider__thumb::before {
      animation: fluid-slider-halo-breath 3.8s ease-in-out 220ms infinite;
    }

    .fluid-slider[data-off-default="true"][data-phase="idle"] .fluid-slider__face {
      animation: fluid-slider-face-breath 3.8s ease-in-out 220ms infinite;
    }
  }

  .fluid-slider[data-phase="hover"] { --shape-x: 1.06; --shape-y: 1.06; --shape-time: 90ms; }
  .fluid-slider[data-phase="pressed"] { --shape-x: .96; --shape-y: .95; --shape-time: 95ms; }
  .fluid-slider[data-phase="dragging"] { --shape-x: 1.07; --shape-y: .97; --shape-time: 105ms; }
  .fluid-slider[data-phase="settling"] { --shape-time: 170ms; }

  .fluid-slider[data-phase="pressed"] .fluid-slider__face,
  .fluid-slider[data-phase="dragging"] .fluid-slider__face {
    box-shadow: var(--thumb-shadow-active);
  }

  .fluid-slider__input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    pointer-events: none;
  }

  .fluid-slider[data-over-thumb] .fluid-slider__hit { cursor: grab; }
  .fluid-slider[data-phase="dragging"] .fluid-slider__hit,
  .fluid-slider[data-phase="pressed"][data-over-thumb] .fluid-slider__hit { cursor: grabbing; }

  .fluid-slider:not([data-pointer-focus]) .fluid-slider__hit:has(.fluid-slider__input:focus-visible) .fluid-slider__thumb {
    outline: 2px solid var(--focus);
    outline-offset: 4px;
    border-radius: 50%;
  }

  @media (prefers-reduced-motion: reduce) {
    .fluid-slider__face, .fluid-slider__tick, .fluid-slider__thumb::before { transition: none; }
    .fluid-slider__face, .fluid-slider__thumb::before { animation: none; }
    .fluid-slider__thumb::before { opacity: 0; }
    .fluid-slider__face { transform: none; }
    .fluid-slider__caption, .fluid-slider__chevron,
    .fluid-slider__close, .fluid-slider__detail { transition: none; }
  }

  @media (forced-colors: active) {
    .fluid-slider { --focus: Highlight; }
    .fluid-slider__rail, .fluid-slider__water, .fluid-slider__tick, .fluid-slider__face {
      forced-color-adjust: none;
    }
    .fluid-slider__rail { border: 1px solid CanvasText; background: Canvas; }
    .fluid-slider__water { background: Highlight; }
    .fluid-slider__particles { display: none; }
    .fluid-slider__thumb::before { display: none; }
    .fluid-slider__face { border: 2px solid CanvasText; background: Canvas; box-shadow: none; }
    .fluid-slider__tick { background: CanvasText; }
    .fluid-slider__tick[data-selected="true"] { background: CanvasText; box-shadow: 0 0 0 2px Canvas; }
  }
</style>
<style id="productWaterPopover">

    transition: opacity var(--motion-micro) var(--ease-exit), clip-path var(--motion-micro) var(--ease-exit),
      transform var(--motion-micro) var(--ease-exit), display var(--motion-micro) allow-discrete,
      overlay var(--motion-micro) allow-discrete;
  }

    --popover-shift-y: calc(-1 * var(--popover-travel));
  }
  .judge-slider .judge-water-popover[data-side="up"] {
    --popover-closed: inset(100% 0 0 0);
    --popover-shift-x: 0px;
    --popover-shift-y: var(--popover-travel);
  }
  .judge-slider .judge-water-explanation .judge-water-popover:popover-open { display: block; }
  @media (max-width: 980px) {

</style>
