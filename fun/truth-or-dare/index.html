<script id="questionSelector">
"use strict";

const QuestionSelector = (() => {
  const globalExclusions = ["politics", "religion", "sexual_history", "trauma"];
  const roleExclusions = [
    "work_conflict", "manager_conflict", "personal_privacy",
    "financial_privacy", "dating_history", "group_interaction"
  ];
  const intersects = (values, list) => list.some((value) => values.has(value));

  function eligibility(bank, options = {}) {
    const { taxonomy, questions } = bank;
    const {
      scene = "friends", familiarity, relationship = "peers", lifeStages = [],
      includeDomains = [], excludeDomains = [], includeTopics = [], excludeTopics = [],
      preferredDomains = [], preferredTopics = [], preferredModes = [],
      deprioritizedDomains = [], deprioritizedTopics = [],
      confirmedExperiences = [], excludeRequired = false, tones = [],
      minDepth = 1, maxDepth = 3, maxSensitivity = 3, maxGroupRisk = "high"
    } = options;
    const keys = (key) => Object.keys(taxonomy[key]);
    const validate = (name, list, choices) => {
      if (!Array.isArray(list) || list.some((value) => !choices.includes(value))) {
        throw new Error(`无效的筛选值（${name}）：${list}`);
      }
    };
    const allScenes = scene === "all";
    if (!allScenes) validate("scene", [scene], keys("scenes"));
    validate("relationship", [relationship], keys("relationships"));
    validate("lifeStages", lifeStages, keys("stages"));
    validate("confirmedExperiences", confirmedExperiences, keys("experiences"));
    validate("tones", tones, keys("tones"));
    validate("preferredModes", preferredModes, keys("modes"));
    validate("maxGroupRisk", [maxGroupRisk], keys("group_risks"));
    const domainLists = { includeDomains, excludeDomains, preferredDomains, deprioritizedDomains };
    const topicLists = { includeTopics, excludeTopics, preferredTopics, deprioritizedTopics };
    for (const [name, list] of Object.entries(domainLists)) validate(name, list, keys("domains"));
    for (const [name, list] of Object.entries(topicLists)) validate(name, list, keys("topics"));
    if (!Number.isInteger(minDepth) || !Number.isInteger(maxDepth) ||
        minDepth < 1 || maxDepth > 3 || minDepth > maxDepth) {
      throw new Error("请填写从 1 到 3 的有效深度范围。");
    }
    if (!Number.isInteger(maxSensitivity) || maxSensitivity < 0 || maxSensitivity > 3) {
      throw new Error("敏感度上限须为 0–3 的整数。");
    }
    if (typeof excludeRequired !== "boolean") throw new Error("excludeRequired 须为布尔值。");

    const preset = allScenes
      ? { familiarity: "close_friend", sensitivity: 2, group_risk: "high" }
      : taxonomy.scenes[scene];
    const familiarityOrder = keys("familiarity");
    const riskOrder = keys("group_risks");
    validate("familiarity", [familiarity ?? preset.familiarity], familiarityOrder);
    const hasRoleBoundary = relationship !== "peers";
    const familiarityCap = Math.min(
      familiarityOrder.indexOf(familiarity ?? preset.familiarity),
      hasRoleBoundary ? familiarityOrder.indexOf("acquaintance") : Infinity
    );
    const sensitivityCap = Math.min(maxSensitivity, preset.sensitivity, hasRoleBoundary ? 1 : 2);
    const riskCap = Math.min(
      riskOrder.indexOf(maxGroupRisk), riskOrder.indexOf(preset.group_risk),
      hasRoleBoundary ? riskOrder.indexOf("low") : Infinity
    );
    const blockedTopics = new Set([...globalExclusions, ...excludeTopics]);
    const blockedDomains = new Set(excludeDomains);
    if (hasRoleBoundary) {
      roleExclusions.forEach((tag) => blockedTopics.add(tag));
      ["family", "romance", "group"].forEach((domain) => blockedDomains.add(domain));
    }
    const experiences = new Set(confirmedExperiences);
    const requireConfirmedExperiences = !allScenes || hasRoleBoundary || experiences.size > 0;
    const targetTopics = new Set(includeTopics);
    const targetStages = new Set(lifeStages);
    const targetTones = new Set(tones);
    const candidates = [];
    const counts = { active: 0, excluded: 0, experience: 0, scene: 0, depth: 0, tone: 0, theme: 0 };
    for (const question of questions) {
      if (question.status !== "active") continue;
      counts.active++;
      if (blockedDomains.has(question.primary_domain) || intersects(blockedTopics, question.topic_tags)) {
        counts.excluded++;
      } else if (question.experience_requirement === "required" &&
          (excludeRequired || (requireConfirmedExperiences &&
            !question.experience_tags.every((tag) => experiences.has(tag))))) {
        counts.experience++;
      } else if ((!allScenes && !question.scene_tags.includes(scene)) ||
          familiarityOrder.indexOf(question.familiarity_min) > familiarityCap ||
          question.sensitivity > sensitivityCap ||
          riskOrder.indexOf(question.group_risk) > riskCap ||
          (lifeStages.length && question.life_stages.length && !intersects(targetStages, question.life_stages))) {
        counts.scene++;
      } else if (question.depth < minDepth || question.depth > maxDepth) {
        counts.depth++;
      } else if (tones.length && !intersects(targetTones, question.tone_tags)) {
        counts.tone++;
      } else if ((includeDomains.length && !includeDomains.includes(question.primary_domain)) ||
          (includeTopics.length && !intersects(targetTopics, question.topic_tags))) {
        counts.theme++;
      } else {
        candidates.push(question);
      }
    }
    return { candidates, counts };
  }

  function validateCount(count) {
    if (count != null && (!Number.isSafeInteger(count) || count < 1)) {
      throw new Error("抽题数量须为正整数。");
    }
  }

  function shuffle(values, randomInt) {
    const result = values.slice();
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = randomInt(i + 1);
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function selectRandom(bank, options, randomInt) {
    validateCount(options.count);
    const { candidates, counts } = eligibility(bank, options);
    const available = candidates.length;
    const requested = options.count ?? available;
    const questions = shuffle(candidates, randomInt).slice(0, requested);
    return { questions, available, requested, shortfall: requested - questions.length, counts };
  }

  function select(bank, options = {}, random = Math.random) {
    const {
      count, gradual = true, preferredDomains = [], preferredTopics = [], preferredModes = [],
      deprioritizedDomains = [], deprioritizedTopics = []
    } = options;
    validateCount(count);
    if (typeof gradual !== "boolean") throw new Error("gradual 须为布尔值。");
    const { candidates, counts } = eligibility(bank, options);
    const available = candidates.length;
    const requested = count ?? available;
    const drawn = [];
    const seen = new Map();
    const pool = candidates.map((question) => ({
      question,
      drawOrder: random(),
      preference: 2 * Number(preferredDomains.includes(question.primary_domain)) +
        Number(question.topic_tags.some((tag) => preferredTopics.includes(tag))) +
        Number(question.response_modes.some((mode) => preferredModes.includes(mode))) -
        2 * Number(deprioritizedDomains.includes(question.primary_domain)) -
        Number(question.topic_tags.some((tag) => deprioritizedTopics.includes(tag))),
      traits: [
        [`domain:${question.primary_domain}`, 1.5],
        [`depth:${question.depth}`, 0.6],
        ...question.response_modes.map((mode) => [`mode:${mode}`, 0.5 / question.response_modes.length]),
        ...question.topic_tags.map((tag) => [`topic:${tag}`, 1 / question.topic_tags.length])
      ]
    }));
    while (pool.length && drawn.length < requested) {
      let bestIndex = 0;
      let bestScore = -Infinity;
      pool.forEach(({ traits, preference, drawOrder }, index) => {
        const variety = traits.reduce((sum, [key, weight]) =>
          sum + weight / (1 + (seen.get(key) ?? 0)), 0);
        const score = variety + preference / (1 + drawn.length / 3) + drawOrder * 0.8;
        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      });
      const [{ question, traits }] = pool.splice(bestIndex, 1);
      drawn.push(question);
      for (const [key] of traits) seen.set(key, (seen.get(key) ?? 0) + 1);
    }
    if (gradual) {
      drawn.sort((a, b) => a.depth - b.depth || a.sensitivity - b.sensitivity);
    }
    return { questions: drawn, available, requested, shortfall: requested - drawn.length, counts };
  }

  return { eligibility, select, selectRandom, shuffle };
})();

if (typeof module === "object" && module.exports) module.exports = QuestionSelector;
</script>
<script id="judgeSelection">
"use strict";

const JudgeSelection = (() => {
  const temperatureProfiles = {
    low:     { depth: [1.8, 1, .45],   sensitivity: [1.7, .85, .22] },
    default: { depth: [1, 1, 1],       sensitivity: [1, 1, 1] },
    high:    { depth: [.65, 1.15, 1.8], sensitivity: [.65, 1.25, 1.65],
      modes: ["reflection", "experience"], modeWeight: 1.75 },
    highest: { depth: [.8, 1, 1.3],    sensitivity: [.35, .9, 3.6] }
  };
  const temperatures = Object.keys(temperatureProfiles);
  const sequences = {
    gradual: { label: "循序渐进", detail: "慢热一些", exponent: -2.5, length: 8 },
    random:  { label: "默认随机", detail: "来者不拒，交给天意", exponent: 0, length: 0 },
    direct:  { label: "直奔主题", detail: "直接端上来吧！", exponent: 1.2, length: 3 }
  };
  const intensity = { depth: .35, sensitivity: .65, maxDepth: 3, maxSensitivity: 2 };
  const checkIn = { min: 5, max: 10 };

  const scopes = {
    family: {
      label: "家庭与亲情", detail: "家人、父母、家庭回忆",
      domains: ["family"], topicPrefix: "family_",
      topics: ["origin_family", "intergenerational", "parenting"]
    },
    romance: {
      label: "个人感情经历", detail: "暧昧经历、前任、恋爱与分手回忆",
      topics: ["dating_history", "ex_partners", "relationship_memories"],
      experiences: ["dating_experience", "long_term_relationship", "breakup_experience", "confession_experience"]
    },
    work: {
      label: "实际工作与职场", detail: "工作事务、职场压力、团队管理",
      topics: ["work_experience", "work_pressure", "management", "teamwork", "work_conflict",
        "manager_conflict", "career_onboarding", "internship", "work_life", "burnout", "delegation"],
      experiences: ["work_experience", "internship_experience", "management_experience"]
    },
    finance: {
      label: "个人经济状况", detail: "实际收入、债务、家庭财务",
      topics: ["financial_privacy", "family_financial_responsibility"],
      experienceTopics: ["income", "compensation", "debt"]
    },
    privacy: {
      label: "其他个人隐私", detail: "明确需要透露的私人信息",
      topics: ["personal_privacy", "financial_privacy"]
    }
  };

  // 回避含义与通用主题标签有出入时，按已经核对的题干修正。
  const scopeOverrides = {
    Q027: {
      question: "如果你的事业或感情选择和父母的期待发生严重冲突，你会怎么处理？",
      scopes: { privacy: false }
    },
    Q032: {
      question: "你有没有因为比对方更在乎一段关系，而受到过伤害？这是否改变了你后来对待感情的方式？",
      scopes: { romance: true }
    },
    Q035: {
      question: "如果朋友得到了你期盼很久的机会，而你没得到，你会怎么办？如果你们本来就是竞争对手，你的做法会变吗？",
      scopes: { privacy: false }
    },
    Q088: {
      question: "如果一段关系能给你爱情，却无法满足你的性需求；或者能满足你的性需求，却没有爱情，你能接受其中任何一种吗？",
      scopes: { privacy: false }
    },
    Q116: {
      question: "有没有一个时刻，让你发现自己对 TA 已经不只是普通好感了？",
      scopes: { romance: true }
    }
  };

  function preferences(value = {}) {
    return {
      temperature: temperatures.includes(value?.temperature) ? value.temperature : "default",
      sequence: Object.hasOwn(sequences, value?.sequence) ? value.sequence : "random",
      excludedScopes: Array.isArray(value?.excludedScopes)
        ? [...new Set(value.excludedScopes.filter((scope) => Object.hasOwn(scopes, scope)))] : []
    };
  }

  function createState(value, randomInt) {
    return {
      ...preferences(value),
      completedQuestions: 0,
      sequenceStartAt: 0,
      checkIn: { triggerAt: checkIn.min + randomInt(checkIn.max - checkIn.min + 1), status: "waiting" }
    };
  }

  function matchesScope(question, key) {
    const override = scopeOverrides[question.id];
    const value = override?.question === question.question ? override.scopes[key] : undefined;
    if (value !== undefined) return value;
    const { domains, topics, topicPrefix, experiences, experienceTopics } = scopes[key];
    return Boolean(domains?.includes(question.primary_domain) ||
      question.topic_tags.some((tag) => topics.includes(tag) || (topicPrefix && tag.startsWith(topicPrefix))) ||
      question.experience_tags.some((tag) => experiences?.includes(tag)) ||
      (experienceTopics && question.response_modes.includes("experience") &&
        question.topic_tags.some((tag) => experienceTopics.includes(tag))));
  }

  function remaining(candidates, seenIds, excludedScopes) {
    return candidates.filter((question) => !seenIds.has(question.id) &&
      !excludedScopes.some((scope) => matchesScope(question, scope)));
  }

  function temperatureWeight(question, temperature) {
    const profile = temperatureProfiles[temperature];
    const sensitivity = Math.min(question.sensitivity, intensity.maxSensitivity);
    const mode = profile.modes?.some((key) => question.response_modes.includes(key)) ? profile.modeWeight : 1;
    return profile.depth[question.depth - 1] * profile.sensitivity[sensitivity] * mode;
  }

  function sequenceExponent(sequence, completed) {
    const { exponent, length } = sequences[sequence];
    return length ? exponent * (1 - Math.min(completed / length, 1)) : 0;
  }

  function intensityOf(question) {
    return intensity.depth * (question.depth - 1) / (intensity.maxDepth - 1) +
      intensity.sensitivity * Math.min(question.sensitivity, intensity.maxSensitivity) / intensity.maxSensitivity;
  }

  function sequenceWeight(question, sequence, completed) {
    return Math.exp(sequenceExponent(sequence, completed) * intensityOf(question));
  }

  function draw(candidates, state, randomInt, random = Math.random) {
    if (!candidates.length) return null;
    const completed = state.completedQuestions - state.sequenceStartAt;
    const exponent = sequenceExponent(state.sequence, completed);
    if (state.temperature === "default" && exponent === 0) {
      return candidates[randomInt(candidates.length)];
    }
    const weights = candidates.map((question) => temperatureWeight(question, state.temperature) *
      Math.exp(exponent * intensityOf(question)));
    let ticket = random() * weights.reduce((sum, weight) => sum + weight, 0);
    for (let index = 0; index < weights.length - 1; index += 1) {
      ticket -= weights[index];
      if (ticket < 0) return candidates[index];
    }
    return candidates.at(-1);
  }

  return { temperatures, sequences, scopes, checkIn, preferences, createState, remaining,
    temperatureWeight, sequenceWeight, intensityOf, draw };
})();

if (typeof module === "object" && module.exports) module.exports = JudgeSelection;
</script>
<script id="fluidSliderScript">
const createFluidSlider = (() => {
  "use strict";

  const waterLevels = [
    { title: "低", description: "随便聊聊", detail: "更多轻松、较少涉及个人隐私的话题" },
    { title: "适中", description: "默认随机", detail: "无偏向随机抽取所有题目" },
    { title: "高", description: "加大力度", detail: "更多个人经历与内心感受的话题" },
    { title: "最高", description: "火力全开", detail: "更多敏感私密、需要仔细斟酌的话题", hot: true },
  ];

  // 像素与秒。漂流、剪切、起伏、涡流频率和亮度各有自己的变化幅度。
  const waterMotion = [
    { flow: 2,  shear: 1.7, lift: .65, rate: .48, shimmer: .035 },
    { flow: 10, shear: 5,   lift: 1.9, rate: 1.3, shimmer: .075 },
    { flow: 33, shear: 22,  lift: 4.3, rate: 3.5, shimmer: .145 },
    { flow: 92, shear: 61,  lift: 7.2, rate: 7.8, shimmer: .215 },
  ];

  // 色场随同一水温演化。pace 为弧度/秒，fold 控制中段暗谷与右侧亮区的强度。
  const fieldMotion = [
    { violet: .015, contrast: .43, fold: .03, pace: .18 },
    { violet: .085, contrast: .57, fold: .27, pace: .24 },
    { violet: .36,  contrast: .80, fold: .71, pace: .39 },
    { violet: .68,  contrast: .98, fold: 1,   pace: .56 },
  ];

  const motionTuning = {
    settleFrequency: 27,
    handoffFrequency: 56,
    maxReleaseSpeed: 1.65, // 轨道长度 / 秒
    overshootPixels: 4,
    trackDragThreshold: 5, // CSS 像素
  };

  const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));

  // 临界阻尼的解析解，可从任意位置和速度重建运动。
  function sampleSpring(offset, velocity, frequency, seconds) {
    const slope = velocity + frequency * offset;
    const decay = Math.exp(-frequency * seconds);
    return {
      position: (offset + slope * seconds) * decay,
      velocity: (velocity - frequency * slope * seconds) * decay,
    };
  }

  class WaterMaterial {
    constructor(canvas, profiles, initialIndex, reduced) {
      this.canvas = canvas;
      this.context = canvas.getContext("2d");
      if (!this.context) return;

      this.profiles = profiles;
      this.target = this.heat = initialIndex;
      this.heatVelocity = 0;
      this.fieldPhase = 0;
      this.fieldElapsed = 0;
      this.field = document.createElement("canvas");
      this.fieldContext = this.field.getContext("2d", { alpha: false });
      this.reduced = reduced;
      this.forcedColors = matchMedia("(forced-colors: active)");
      this.frame = null;
      this.lastTime = null;

      // 固定种子与分层布点使纹理自然疏密，档位切换无需重新布点。
      let seed = 620037;
      const random = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      this.particles = Array.from({ length: 49 }, (_, index) => {
        const edge = index < 3;
        const drift = random();
        return {
          x: (index + random()) / 49,
          edge: edge ? [7, 12, 17][index] : null,
          band: edge ? [.54, .33, .67][index] : .18 + .64 * random(),
          phase: random() * Math.PI * 2,
          pace: .56 + 1.08 * random(),
          radius: .55 + 1.1 * random() ** 1.6,
          opacity: .19 + .36 * random(),
          drift: drift < .28 ? -.32 + drift : .5 + drift,
        };
      });

      this.tick = this.tick.bind(this);
      this.resize();
      this.observer = new ResizeObserver(() => this.resize());
      this.observer.observe(canvas);
      this.events = new AbortController();
      const { signal } = this.events;
      document.addEventListener("visibilitychange", () => this.updatePlayback(), { signal });
      for (const preference of [reduced, this.forcedColors]) {
        preference.addEventListener("change", () => this.updatePlayback(), { signal });
      }
      this.updatePlayback();
    }

    destroy() {
      this.events?.abort();
      this.observer?.disconnect();
      if (this.frame != null) cancelAnimationFrame(this.frame);
    }

    setLevel(index) {
      this.target = index;
      if (this.context && this.reduced.matches) this.paintStill();
    }

    paintStill() {
      this.heat = this.target;
      this.heatVelocity = 0;
      this.paint(0);
    }

    resize() {
      const { width, height } = this.canvas.getBoundingClientRect();
      if (!width || !height) return;
      const scale = Math.min(devicePixelRatio || 1, 2);
      if (width === this.width && height === this.height && scale === this.scale) return;
      this.width = width;
      this.height = height;
      this.scale = scale;
      this.canvas.width = Math.round(width * scale);
      this.canvas.height = Math.round(height * scale);
      this.context.setTransform(this.canvas.width / width, 0, 0, this.canvas.height / height, 0, 0);
      // 光瓣比粒子大得多。在小画布上绘制连续色面，粒子仍按屏幕像素绘制。
      this.field.width = clamp(Math.ceil(width / 5), 32, 160);
      this.field.height = 12;
      this.fieldPixels = this.fieldContext?.createImageData(this.field.width, this.field.height);
      this.paint(0);
    }

    updatePlayback() {
      if (document.hidden || this.reduced.matches || this.forcedColors.matches) {
        if (this.frame !== null) cancelAnimationFrame(this.frame);
        this.frame = this.lastTime = null;
        if (this.reduced.matches && !document.hidden && !this.forcedColors.matches) this.paintStill();
      } else if (this.frame === null) {
        this.frame = requestAnimationFrame(this.tick);
      }
    }

    tick(time) {
      const seconds = this.lastTime === null ? 0 : Math.min((time - this.lastTime) / 1000, .05);
      this.lastTime = time;
      // 改档仅更新目标，保留当前水温、升降温速度和每颗粒子的相位。
      const thermal = sampleSpring(this.heat - this.target, this.heatVelocity, 4.8, seconds);
      this.heat = this.target + thermal.position;
      this.heatVelocity = thermal.velocity;
      this.paint(seconds);
      this.frame = requestAnimationFrame(this.tick);
    }

    paintField(seconds, lower, fraction) {
      if (!this.fieldPixels) return;
      const from = fieldMotion[lower], to = fieldMotion[Math.min(lower + 1, fieldMotion.length - 1)];
      const interpolate = key => from[key] + (to[key] - from[key]) * fraction;
      this.fieldPhase += seconds * interpolate("pace");
      this.fieldElapsed += seconds;
      if (seconds === 0 || this.fieldElapsed >= 1 / 24) {
        this.fieldElapsed %= 1 / 24;
        const phase = this.fieldPhase;
        const contrast = interpolate("contrast"), fold = interpolate("fold");
        const violet = interpolate("violet");
        // 三处宽软色瓣各自在有限范围内游移、聚拢和消退，保留轨道自身的冷暖方向。
        const cap = .045 + .042 * Math.sin(.83 * phase + .2);
        const middle = .25 + .21 * fold + (.055 + .05 * fold) * Math.sin(.71 * phase - .8);
        const far = .84 + .061 * Math.cos(.89 * phase + .4);
        const capLight = .22 + .82 * Math.sin(phase - .9 + 1.3 * fold);
        const middleLight = .16 + .89 * Math.sin(.78 * phase + 1.8);
        const farLight = .07 + .85 * Math.cos(1.09 * phase - 1.1);
        const bend = .047 + .025 * Math.sin(.63 * phase);
        const { width, height, data } = this.fieldPixels;
        let offset = 0;
        for (let row = 0; row < height; row++) {
          const y = row / (height - 1) - .5;
          const ridge = middle + y * bend;
          const valley = ridge + .14 + .024 * Math.cos(.61 * phase);
          for (let column = 0; column < width; column++) {
            const x = column / (width - 1);
            const coldLobe = Math.exp(-((x - cap + y * .045) ** 2) / .025);
            const midLobe = Math.exp(-((x - ridge) ** 2) / .032);
            const farLobe = Math.exp(-((x - far - y * .085) ** 2) / .021);
            const trough = Math.exp(-((x - valley) ** 2) / .009);
            const light = contrast * (capLight * coldLobe + middleLight * midLobe +
              fold * (farLight * farLobe - .76 * trough));
            // 蓝、长春花蓝、紫三个锚点。温度改变可见前缀本身的偏色；裁切不会缩放色瓣。
            const tint = clamp(violet + (.86 - .36 * violet) * x -
              .32 * violet * coldLobe - .115 * light);
            const blueMix = Math.min(1, tint * 2);
            const purpleMix = Math.max(0, tint * 2 - 1);
            const luminance = 18 * light - 5 * y;
            data[offset++] = 129 + 23 * blueMix + 4 * purpleMix + luminance;
            data[offset++] = 180 - 27 * blueMix - 61 * purpleMix + luminance;
            data[offset++] = 233 + 7 * blueMix + 7 * purpleMix + .55 * luminance;
            data[offset++] = 255;
          }
        }
        this.fieldContext.putImageData(this.fieldPixels, 0, 0);
      }
      this.context.drawImage(this.field, 0, 0, this.width, this.height);
    }

    paint(seconds) {
      if (!this.width) return;
      const heat = clamp(this.heat, 0, this.profiles.length - 1);
      const lower = Math.floor(heat);
      const cool = this.profiles[lower];
      const warm = this.profiles[Math.min(lower + 1, this.profiles.length - 1)];
      const blend = (key) => cool[key] + (warm[key] - cool[key]) * (heat - lower);
      const flow = blend("flow");
      const shear = blend("shear");
      const lift = blend("lift");
      const rate = blend("rate");
      const shimmer = blend("shimmer");
      const { context, width, height } = this;
      const guard = 6 / width;
      context.globalAlpha = 1;
      context.clearRect(0, 0, width, height);
      this.paintField(seconds, lower, heat - lower);
      context.fillStyle = "#f7f8ff";

      for (const particle of this.particles) {
        particle.phase += seconds * rate * particle.pace;
        const wave = Math.sin(particle.phase);
        const eddy = Math.sin(particle.phase + particle.x * 12);
        const speed = flow * particle.drift + shear * (.72 * wave + .28 * eddy);
        let x;
        if (particle.edge !== null) {
          // 在圆角起点保留少量缓慢回流，最低档也有可以看见的材质。
          x = particle.edge + lift * .57 * eddy;
        } else {
          particle.x += speed * seconds / width;
          if (particle.x > 1 + guard) particle.x -= 1 + 2 * guard;
          if (particle.x < -guard) particle.x += 1 + 2 * guard;
          x = particle.x * width;
        }
        const y = height * particle.band + lift * (.72 * eddy + .28 * wave);
        const stretch = particle.edge === null ? Math.min(1.15, Math.abs(speed) / 105) : 0;
        context.globalAlpha = particle.opacity * (1 + shimmer * Math.cos(particle.phase * 1.7));
        context.beginPath();
        context.ellipse(x, y, particle.radius + stretch, particle.radius, eddy * stretch * .16, 0, 2 * Math.PI);
        context.fill();
      }
    }
  }

  // 组件以原生 range 的 input/change 事件对外提供当前档位。
  class FluidSlider {
    constructor(root, { levels, initialIndex, motion, materialProfiles }) {
      this.root = root;
      this.events = new AbortController();
      const { signal } = this.events;
      this.levels = levels;
      this.motion = motion;
      this.maxIndex = levels.length - 1;
      this.input = root.querySelector(".fluid-slider__input");
      this.hit = root.querySelector(".fluid-slider__hit");
      this.lane = root.querySelector(".fluid-slider__lane");
      this.thumb = root.querySelector(".fluid-slider__thumb");
      this.title = root.querySelector(".fluid-slider__value");
      this.description = root.querySelector(".fluid-slider__description");
      const explanation = root.querySelector(".fluid-slider__explanation");
      const explanationButton = explanation.querySelector("button");
      this.detail = explanation.querySelector(".fluid-slider__detail, .fluid-slider__text-detail");
      this.reduced = matchMedia("(prefers-reduced-motion: reduce)");
      this.pointer = null;
      this.spring = null;
      this.hoverX = null;
      this.overThumb = false;
      this.frame = null;
      this.index = -1;
      this.position = initialIndex / this.maxIndex;
      this.velocity = 0;

      this.input.min = 0;
      this.input.max = this.maxIndex;
      this.input.step = 1;
      this.input.defaultValue = initialIndex;
      this.markers = levels.map((_, index) => {
        const stop = `${100 * index / this.maxIndex}%`;
        const tick = document.createElement("span");
        tick.className = "fluid-slider__tick";
        tick.style.setProperty("--stop", stop);
        this.lane.append(tick);
        return tick;
      });

      this.measure();
      this.setIndex(initialIndex);
      this.draw(this.now());
      const canvas = root.querySelector(".fluid-slider__particles");
      this.material = new WaterMaterial(canvas, materialProfiles, initialIndex, this.reduced);
      this.observer = new ResizeObserver(() => {
        this.measure();
        this.queueDraw();
      });
      this.observer.observe(this.hit);

      if (explanationButton) this.bindExplanation(explanation, explanationButton, signal);

      this.input.addEventListener("input", (event) => {
        if (event.isTrusted) this.takeNativeInput();
      }, { signal });
      this.input.addEventListener("change", () => this.material.setLevel(this.index), { signal });
      this.input.addEventListener("keydown", () => this.root.removeAttribute("data-pointer-focus"), { signal });
      this.input.addEventListener("blur", () => this.root.removeAttribute("data-pointer-focus"), { signal });
      this.hit.addEventListener("pointerdown", (event) => this.press(event), { signal });
      this.hit.addEventListener("pointermove", (event) => this.move(event), { signal });
      this.hit.addEventListener("pointerup", (event) => this.finish(event), { signal });
      for (const type of ["pointercancel", "lostpointercapture"]) {
        this.hit.addEventListener(type, (event) => this.finish(event, true), { signal });
      }
      this.hit.addEventListener("pointerenter", (event) => this.updateHover(event), { signal });
      this.hit.addEventListener("pointerleave", () => this.clearHover(), { signal });
      this.reduced.addEventListener("change", () => {
        if (this.reduced.matches && !this.pointer?.dragging) this.settle(this.now());
        this.queueDraw();
      }, { signal });
    }

    bindExplanation(explanation, button, signal) {
      const isOpen = () => explanation.hasAttribute("data-open");
      const setOpen = (open) => {
        if (open) this.detail.textContent = this.levels[this.index].detail;
        explanation.toggleAttribute("data-open", open);
        button.setAttribute("aria-expanded", open);
        this.detail.setAttribute("aria-hidden", !open);
      };
      this.closeExplanation = () => { if (isOpen()) setOpen(false); };
      button.addEventListener("click", () => setOpen(!isOpen()), { signal });
      document.addEventListener("pointerdown", (event) => {
        if (isOpen() && !button.contains(event.target) && !this.detail.contains(event.target)) setOpen(false);
      }, { signal, capture: true });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isOpen()) {
          const modal = document.querySelector("dialog:modal");
          if (modal && !modal.contains(this.root)) return;
          setOpen(false);
          event.preventDefault();
        }
      }, { signal });
    }

    destroy() {
      this.events.abort();
      this.observer.disconnect();
      this.material.destroy();
      if (this.frame !== null) cancelAnimationFrame(this.frame);
      if (this.pointer && this.hit.hasPointerCapture(this.pointer.id)) {
        this.hit.releasePointerCapture(this.pointer.id);
      }
    }

    now() { return performance.now(); }

    measure() {
      const hit = this.hit.getBoundingClientRect();
      const lane = this.lane.getBoundingClientRect();
      const inset = lane.left - hit.left;
      const travel = Math.max(lane.width, 1);
      this.geometry = {
        left: lane.left, inset, travel, width: hit.width,
        // 归一化 0 仍是最低档，拖动可继续到距轨道左缘 2px 的位置。
        minPosition: Math.min(0, (2 - inset) / travel),
        thumbRadius: this.thumb.offsetWidth / 2 + 3,
      };
    }

    at(clientX) {
      return (clientX - this.geometry.left) / this.geometry.travel;
    }

    indexAt(position) { return Math.round(clamp(position) * this.maxIndex); }

    boundPosition(position) { return clamp(position, this.geometry.minPosition); }

    boundVelocity(position, velocity) {
      if ((position <= this.geometry.minPosition && velocity < 0) ||
          (position >= 1 && velocity > 0)) return 0;
      return velocity;
    }

    setIndex(index, emit = false) {
      if (index === this.index) return;
      this.closeExplanation?.();
      this.index = index;
      this.input.value = index;
      const { title, description, hot } = this.levels[index];
      this.input.setAttribute("aria-valuetext", title);
      this.title.textContent = title;
      this.title.classList.toggle("fluid-slider__value--hot", hot === true);
      this.description.textContent = description;
      this.markers.forEach((tick, stop) => {
        tick.dataset.selected = stop === index;
      });
      if (emit) this.input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    commit(from) {
      if (from !== this.index) this.input.dispatchEvent(new Event("change", { bubbles: true }));
    }

    queueDraw() {
      if (this.frame !== null) return;
      this.frame = requestAnimationFrame(() => {
        this.frame = null;
        this.draw(this.now());
      });
    }

    draw(now) {
      this.advance(now);
      this.position = this.boundPosition(this.position);
      const pixel = this.geometry.inset + this.position * this.geometry.travel;
      this.hit.style.setProperty("--position", `${pixel}px`);
      this.hit.style.setProperty("--unfilled", `${this.geometry.width - pixel}px`);
      this.markers.forEach((tick, stop) => {
        const filled = stop / this.maxIndex <= this.position;
        if (tick.dataset.filled !== String(filled)) tick.dataset.filled = filled;
      });
      this.syncHover();
      this.updatePhase();
      if (this.spring || this.pointer?.handoff) this.queueDraw();
    }

    advance(now) {
      if (this.pointer?.dragging) {
        const pointer = this.pointer;
        const handoff = pointer.handoff;
        const time = handoff ? Math.max(0, (now - handoff.start) / 1000) : 0;
        const correction = handoff && !this.reduced.matches && time < .18
          ? sampleSpring(handoff.offset, handoff.velocity, this.motion.handoffFrequency, time)
          : null;
        if (!correction) pointer.handoff = null;
        const position = pointer.position + (correction?.position ?? 0);
        this.position = this.boundPosition(position);
        this.velocity = position === this.position
          ? this.boundVelocity(position, pointer.velocity + (correction?.velocity ?? 0)) : 0;
        return;
      }
      if (!this.spring) return;
      const { start, target, offset, velocity } = this.spring;
      const next = sampleSpring(offset, velocity, this.motion.settleFrequency, Math.max(0, now - start) / 1000);
      const position = target + next.position;
      this.position = this.boundPosition(position);
      this.velocity = position === this.position ? this.boundVelocity(position, next.velocity) : 0;
      if (Math.abs(next.position) * this.geometry.travel < .15 &&
          Math.abs(next.velocity) * this.geometry.travel < 4) {
        this.position = target;
        this.velocity = 0;
        this.spring = null;
      }
    }

    settle(now) {
      const target = this.index / this.maxIndex;
      const offset = this.position - target;
      if (this.reduced.matches || (offset === 0 && this.velocity === 0)) {
        this.position = target;
        this.velocity = 0;
        this.spring = null;
      } else {
        // 限制穿过目标后的位移。临界阻尼最多穿过目标一次。
        const speed = this.motion.settleFrequency * (
          Math.abs(offset) + Math.E * this.motion.overshootPixels / this.geometry.travel
        );
        const velocity = clamp(this.velocity, offset >= 0 ? -speed : -Infinity, offset <= 0 ? speed : Infinity);
        this.spring = { start: now, target, offset, velocity };
        this.velocity = velocity;
      }
      this.updatePhase();
      this.queueDraw();
    }

    updatePhase() {
      const phase = this.pointer?.dragging ? "dragging"
        : this.pointer ? "pressed"
        : this.spring ? "settling"
        : this.overThumb ? "hover" : "idle";
      if (this.root.dataset.phase !== phase) this.root.dataset.phase = phase;
    }

    isOverThumb(clientX) {
      const displayedPixel = parseFloat(this.hit.style.getPropertyValue("--position"));
      return Math.abs(clientX - this.geometry.left + this.geometry.inset - displayedPixel)
        <= this.geometry.thumbRadius;
    }

    updateHover(event) {
      if (event.pointerType === "touch") return;
      this.hoverX = event.clientX;
      this.syncHover();
      this.updatePhase();
    }

    syncHover() {
      const overThumb = this.hoverX !== null && (this.pointer
        ? this.pointer.grabbed || this.pointer.dragging
        : this.isOverThumb(this.hoverX));
      if (overThumb !== this.overThumb) {
        this.overThumb = overThumb;
        this.root.toggleAttribute("data-over-thumb", overThumb);
      }
    }

    clearHover() {
      this.hoverX = null;
      this.syncHover();
      this.updatePhase();
    }

    press(event) {
      if (!event.isPrimary || event.button !== 0 || this.pointer) return;
      event.preventDefault();
      this.root.setAttribute("data-pointer-focus", "");
      if (event.pointerType !== "touch") this.input.focus({ preventScroll: true });
      this.measure();

      const now = this.now();
      const grabbed = this.isOverThumb(event.clientX);
      const displayedPixel = parseFloat(this.hit.style.getPropertyValue("--position"));
      this.advance(now);
      // 抓住屏幕上实际显示的位置，保留按下点到滑块中心的距离。
      if (grabbed) {
        this.position = this.boundPosition((displayedPixel - this.geometry.inset) / this.geometry.travel);
        this.velocity = this.boundVelocity(this.position, this.velocity);
        this.spring = null;
      }
      const position = grabbed ? this.position : this.boundPosition(this.at(event.clientX));
      this.pointer = {
        id: event.pointerId, from: this.index, grabbed, dragging: false,
        touch: event.pointerType === "touch", startX: event.clientX, lastX: event.clientX,
        position, offset: grabbed ? position - this.at(event.clientX) : 0,
        velocity: grabbed ? this.velocity : 0, lastTime: now, handoff: null,
      };
      this.hit.setPointerCapture(event.pointerId);
      if (grabbed) {
        this.setIndex(this.indexAt(position), true);
      } else if (!this.pointer.touch) {
        this.setIndex(this.indexAt(position), true);
        this.settle(now);
      }
      this.updateHover(event);
      this.updatePhase();
      this.queueDraw();
    }

    follow(event, now) {
      const pointer = this.pointer;
      if (event.clientX === pointer.lastX) return;
      const position = this.boundPosition(this.at(event.clientX) + pointer.offset);
      const elapsed = (now - pointer.lastTime) / 1000;
      const speed = clamp((position - pointer.position) / Math.max(.004, elapsed),
        -this.motion.maxReleaseSpeed, this.motion.maxReleaseSpeed);
      pointer.velocity = elapsed > .055 || Math.sign(speed) !== Math.sign(pointer.velocity)
        ? speed : pointer.velocity * .32 + speed * .68;
      pointer.lastTime = now;
      pointer.lastX = event.clientX;
      pointer.position = position;
    }

    move(event) {
      const pointer = this.pointer;
      if (pointer?.id !== event.pointerId) {
        if (!pointer) this.updateHover(event);
        return;
      }
      const threshold = pointer.grabbed && !pointer.touch ? 0 : this.motion.trackDragThreshold;
      if (!pointer.dragging && Math.abs(event.clientX - pointer.startX) <= threshold) return;

      const now = this.now();
      const samples = event.getCoalescedEvents?.() ?? [];
      for (const sample of samples) {
        this.follow(sample, Math.max(pointer.lastTime, Math.min(now, sample.timeStamp)));
      }
      this.follow(event, now);
      if (!pointer.dragging) {
        this.advance(now);
        if (!pointer.grabbed && !this.reduced.matches) {
          pointer.handoff = {
            start: now, offset: this.position - pointer.position, velocity: this.velocity - pointer.velocity,
          };
        }
        this.spring = null;
        pointer.dragging = true;
      }
      this.setIndex(this.indexAt(pointer.position), true);
      this.updateHover(event);
      this.updatePhase();
      this.queueDraw();
    }

    finish(event, canceled = false) {
      const pointer = this.pointer;
      if (pointer?.id !== event.pointerId) return;
      const now = this.now();
      if (!canceled) {
        if (pointer.touch) this.input.focus({ preventScroll: true });
        if (pointer.dragging) {
          this.follow(event, now);
          this.setIndex(this.indexAt(pointer.position), true);
        } else if (pointer.touch && !pointer.grabbed) {
          this.setIndex(this.indexAt(this.at(event.clientX)), true);
        }
      }
      this.advance(now);
      if (pointer.dragging || pointer.grabbed) {
        const fresh = Math.exp(-Math.max(0, now - pointer.lastTime - 12) / 35);
        this.velocity = canceled ? 0 : clamp(this.velocity * fresh, -this.motion.maxReleaseSpeed, this.motion.maxReleaseSpeed);
      }
      this.pointer = null;
      if (canceled) this.setIndex(pointer.from, true);
      else this.commit(pointer.from);

      if (this.hit.hasPointerCapture(event.pointerId)) this.hit.releasePointerCapture(event.pointerId);
      this.clearHover();
      if (!canceled && event.pointerType !== "touch") {
        const bounds = this.hit.getBoundingClientRect();
        if (event.clientX >= bounds.left && event.clientX <= bounds.right &&
            event.clientY >= bounds.top && event.clientY <= bounds.bottom) this.updateHover(event);
      }
      this.settle(now);
    }

    takeNativeInput() {
      const now = this.now();
      this.advance(now);
      const pointer = this.pointer;
      if (pointer) {
        this.pointer = null;
        if (this.hit.hasPointerCapture(pointer.id)) this.hit.releasePointerCapture(pointer.id);
      }
      this.setIndex(this.input.valueAsNumber);
      this.settle(now);
    }
  }

  return (root, { initialIndex = 1, levels = waterLevels, compact = false, label } = {}) => {
    if (compact) {
      const explanation = root.querySelector(".fluid-slider__explanation");
      explanation.classList.add("fluid-slider__explanation--compact");
      if (levels.some((level) => level.detail)) {
        const button = explanation.querySelector("button");
        const caption = button.querySelector(".fluid-slider__caption");
        const originalDetail = explanation.querySelector(".fluid-slider__detail");
        const detail = document.createElement("span");
        detail.id = originalDetail.id;
        detail.className = "fluid-slider__text-detail";
        detail.setAttribute("aria-hidden", "true");
        button.className = "fluid-slider__text-toggle";
        button.replaceChildren(caption, detail);
        originalDetail.remove();
      } else {
        explanation.replaceChildren(explanation.querySelector(".fluid-slider__description"));
      }
    }
    const slider = new FluidSlider(root, {
      levels, initialIndex, motion: motionTuning, materialProfiles: waterMotion
    });
    if (label) slider.input.setAttribute("aria-label", label);
    return slider;
  };
})();
</script>
<script id="judgeInterface">
"use strict";

const JudgeInterface = (() => {
  const questions = {
    temperature: ["今天的话题，", "希望水温如何？"],
    excludedScopes: ["有没有哪些话题", "今天暂时不想聊？"]
  };
  const pages = ["welcome", ...Object.keys(questions)];
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

  function connectWaterPopover(host) {
    const explanation = host.querySelector(".fluid-slider__explanation");
    const trigger = explanation.querySelector(".fluid-slider__text-toggle");
    const panel = explanation.querySelector(".fluid-slider__text-detail");
    if (!panel?.showPopover) return;

    explanation.classList.add("judge-water-explanation");
    panel.classList.add("judge-water-popover");
    panel.popover = "manual";
    const listeners = new AbortController();
    const signal = listeners.signal;
    const stage = trigger.closest(".judge-opening-stage, .judge-adjustment-stage");
    const track = host.querySelector(".fluid-slider__hit");
    const tokens = getComputedStyle(panel);
    const gap = parseFloat(tokens.getPropertyValue("--popover-gap"));
    const inset = parseFloat(tokens.getPropertyValue("--popover-inset"));
    const constrain = (value, min, max) => Math.max(min, Math.min(value, max));

    function place() {
      if (!panel.matches(":popover-open")) return;
      const anchor = trigger.getBoundingClientRect();
      const view = window.visualViewport;
      const left = (view?.offsetLeft ?? 0) + inset;
      const top = (view?.offsetTop ?? 0) + inset;
      const right = left + (view?.width ?? document.documentElement.clientWidth) - 2 * inset;
      const bottom = top + (view?.height ?? document.documentElement.clientHeight) - 2 * inset;
      const clip = stage?.getBoundingClientRect();
      if (anchor.bottom <= Math.max(top, clip?.top ?? top) ||
          anchor.top >= Math.min(bottom, clip?.bottom ?? bottom)) {
        trigger.click();
        return;
      }

      panel.style.maxInlineSize = (right - left) + "px";
      panel.style.maxBlockSize = (bottom - top) + "px";
      const width = panel.offsetWidth;
      const height = panel.offsetHeight;
      const centerX = (anchor.left + anchor.right - width) / 2;
      const centerY = (anchor.top + anchor.bottom - height) / 2;
      if (stage?.id === "judgeAdjustmentStage") {
        panel.dataset.side = "center";
        panel.style.left = constrain(centerX, left, right - width) + "px";
        panel.style.top = constrain(centerY, top, bottom - height) + "px";
        return;
      }
      const belowTrack = Math.max(anchor.bottom, track.getBoundingClientRect().bottom) + gap;
      const candidates = [
        { side: "right", x: anchor.right + gap, y: centerY, room: right - anchor.right - gap - width },
        { side: "left", x: anchor.left - gap - width, y: centerY, room: anchor.left - left - gap - width },
        { side: "down", x: centerX, y: belowTrack, room: bottom - belowTrack - height },
        { side: "up", x: centerX, y: anchor.top - gap - height, room: anchor.top - top - gap - height }
      ];
      const placement = candidates.find(({ room }) => room >= 0) ??
        candidates.reduce((best, item) => item.room > best.room ? item : best);
      panel.dataset.side = placement.side;
      panel.style.left = constrain(placement.x, left, right - width) + "px";
      panel.style.top = constrain(placement.y, top, bottom - height) + "px";
    }

    const observer = new MutationObserver(() => {
      if (explanation.hasAttribute("data-open")) {
        if (!panel.matches(":popover-open")) panel.showPopover();
        place();
        if (!explanation.hasAttribute("data-open")) return;
        // Commit the placement before revealing from its anchor edge.
        void panel.offsetWidth;
        panel.dataset.entered = "";
      } else {
        delete panel.dataset.entered;
        if (panel.matches(":popover-open")) panel.hidePopover();
      }
    });
    observer.observe(explanation, { attributes: true, attributeFilter: ["data-open"] });
    const sizes = new ResizeObserver(place);
    sizes.observe(trigger);
    sizes.observe(panel);
    window.addEventListener("resize", place, { signal });
    window.addEventListener("scroll", place, { capture: true, passive: true, signal });
    window.visualViewport?.addEventListener("resize", place, { signal });
    return () => {
      observer.disconnect();
      sizes.disconnect();
      listeners.abort();
      panel.hidePopover();
    };
  }

  function init(onInlineChange) {
    const byId = (id) => document.getElementById(id);
    const opening = byId("judgeOpening");
    const openingTitle = byId("judgeOpeningTitle");
    const openingQuestion = byId("judgeOpeningQuestion");
    const welcomeTitle = openingQuestion.textContent;
    const questionLabel = byId("judgeQuestionLabel");
    const openingContent = byId("judgeOpeningContent");
    const welcomeCopy = byId("judgeWelcomeCopy");
    const stage = byId("judgeOpeningStage");
    const pageBody = byId("judgeOpeningPage");
    const progress = byId("judgeStep");
    const skip = byId("judgeSkip");
    const next = byId("judgeNext");
    const back = byId("judgeBack");
    const pageButtons = [back, skip, next];
    const game = byId("gameView");
    const entry = byId("judgeEntry");
    const topbar = entry.closest(".topbar");
    const inline = byId("judgeInline");
    const inlineTitle = byId("judgeInlineTitle");
    const checkIn = byId("judgeCheckIn");
    const adjustment = byId("judgeAdjustment");
    const adjustmentStage = byId("judgeAdjustmentStage");
    const adjustmentContent = byId("judgeAdjustmentContent");
    const notice = byId("judgeAdjustNotice");
    const feedback = byId("judgeFeedback");
    const tabs = [...adjustment.querySelectorAll("[data-judge-section]")];
    const turnParts = game.querySelectorAll("[data-judge-turn]");
    const choices = [...checkIn.querySelectorAll('input[type="radio"]')];
    const controls = byId("judgeControls");
    const sliderHost = byId("judgeSlider");
    const sliderTemplate = byId("judgeSliderTemplate");
    const scopes = byId("judgeScopes");
    const availability = byId("judgeAvailability");
    const brand = byId("judgeBrand");
    const { temperatures } = JudgeSelection;
    let mode = null;
    let editing = null;
    let selectCheckIn = null;
    let entryFades = [];
    let slider = null;
    let disconnectPopover;
    let paging = null;
    let inlineExit = null;
    let noticeTimer;

    for (const avatar of document.querySelectorAll("[data-judge-avatar]")) {
      avatar.append(brand.content.cloneNode(true));
    }
    const scopeInputs = Object.entries(JudgeSelection.scopes).map(([key, { label, detail }]) => {
      const option = document.createElement("label");
      const input = document.createElement("input");
      const text = document.createElement("span");
      const title = document.createElement("strong");
      const description = document.createElement("small");
      option.className = "judge-scope";
      input.type = "checkbox";
      input.value = key;
      text.className = "judge-scope-text";
      title.textContent = label;
      description.textContent = detail;
      text.append(title, description);
      option.append(input, text);
      scopes.append(option);
      input.addEventListener("change", () => {
        editing.draft.excludedScopes = scopeInputs.filter((choice) => choice.checked).map((choice) => choice.value);
        refresh();
      });
      return input;
    });

    function removeSlider() {
      disconnectPopover?.();
      disconnectPopover = undefined;
      slider?.destroy();
      slider = null;
      sliderHost.replaceChildren();
    }

    function renderControls(key, outlet) {
      removeSlider();
      if (controls.parentNode !== outlet) outlet.append(controls);
      scopes.hidden = key !== "excludedScopes";
      sliderHost.hidden = !scopes.hidden;
      const { draft } = editing;
      if (!sliderHost.hidden) {
        sliderHost.append(sliderTemplate.content.cloneNode(true));
        slider = createFluidSlider(sliderHost.firstElementChild, {
          initialIndex: temperatures.indexOf(draft.temperature),
          compact: true
        });
        disconnectPopover = connectWaterPopover(sliderHost);
        slider.input.addEventListener("change", () => {
          draft.temperature = temperatures[slider.input.valueAsNumber];
        });
      } else {
        for (const input of scopeInputs) input.checked = draft.excludedScopes.includes(input.value);
      }
      refresh();
    }

    function refresh() {
      if (!editing) return;
      const { available, budget } = editing.preview(editing.draft);
      const key = editing.page;
      const count = Math.min(available, budget);
      let message = key === "excludedScopes" ? "当前范围可抽" + count + "/" + budget + "题" : "";
      if (!available && budget) message = "当前范围可抽0/" + budget + "题，请调整回避范围。";
      availability.textContent = message;
      availability.hidden = !message;
      if (mode === "adjust") return;
      skip.disabled = available === 0;
      next.disabled = key === "excludedScopes" && available === 0;
      if (key === "welcome") next.textContent = "开始吧 →";
      else if (key === "temperature") next.textContent = "继续";
      else next.textContent = "确定";
    }

    function renderOpening() {
      const key = editing.page;
      const index = pages.indexOf(key);
      const welcome = key === "welcome";
      progress.hidden = welcome;
      progress.textContent = welcome ? "" : "0" + index + " / 0" + (pages.length - 1);
      questionLabel.hidden = welcome;
      questionLabel.textContent = welcome ? "" : "Q0" + index + " ·";
      if (welcome) openingQuestion.textContent = welcomeTitle;
      else openingQuestion.replaceChildren(...questions[key].map(phrase => {
        const part = document.createElement("span");
        part.textContent = phrase;
        return part;
      }));
      welcomeCopy.hidden = !welcome;
      openingContent.hidden = welcome;
      back.hidden = key !== "excludedScopes";
      if (welcome) {
        removeSlider();
        refresh();
      } else {
        renderControls(key, openingContent);
      }
      stage.scrollTop = 0;
    }

    function open(initial, preview, commit) {
      if (opening.open) return;
      editing = { draft: JudgeSelection.preferences(initial), preview, commit, page: "welcome" };
      renderOpening();
      opening.showModal();
      openingTitle.focus({ preventScroll: true });
    }

    function stopPaging() {
      const current = paging;
      if (!current) return;
      paging = null;
      current.animation?.cancel();
      current.panel.inert = false;
      for (const button of current.buttons) button.removeAttribute("aria-disabled");
    }

    async function movePanel(panel, buttons, direction, render, after) {
      if (paging) return;
      if (reducedMotion.matches) {
        render();
        after?.();
        return;
      }

      const style = getComputedStyle(panel);
      const duration = parseFloat(style.getPropertyValue("--motion-judge-page"));
      const distance = direction * parseFloat(style.getPropertyValue("--judge-page-travel"));
      const easing = style.getPropertyValue("--ease-standard").trim();
      const run = { panel, buttons, animation: null };
      paging = run;
      panel.inert = true;
      for (const button of buttons) button.setAttribute("aria-disabled", "true");
      const offset = (x) => "translateX(" + x + "px)";
      try {
        run.animation = panel.animate([
          { transform: offset(0), opacity: 1 },
          { transform: offset(-distance), opacity: 0 }
        ], { duration: duration * .4, easing, fill: "both" });
        await run.animation.finished;
        if (paging !== run) return;

        render();
        run.animation.cancel();
        if (!reducedMotion.matches) {
          run.animation = panel.animate([
            { transform: offset(distance), opacity: 0 },
            { transform: offset(0), opacity: 1 }
          ], { duration: duration * .6, easing, fill: "both" });
          await run.animation.finished;
        }
      } catch (error) {
        if (error.name !== "AbortError") throw error;
      } finally {
        if (paging === run) {
          stopPaging();
          after?.();
        }
      }
    }

    function moveOpening(direction) {
      if (!opening.open || opening.inert || (direction < 0 && back.hidden)) return;
      const page = pages[pages.indexOf(editing.page) + direction];
      if (!page) return;
      void movePanel(pageBody, pageButtons, direction, () => {
        editing.page = page;
        renderOpening();
      }, () => openingTitle.focus({ preventScroll: true }));
    }

    async function closeOpening(onClosed) {
      if (!opening.open || opening.inert) return;
      // Keep this exact page and its slider mounted until the last visible frame.
      paging?.animation?.pause();
      opening.inert = true;
      opening.setAttribute("data-closing", "");
      if (!reducedMotion.matches) {
        const fades = opening.getAnimations().filter((animation) => animation.transitionProperty === "opacity");
        await Promise.allSettled(fades.map((animation) => animation.finished));
      }
      opening.close();
      stopPaging();
      removeSlider();
      editing = null;
      opening.removeAttribute("data-closing");
      opening.inert = false;
      onClosed?.();
    }

    function retire(origin, allowOffscreen = false) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = entry.querySelector(".judge-avatar");
      const destination = target.getBoundingClientRect();
      if (!origin.width || !destination.width || (!allowOffscreen && (destination.bottom > innerHeight || destination.top < 0))) return;
      const mark = target.cloneNode(true);
      mark.classList.add("judge-flying");
      Object.assign(mark.style, { left: `${origin.left}px`, top: `${origin.top}px`, width: `${origin.width}px` });
      document.body.append(mark);
      target.animate([{ opacity: 0, offset: 0 }, { opacity: 0, offset: .75 }, { opacity: 1 }], 360);
      const flight = mark.animate([
        { transform: "translate(0, 0) scale(1)", opacity: .85 },
        { transform: `translate(${destination.left - origin.left}px, ${destination.top - origin.top}px) scale(${destination.width / origin.width})`, opacity: .15 }
      ], { duration: 360, easing: "cubic-bezier(.2,.65,.25,1)" });
      flight.finished.then(() => mark.remove(), () => mark.remove());
    }

    function finishOpening() {
      if (!opening.open || opening.inert || paging) return;
      const { draft, preview, commit } = editing;
      if (!preview(draft).available) {
        refresh();
        return;
      }
      const origin = opening.querySelector(".judge-avatar").getBoundingClientRect();
      void closeOpening(() => {
        commit(draft);
        retire(origin);
      });
    }

    function nextStep() {
      if (editing?.page === "excludedScopes") finishOpening();
      else void moveOpening(1);
    }

    function showInline(nextMode, title) {
      mode = nextMode;
      game.dataset.judge = mode;
      entry.setAttribute("aria-expanded", String(mode === "adjust"));
      byId("judgeTurnLabel").textContent = mode === "adjust" ? "调整话题范围与水温" : "法官";
      if (mode === "adjust") entry.setAttribute("aria-label", "设置，取消调整");
      else entry.removeAttribute("aria-label");
      for (const part of turnParts) part.hidden = false;
      inline.hidden = false;
      inlineTitle.textContent = title;
      inlineTitle.classList.toggle("judge-check-title", mode === "check-in");
      inlineTitle.classList.toggle("sr-only", mode === "adjust");
      checkIn.hidden = mode !== "check-in";
      adjustment.hidden = mode !== "adjust";
      onInlineChange();
      for (const fade of entryFades) fade.cancel();
      if (!reducedMotion.matches) {
        const style = getComputedStyle(inline);
        entryFades = [inline, ...turnParts].map(node => node.animate([{ opacity: 0 }, { opacity: 1 }], {
          duration: parseFloat(style.getPropertyValue("--motion-overlay")), easing: style.getPropertyValue("--ease-enter").trim()
        }));
      }
      inlineTitle.focus({ preventScroll: mode === "adjust" });
    }

    function clearNotice() {
      clearTimeout(noticeTimer);
      feedback.removeAttribute("data-visible");
    }

    function positionNotice() {
      if (feedback.hasAttribute("data-visible")) {
        feedback.style.setProperty("--notice-top", (topbar.getBoundingClientRect().bottom + 10) + "px");
      }
    }

    function showNotice(message) {
      clearTimeout(noticeTimer);
      notice.textContent = message;
      feedback.setAttribute("data-visible", "");
      positionNotice();
      byId("liveStatus").textContent = message;
      noticeTimer = setTimeout(clearNotice, 1500);
    }

    function closeInline(restoreFocus = false) {
      clearNotice();
      if (!mode) return;
      if (inlineExit) {
        for (const fade of inlineExit) fade.cancel();
        inlineExit = null;
        inline.inert = false;
      }
      stopPaging();
      removeSlider();
      for (const fade of entryFades) fade.cancel();
      entryFades = [];
      mode = editing = selectCheckIn = null;
      delete game.dataset.judge;
      entry.setAttribute("aria-expanded", "false");
      entry.removeAttribute("aria-label");
      for (const part of turnParts) part.hidden = true;
      inline.hidden = true;
      onInlineChange();
      if (restoreFocus) entry.focus({ preventScroll: true });
    }

    function exitSettings(applied) {
      if (mode !== "adjust" || inlineExit) return;
      const { afterClose, draft, commit } = editing;
      if (applied) commit(draft);
      function finish() {
        closeInline(!afterClose);
        if (afterClose) {
          afterClose();
        } else if (!reducedMotion.matches) {
          for (const node of [game.querySelector(".person-line:not(.judge-person)"), byId("questionCopy")]) {
            node.animate([{ opacity: .65 }, { opacity: 1 }], {
              duration: parseFloat(getComputedStyle(game).getPropertyValue("--motion-micro")), easing: "ease-out"
            });
          }
        }
      }
      sliderHost.querySelector('.fluid-slider__text-toggle[aria-expanded="true"]')?.click();
      entry.focus({ preventScroll: true });
      fadeOutInline(finish);
    }

    function fadeOutInline(finish) {
      if (reducedMotion.matches) {
        finish();
        return;
      }
      inline.inert = true;
      const style = getComputedStyle(inline);
      const timing = {
        duration: parseFloat(style.getPropertyValue("--motion-standard")),
        easing: style.getPropertyValue("--ease-exit").trim(),
        fill: "forwards"
      };
      const fades = [game.querySelector(".judge-person"), inline].map(node =>
        node.animate([{ opacity: getComputedStyle(node).opacity }, { opacity: 0 }], timing));
      inlineExit = fades;
      fades[1].onfinish = () => {
        if (inlineExit !== fades) return;
        finish();
      };
    }

    function dismissSettings() { exitSettings(false); }

    function leaveCheckIn(after) {
      if (mode !== "check-in" || inlineExit) return;
      const origin = game.querySelector(".judge-person .judge-avatar").getBoundingClientRect();
      retire(origin, true);
      fadeOutInline(() => { closeInline(); after(); });
    }

    function openCheckIn(temperature, selected, onSelect) {
      selectCheckIn = onSelect;
      const index = temperatures.indexOf(temperature);
      for (const choice of choices) {
        const nextIndex = index + Number(choice.value);
        choice.disabled = nextIndex < 0 || nextIndex >= temperatures.length;
        const card = choice.closest("label");
        if (choice.disabled) {
          card.tabIndex = 0;
          card.setAttribute("aria-description", nextIndex < 0 ? "已经是最低水温了" : "已经是最高水温了");
        } else {
          card.removeAttribute("tabindex");
          card.removeAttribute("aria-description");
        }
      }
      const choice = choices.find(input => !input.disabled && Number(input.value) === selected)
        ?? choices.find(input => input.value === "0");
      choice.checked = true;
      onSelect(Number(choice.value));
      showInline("check-in", "玩到这里，大家觉得今天的水温怎么样？");
    }

    function renderAdjustment() {
      const key = editing.page;
      for (const tab of tabs) tab.setAttribute("aria-pressed", String(tab.dataset.judgeSection === key));
      renderControls(key, adjustmentContent);
      adjustmentStage.scrollTop = 0;
    }

    function openAdjustment(initial, preview, commit, afterClose) {
      clearNotice();
      editing = { draft: JudgeSelection.preferences(initial), preview, commit, afterClose, page: "temperature" };
      showInline("adjust", "调整话题范围与水温");
      renderAdjustment();
    }

    byId("judgeReturn").addEventListener("click", () => { void closeOpening(); });
    opening.addEventListener("cancel", (event) => {
      event.preventDefault();
      void closeOpening();
    });
    back.addEventListener("click", () => { void moveOpening(-1); });
    skip.addEventListener("click", finishOpening);
    next.addEventListener("click", nextStep);
    reducedMotion.addEventListener("change", () => {
      if (reducedMotion.matches && !opening.inert) paging?.animation?.finish();
      if (reducedMotion.matches && inlineExit) inlineExit[1].finish();
    });
    for (const choice of choices) {
      const card = choice.closest("label");
      function explainLimit(event) {
        if (mode !== "check-in" || !choice.disabled) return;
        event.preventDefault();
        showNotice(card.getAttribute("aria-description"));
      }
      card.addEventListener("click", explainLimit);
      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") explainLimit(event);
      });
      choice.addEventListener("change", () => {
        if (mode === "check-in" && choice.checked) selectCheckIn(Number(choice.value));
      });
    }
    for (const [index, tab] of tabs.entries()) tab.addEventListener("click", () => {
      const key = tab.dataset.judgeSection;
      if (mode !== "adjust" || editing.page === key) return;
      const current = tabs.findIndex((item) => item.dataset.judgeSection === editing.page);
      void movePanel(adjustmentContent, tabs, index > current ? 1 : -1, () => {
        editing.page = key;
        renderAdjustment();
      });
    });
    byId("judgeCancelAdjustment").addEventListener("click", dismissSettings);
    byId("judgeApply").addEventListener("click", () => exitSettings(true));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && mode === "adjust" && !document.querySelector("dialog[open]") &&
          !sliderHost.querySelector(".fluid-slider__explanation[data-open]")) dismissSettings();
    });
    document.addEventListener("pointerdown", event => {
      if (feedback.hasAttribute("data-visible") && !notice.contains(event.target)) clearNotice();
    }, { capture: true, passive: true });
    window.addEventListener("resize", positionNotice);
    window.addEventListener("scroll", positionNotice, { passive: true });

    return { get mode() { return mode; }, open, openCheckIn, leaveCheckIn, openAdjustment, dismissSettings, closeInline, refresh };
  }

  return { init };
})();
</script>
<script>
(() => {

  const bank = JSON.parse(document.getElementById("questionBank").textContent);
  const SAVED_ROUND_KEY = "truth-wheel/paused-round/v1";
  const SAVED_ROUND_VERSION = 2;

  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");

  const el = {
    body: document.body,
    setupView: document.getElementById("setupView"),
