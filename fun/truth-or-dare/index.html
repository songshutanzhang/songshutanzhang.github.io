    initTopicSuggestions(narrow);
    let picker;
    const isTrigger = target => narrow.matches && target instanceof HTMLSelectElement &&
      !target.disabled && !target.multiple && target.size <= 1;

    function open(select, fromPointer = false) {
      if (picker?.open || !select.options.length) return;
      const dialog = document.createElement("dialog");
      const list = document.createElement("div");
      const label = select.labels?.[0]?.cloneNode(true);
      label?.querySelector("select")?.remove();
      const name = select.getAttribute("aria-label") || label?.textContent.trim() || "选择选项";
      dialog.className = "mobile-options";
      dialog.toggleAttribute("data-pointer", fromPointer);
      dialog.setAttribute("aria-label", name);
      list.setAttribute("role", "listbox");
      list.setAttribute("aria-label", name);
      dialog.append(list);
      for (const option of select.options) {
        if (option.hidden || option.parentElement.hidden) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option.label;
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", String(option.selected));
        button.disabled = option.disabled || option.parentElement.matches("optgroup:disabled");
        button.tabIndex = -1;
        button.addEventListener("click", () => {
          if (dialog.hasAttribute("data-closing")) return;
          const changed = select.selectedIndex !== option.index;
          select.selectedIndex = option.index;
          for (const item of list.children) item.setAttribute("aria-selected", String(item === button));
          void dismissDialog(dialog, () => {
            if (changed) {
              select.dispatchEvent(new Event("input", { bubbles: true }));
              select.dispatchEvent(new Event("change", { bubbles: true }));
            }
          });
        });
        list.append(button);
      }
      const options = [...list.querySelectorAll("button:enabled")];
      if (!options.length) return;
      const selected = options.find(button => button.getAttribute("aria-selected") === "true") || options[0];
      selected.tabIndex = 0;
      dialog.addEventListener("pointerdown", () => { dialog.dataset.pointer = ""; });
      dialog.addEventListener("keydown", event => {
        if (dialog.hasAttribute("data-closing")) { event.preventDefault(); return; }
        dialog.removeAttribute("data-pointer");
        const index = options.indexOf(document.activeElement);
        if (index >= 0 && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          if (!event.repeat) options[index].click();
          return;
        }
        const position = { ArrowDown: Math.min(index + 1, options.length - 1), ArrowUp: Math.max(index - 1, 0),
          Home: 0, End: options.length - 1 }[event.key];
        if (position === undefined) return;
        event.preventDefault();
        if (index >= 0) options[index].tabIndex = -1;
        options[position].tabIndex = 0;
        options[position].focus();
      });
      dialog.addEventListener("click", event => {
        if (event.target === dialog) {
          const r = dialog.getBoundingClientRect();
          if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) void dismissDialog(dialog);
        }
      });
      dialog.addEventListener("cancel", event => { event.preventDefault(); void dismissDialog(dialog); });
      dialog.addEventListener("close", () => {
        dialog.remove();
        if (picker === dialog) picker = null;
        if (dialog.hasAttribute("data-pointer")) select.blur();
        else if (select.isConnected) select.focus({ preventScroll: true });
      }, { once: true });
      (select.closest("[popover], dialog") || document.body).append(dialog);
      picker = dialog;
      dialog.showModal();
      selected.focus();
    }
    // 原生移动端选择面板由系统排版，移动端用同一个居中菜单写回原 select。
    document.addEventListener("mousedown", event => {
      if (event.button === 0 && isTrigger(event.target)) event.preventDefault();
    });
    document.addEventListener("click", event => {
      if (!isTrigger(event.target)) return;
      event.preventDefault();
      open(event.target, event.detail > 0);
    });
    document.addEventListener("keydown", event => {
      if (!isTrigger(event.target) || ![" ", "Enter", "ArrowDown", "ArrowUp", "F4"].includes(event.key)) return;
      event.preventDefault();
      open(event.target);
    });
    narrow.addEventListener("change", () => { if (!narrow.matches && picker?.open) void dismissDialog(picker); });
  }

  function initTopicSuggestions(narrow) {
    const data = document.getElementById("topicOptions");
    const fields = [...document.querySelectorAll('input[list="topicOptions"]')];
    const list = document.createElement("div");
    list.className = "topic-suggestions";
    list.id = "mobileTopicSuggestions";
    list.setAttribute("role", "listbox");
    fields[0].closest(".filters-grid").append(list);
    let field, active = -1;

    function dismiss() {
      list.hidden = true;
      active = -1;
      if (field) {
        field.setAttribute("aria-expanded", "false");
        field.removeAttribute("aria-activedescendant");
      }
    }
    function render(input) {
      if (!narrow.matches) return;
      field = input;
      dismiss();
      const terms = input.value.split(/[,，、]/).map(term => term.trim().toLowerCase());
      const query = terms.pop();
      const options = [...data.options].filter(option => !terms.includes(option.value.toLowerCase()) &&
        (option.value.toLowerCase().includes(query) || option.label.toLowerCase().includes(query)));
      list.replaceChildren(...options.map((option, index) => {
        const item = document.createElement("div");
        item.setAttribute("role", "option");
        item.id = "topicSuggestion-" + index;
        item.dataset.value = item.textContent = option.value;
        return item;
      }));
      list.scrollTop = 0;
      list.hidden = !options.length;
      field.setAttribute("aria-expanded", String(!list.hidden));
    }
    function choose(item) {
      const prefix = field.value.match(/^.*[,，、]\s*/)?.[0] || "";
      field.value = prefix + item.dataset.value;
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      dismiss();
    }
    list.addEventListener("mousedown", event => event.preventDefault());
    list.addEventListener("click", event => {
      if (event.target.matches('[role="option"]')) choose(event.target);
    });
    for (const input of fields) {
      input.addEventListener("focus", () => render(input));
      input.addEventListener("input", () => render(input));
      input.addEventListener("blur", dismiss);
      input.addEventListener("keydown", event => {
        if (!narrow.matches || event.isComposing) return;
        if (list.hidden && event.key === "ArrowDown") render(input);
        if (list.hidden) return;
        if (event.key === "Escape") {
          event.preventDefault(); event.stopPropagation(); dismiss();
        } else if (event.key === "Enter" && active >= 0) {
          event.preventDefault(); choose(list.children[active]);
        } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          list.children[active]?.removeAttribute("aria-selected");
          active = Math.max(0, Math.min(list.children.length - 1, active + (event.key === "ArrowDown" ? 1 : -1)));
          const item = list.children[active];
          item.setAttribute("aria-selected", "true");
          input.setAttribute("aria-activedescendant", item.id);
          item.scrollIntoView({ block: "nearest" });
        }
      });
    }
    function adapt() {
      dismiss();
      for (const input of fields) {
        if (narrow.matches) {
          input.removeAttribute("list");
          input.setAttribute("role", "combobox");
          input.setAttribute("aria-autocomplete", "list");
          input.setAttribute("aria-controls", list.id);
          input.setAttribute("aria-expanded", "false");
        } else {
          input.setAttribute("list", data.id);
          for (const key of ["role", "aria-autocomplete", "aria-controls", "aria-expanded"]) input.removeAttribute(key);
        }
      }
      field = null;
    }
    narrow.addEventListener("change", adapt);
    adapt();
  }

  function initFilterMenu() {
    const trigger = document.getElementById("filtersToggle");
    const menu = document.getElementById("filtersMenu");
    const viewport = window.visualViewport;
    const inset = 12;
    const gap = 6;
    const hasPopover = typeof menu.showPopover === "function";
    const isOpen = () => hasPopover ? menu.matches(":popover-open") : menu.hasAttribute("data-open");
    function place() {
      const anchor = trigger.getBoundingClientRect();
      if (!anchor.width) return;
      const left = (viewport?.offsetLeft ?? 0) + inset;
      const top = (viewport?.offsetTop ?? 0) + inset;
      const right = left + (viewport?.width ?? document.documentElement.clientWidth) - 2 * inset;
      const bottom = top + (viewport?.height ?? document.documentElement.clientHeight) - 2 * inset;
      const below = bottom - anchor.bottom - gap;
      const above = anchor.top - gap - top;
      // Prefer the space above the trigger when two settings rows fit.
      const down = above < Math.min(156, below);
      const width = Math.min(anchor.width, right - left);
      menu.dataset.side = down ? "down" : "up";
      trigger.dataset.side = menu.dataset.side;
      menu.style.width = width + "px";
      menu.style.left = Math.max(left, Math.min(anchor.left, right - width)) + "px";
      menu.style.maxHeight = Math.max(0, down ? below : above) + "px";
      menu.style.top = down ? (anchor.bottom + gap) + "px" : "auto";
      menu.style.bottom = down ? "auto" : (document.documentElement.clientHeight - anchor.top + gap) + "px";
    }
    if (hasPopover) {
      menu.addEventListener("beforetoggle", ({ newState }) => {
        const open = newState === "open";
        trigger.setAttribute("aria-expanded", String(open));
        if (open) place();
      });
    } else {
      function toggle(open) {
        trigger.setAttribute("aria-expanded", String(open));
        if (open) place();
        menu.toggleAttribute("data-open", open);
      }
      trigger.addEventListener("click", () => toggle(!isOpen()));
      document.addEventListener("pointerdown", (event) => {
        if (isOpen() && !el.filters.contains(event.target)) toggle(false);
      });
      document.addEventListener("keydown", (event) => {
        if (isOpen() && event.key === "Escape") {
          toggle(false);
          trigger.focus({ preventScroll: true });
        }
      });
    }
    function reposition() { if (isOpen()) place(); }
    window.addEventListener("resize", reposition);
    window.addEventListener("scroll", reposition, { passive: true });
    viewport?.addEventListener("resize", reposition);
    viewport?.addEventListener("scroll", reposition);
  }

  function readFilters() {
    const input = (id) => document.getElementById(id);
    const value = (id) => input(id).value;
    const checked = (id) => Array.from(input(id).querySelectorAll("input:checked"), (item) => item.value);
    const topicByLabel = new Map(Object.entries(bank.taxonomy.topics).map(([key, label]) => [label, key]));
    const topics = (id) => value(id).split(/[,，、]/).map((item) => item.trim())
      .filter(Boolean).map((item) => topicByLabel.get(item) ?? item);
    const presets = checked("excludePresets").flatMap((key) => bank.taxonomy.exclusions[key].tags);
    if (!input("drawCount").validity.valid) throw new Error("请输入正整数作为抽题数量。");
    return {
      scene: value("scene"),
      minDepth: Number(value("minDepth")),
      maxDepth: Number(value("maxDepth")),
      count: value("drawCount") ? Number(value("drawCount")) : undefined,
      playerOrder: value("playerOrder"),
      includeDomains: checked("includeDomains"),
      excludeDomains: checked("excludeDomains"),
      includeTopics: topics("includeTopics"),
      excludeTopics: [...presets, ...topics("excludeTopics")]
    };
  }

  function updateSetup() {
    try {
      const options = readFilters();
      const { candidates } = QuestionSelector.eligibility(bank, options);
      const available = candidates.length;
      const tooFew = options.count > available;
      el.newSession.disabled = available === 0 || tooFew;
      el.startBtn.disabled = el.newSession.disabled && el.resumeBtn.disabled;
      if (available === 0) {
        el.poolSummary.textContent = "没有符合条件的题目，请调整筛选。";
      } else if (tooFew) {
        el.poolSummary.textContent = `有 ${available} 道可用题，少于所需的 ${options.count} 道。请调整数量或筛选。`;
      } else {
        el.poolSummary.textContent = "";
      }
      return el.newSession.disabled ? null : options;
    } catch (error) {
      el.newSession.disabled = true;
      el.startBtn.disabled = el.resumeBtn.disabled;
      el.poolSummary.textContent = error.message;
      return null;
    }
  }

  function eligibleQuestions(options, poolIds = null) {
    const { candidates } = QuestionSelector.eligibility(bank, options);
    return poolIds ? candidates.filter((question) => poolIds.has(question.id)) : candidates;
  }

  function availableQuestions(settings = state.judge) {
    return JudgeSelection.remaining(state.candidates, state.seenIds, settings.excludedScopes);
  }

  function remainingBudget() {
    return Math.max(0, state.budget - state.seenIds.size);
  }

  function savedPool(saved) {
    const ids = saved.version === SAVED_ROUND_VERSION ? saved.legacyPoolIds : saved.remainingIds;
    return ids ? new Set(ids) : null;
  }

  function savedBudget(saved, seen, pool) {
    if (saved.version === SAVED_ROUND_VERSION) return saved.budget;
    return seen.size + [...pool].filter((id) => !seen.has(id)).length;
  }

  function historyFromSave(saved) {
    const byId = new Map((Array.isArray(saved.history) ? saved.history : [])
      .filter((entry) => typeof entry?.id === "string" && typeof entry.question === "string")
      .map((entry) => [entry.id, entry.question]));
    return saved.seenIds.map((id) => ({
      id,
      question: byId.get(id) ?? bank.questions.find((q) => q.id === id)?.question ?? "当前题库中已找不到这道题。"
    }));
  }

  function renderRoundHistory(items) {
    const fragment = document.createDocumentFragment();
    for (const { id, question } of [...items].reverse()) {
      const row = document.createElement("li");
      const heading = document.createElement("div");
      heading.className = "history-row-head";
      const index = document.createElement("span");
      index.className = "field-hint";
      index.textContent = id;
      heading.append(index);
      const text = document.createElement("p");
      text.textContent = question;
      row.append(heading, text);
      fragment.appendChild(row);
    }
    document.getElementById("roundHistoryList").replaceChildren(fragment);
    document.getElementById("roundHistoryEmpty").hidden = items.length > 0;
  }

  function openRoundHistory(items) {
    renderRoundHistory(items);
    const dialog = document.getElementById("roundHistory");
    dialog.showModal();
    document.getElementById("roundHistoryList").scrollTop = 0;
  }

  function readSavedRound() {
    try {
      const saved = JSON.parse(window.localStorage.getItem(SAVED_ROUND_KEY));
      const isPlayer = (player) => Number.isInteger(player) && player >= 1 && player <= saved.playerCount;
      const isId = (id) => typeof id === "string" && /^Q\d{3,}$/.test(id);
      const isIdList = (ids) => Array.isArray(ids) && ids.every(isId);
      if (typeof saved?.roundId !== "string" || !Number.isInteger(saved.playerCount) ||
          saved.playerCount < 2 || saved.playerCount > 99 ||
          (saved.previousPlayer != null && !isPlayer(saved.previousPlayer)) || !isIdList(saved.seenIds) ||
          !saved.options || typeof saved.options !== "object" || Array.isArray(saved.options)) return null;
      if (saved.version == null) {
        return isIdList(saved.remainingIds) && (saved.readyPlayer == null || isPlayer(saved.readyPlayer)) ? saved : null;
      }
      if (saved.version !== SAVED_ROUND_VERSION || !Number.isSafeInteger(saved.budget) ||
          saved.budget < new Set(saved.seenIds).size || (saved.legacyPoolIds != null && !isIdList(saved.legacyPoolIds))) return null;
      const { turn, judge } = saved;
      if (!["between", "ready", "question", "end"].includes(turn?.phase) ||
          (turn.player != null && !isPlayer(turn.player)) ||
          (["ready", "question"].includes(turn.phase) && !isPlayer(turn.player)) ||
          (turn.phase === "question" && !turn.question) ||
          (turn.question && (!isId(turn.question.id) || !saved.seenIds.includes(turn.question.id) ||
            typeof turn.question.question !== "string"))) return null;
      const { min, max } = JudgeSelection.checkIn;
      if (!Number.isSafeInteger(judge?.completedQuestions) || judge.completedQuestions < 0 ||
          judge.completedQuestions > saved.seenIds.length || !Number.isSafeInteger(judge.sequenceStartAt) ||
          judge.sequenceStartAt < 0 || judge.sequenceStartAt > judge.completedQuestions ||
          !Number.isInteger(judge.checkIn?.triggerAt) || judge.checkIn.triggerAt < min || judge.checkIn.triggerAt > max ||
          !["waiting", "pending", "done"].includes(judge.checkIn.status) ||
          (judge.checkIn.status === "pending" && turn.phase !== "between")) return null;
      return saved;
    } catch {
      return null;
    }
  }

  function updateSavedRound() {
    const saved = readSavedRound();
    const seen = new Set(saved?.seenIds);
    let resumable = false;
    if (saved) {
      try {
        const pool = savedPool(saved);
        const candidates = eligibleQuestions(saved.options, pool);
        resumable = saved.version === SAVED_ROUND_VERSION
          ? savedBudget(saved, seen, pool) > seen.size || saved.turn.phase === "question" || saved.judge.checkIn.status === "pending"
          : candidates.some(question => !seen.has(question.id));
      } catch { /* Invalid legacy filters cannot be resumed. */ }
    }
    el.resumeBtn.disabled = !resumable;
    updateSetup();
    if (!resumable && el.sessionChoices.open) el.sessionChoices.close();
  }

  function forgetSave(expected) {
    if (!expected || JSON.stringify(readSavedRound()) !== JSON.stringify(expected)) return true;
    try {
      window.localStorage.removeItem(SAVED_ROUND_KEY);
      return true;
    } catch {
      return false;
    }
  }

  function showHomeFeedback(text) {
    el.homeFeedback.hidden = !text;
    el.homeFeedback.textContent = text;
  }

  function refreshHomeChoices(saved) {
    const replacing = saved && saved.roundId !== state.roundId;
    replaceRoundId = replacing ? saved.roundId : null;
    el.homeNote.hidden = !replacing;
    el.homeNote.textContent = replacing ? "已有另一局存档，保留本轮会替换它。" : "";
    showHomeFeedback("");
  }

  function openHomeChoices() {
    refreshHomeChoices(readSavedRound());
    el.homeChoices.showModal();
  }

  function storeRound(existing, { interrupted = false, silent = false } = {}) {
    const sameRound = existing?.roundId === state.roundId;
    if (sameRound && JSON.stringify(existing) !== state.resumedSave) {
      if (!silent) showHomeFeedback("另一个页面已更新这局存档。");
      return false;
    }
    const hasPlayer = Number.isInteger(state.currentPlayer) &&
      state.currentPlayer >= 1 && state.currentPlayer <= state.playerCount;
    const stablePhase = state.phase === "question" && state.currentQuestion && hasPlayer ? "question"
      : state.phase === "end" ? "end"
      : (state.phase === "ready" || state.phase === "rewinding") && hasPlayer ? "ready"
      : "between";
    const question = stablePhase === "question" ? state.currentQuestion : null;
    const turn = { phase: stablePhase, player: hasPlayer ? state.currentPlayer : null };
    if (question) turn.question = { id: question.id, question: question.question };
    const saved = {
      version: SAVED_ROUND_VERSION,
      roundId: state.roundId,
      options: state.selectionOptions,
      playerCount: state.playerCount,
      previousPlayer: state.previousPlayer,
      turn,
      seenIds: [...state.seenIds],
      history: state.history,
      budget: state.budget,
      judge: state.judge
    };
    if (interrupted) saved.interrupted = true;
    if (state.legacyPoolIds) saved.legacyPoolIds = [...state.legacyPoolIds];
    try {
      const serialized = JSON.stringify(saved);
      window.localStorage.setItem(SAVED_ROUND_KEY, serialized);
      state.resumedSave = serialized;
      return true;
    } catch {
      if (!silent) showHomeFeedback("浏览器未能保存进度，请保持当前页面打开。");
      return false;
    }
  }

  function autoSaveActiveRound() {
    if (state.phase === "setup" || state.phase === "end" || !state.roundId || !state.judge) return;
    const existing = readSavedRound();
    if (existing && existing.roundId !== state.roundId) return;
    storeRound(existing, { interrupted: true, silent: true });
  }

  function clearInterruptedFlag() {
    const saved = readSavedRound();
    if (!saved?.interrupted) return;
    delete saved.interrupted;
    try {
      const serialized = JSON.stringify(saved);
      window.localStorage.setItem(SAVED_ROUND_KEY, serialized);
      if (state.roundId === saved.roundId) state.resumedSave = serialized;
    } catch {}
  }

  function saveAndReturn() {
    if (state.phase === "setup") return;
    const existing = readSavedRound();
    if (existing && existing.roundId !== state.roundId && existing.roundId !== replaceRoundId) {
      refreshHomeChoices(existing);
      return;
    }
    if (!storeRound(existing, { interrupted: false })) return;
    returnToSetup();
  }

  function resumeGame() {
    const saved = readSavedRound();
    if (!saved) {
      updateSavedRound();
      return;
    }
    const legacy = saved.version !== SAVED_ROUND_VERSION;
    const pool = savedPool(saved);
    let candidates;
    try {
      candidates = eligibleQuestions(saved.options, pool);
    } catch {
      updateSavedRound();
      return;
    }
    const seen = new Set(saved.seenIds);
    if (legacy && !candidates.some((question) => !seen.has(question.id))) {
      updateSavedRound();
      return;
    }

    state.roundId = saved.roundId;
    state.resumedSave = JSON.stringify(saved);
    state.seenIds = seen;
    state.history = historyFromSave(saved);
    state.candidates = candidates;
    state.legacyPoolIds = pool;
    state.budget = savedBudget(saved, seen, pool);
    // 旧存档只记录亮过的题号，无法据此区分回答和换题。
    state.judge = legacy ? JudgeSelection.createState({ sequence: saved.options.gradual ? "gradual" : "random" }, randomInt)
      : { ...JudgeSelection.preferences(saved.judge), completedQuestions: saved.judge.completedQuestions,
        sequenceStartAt: saved.judge.sequenceStartAt, checkIn: { ...saved.judge.checkIn } };
    el.drawOrder.value = state.judge.sequence;
    const playerOrder = saved.options.playerOrder === "sequential" ? "sequential" : "random";
    const { gradual, ...options } = saved.options;
    state.selectionOptions = { ...options, playerOrder };
    document.getElementById("playerOrder").value = playerOrder;
    state.playerCount = saved.playerCount;
    state.previousPlayer = saved.previousPlayer ?? null;
    setCount(state.playerCount);
    showGame();
    const turn = legacy ? { phase: saved.readyPlayer == null ? "between" : "ready", player: saved.readyPlayer } : saved.turn;
    if (turn.phase === "ready") revealPlayer(turn.player);
    else if (["question", "end"].includes(turn.phase)) restoreDisplayedTurn(turn);
    else if (state.judge.checkIn.status === "pending") showCheckIn();
    else advanceTurn();
    if (!judgeUI.mode && !el.primaryBtn.disabled && !window.__isTouchInput?.()) el.primaryBtn.focus();
  }

  function padNumber(value) {
    return String(value).padStart(2, "0");
  }

  function randomInt(maxExclusive) {
    if (maxExclusive <= 0) return 0;
    if (window.crypto && typeof window.crypto.getRandomValues === "function") {
      const buffer = new Uint32Array(1);
      const ceiling = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
      let value;
      do {
        window.crypto.getRandomValues(buffer);
        value = buffer[0];
      } while (value >= ceiling);
      return value % maxExclusive;
    }
    return Math.floor(Math.random() * maxExclusive);
  }

  function createHomeNoteWall(canvas) {
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;

    // 保留四组低饱和度色系，进一步降低与墙面 #F2EFE6 的饱和度及明度对比，
    // 全不透明纸面，保持纸身、折角反面、纸背与铅笔笔迹之间克制而清晰的层次。
    const PALETTE = [
      // [纸身正面, 折角/卷边面, 纸张背面, 抽象笔迹]
      ["#E8DCC6", "#D2C0A2", "#EFE6D6", "#B6A891"], // 黄褐
      ["#DFE2D3", "#C5CAB5", "#E8EBDF", "#A5AA96"], // 灰绿
      ["#E9DAD2", "#D4BEB2", "#F0E5DF", "#B9A59B"], // 浅红
      ["#D9E1DC", "#BFCBC4", "#E6ECE8", "#A0ADA6"]  // 灰青
    ];

    const MAX_NOTES = 9;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const clamp01 = (v) => (v <= 0 ? 0 : v >= 1 ? 1 : v);
    const smooth = (t) => { const c = clamp01(t); return c * c * (3 - 2 * c); };
    const mix = (a, b, t) => a + (b - a) * t;
    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 每张便签在页面初始化时获得唯一且持久的身份；刷新可变化，普通重绘与缩放不重置。
    const mobilePalette = shuffle([0, 1, 2, 3]);
    const desktopPalette = shuffle([0, 1, 2, 3, Math.floor(Math.random() * 4)]);
    const colorOrder = mobilePalette.concat(desktopPalette);

    // 形态与从左向右的主风场一致：多数左下角折起、一部分左下底边自然卷曲、少量平整或轻度他向卷角。
    const mobileShapes = shuffle(["fold", "fold", "roll", Math.random() < 0.72 ? "flat" : "fold"]);
    const desktopShapes = shuffle(["fold", "fold", "fold", "roll", Math.random() < 0.62 ? "altFold" : "flat"]);
    const shapeOrder = mobileShapes.concat(desktopShapes);

    // 分层随机尺寸档位，保证大小自然参差而非整齐划一。
    const sizeBins = shuffle([0.04, 0.16, 0.28, 0.40, 0.52, 0.64, 0.76, 0.88, 0.96])
      .map(b => clamp01(b + (Math.random() - 0.5) * 0.10));

    // 释放顺序在左右半区与移动端可见项（0..3）之间交错，避免单侧集中离场或窄屏空窗。
    const mobileRel = shuffle([0, 1, 2, 3]);
    const desktopRel = shuffle([4, 5, 6, 7, 8]);
    const releaseOrder = [
      mobileRel[0], desktopRel[0], mobileRel[1], desktopRel[1], desktopRel[2],
      mobileRel[2], desktopRel[3], mobileRel[3], desktopRel[4]
    ];

    // 每个锚位在桌面端的大致水平比例，用于给每张便签分配与飞行距离匹配且不可变的飞行时程。
    const nominalXRatio = [0.46, 0.85, 0.08, 0.88, 0.13, 0.60, 0.35, 0.63, 0.30];

    // 轻微遮挡钟表外缘的便签固定选用 10:30 方向（右下轻贴表盘外缘，胶带与左下卷角完整外露）。
    const rimTuckAngle = (-47 + (Math.random() - 0.5) * 10) * Math.PI / 180;

    function createPaper(index) {
      const rand = Math.random;
      const shape = shapeOrder[index];
      const softness = 0.26 + 0.68 * rand();
      const markPick = rand();
      const markCount = markPick < 0.16 ? 0 : markPick < 0.44 ? 1 : markPick < 0.82 ? 2 : 3;
      const anchor = 0.42 + 0.16 * rand();
      const leftBound = -anchor + 0.17;
      const rightBound = 1 - anchor - 0.16;
      const maxSpan = Math.max(0.24, rightBound - leftBound);
      const marks = Array.from({ length: markCount }, (_, row) => {
        const startX = leftBound + rand() * 0.08;
        const maxLen = Math.max(0.18, rightBound - startX);
        const frac = row === markCount - 1 && markCount > 1 ? (0.42 + 0.34 * rand()) : (0.58 + 0.34 * rand());
        return {
          x: startX,
          y: 0.25 + row * 0.165 + (rand() - 0.5) * 0.03,
          len: clamp(maxSpan * frac, 0.18, maxLen),
          rise: (rand() - 0.5) * 0.055,
          arch: (rand() - 0.5) * 0.028
        };
      });
      const distRatio = clamp(1.06 - nominalXRatio[index], 0.18, 1.04);
      return {
        index,
        ink: PALETTE[colorOrder[index]],
        shape,
        sizeNorm: sizeBins[index],
        ratio: 0.88 + 0.20 * rand(),
        lean: (rand() - 0.5) * 0.24,
        softness,
        adhesion: 0.5,
        delay: 0.15 + 0.70 * rand(),
        phase: rand() * Math.PI * 2,
        flutterFreq: 1.55 + 0.75 * rand(),
        lip: shape === "fold" ? (0.17 + 0.075 * rand())
          : shape === "roll" ? (0.14 + 0.065 * rand())
          : shape === "altFold" ? (0.13 + 0.05 * rand())
          : 0.04,
        anchor,
        tapeWidth: 0.26 + 0.11 * rand(),
        tapeHeight: 0.105 + 0.025 * rand(),
        tapeTilt: (rand() - 0.5) * 0.14,
        marks,
        rollDir: rand() < 0.5 ? 1 : -1,
        rollTurns: 1.75 + 1.45 * rand(),
        arcLift: 0.65 + 0.75 * rand(),
        waveAmp: 0.26 + 0.34 * rand(),
        waveCycles: 1.4 + 0.9 * rand(),
        // 飞行时程与名义离场距离成正比，左右各处便签风中滑行速度自然一致。
        flightSpan: 64 + distRatio * 86 + rand() * 14,
        peelStart: 0,
        peelSpan: 20,
        launchT: Infinity,
        // 静态微风与交互强风共用同一受风弹簧状态（仅附着期参与，离场飞行严格由时间轴驱动）。
        gust: 0.34,
        gustVel: 0,
        pressure: 0
      };
    }

    const papers = Array.from({ length: MAX_NOTES }, (_, i) => createPaper(i));
    let nextWork = 9 + Math.random() * 5;
    for (let rank = 0; rank < releaseOrder.length; rank++) {
      const p = papers[releaseOrder[rank]];
      p.adhesion = (rank + 0.25 + 0.5 * Math.random()) / releaseOrder.length;
      p.peelStart = nextWork;
      p.peelSpan = 18 + p.adhesion * 12 + (1 - p.softness) * 5;
      // 严格错开脱落阈值，避免多张便签同时脱离并重叠飞行。
      nextWork += 19 + Math.random() * 9;
    }

    // 统一且柔和的自然呼吸风场：以 ~4.6s 舒缓呼吸节律为基底，叠加左向右行进的微风波与风峰轻颤，
    // 让便签呈现自然呼吸感与轻柔摇曳，同时避免机械同步或急促抖动。
    function ambientWind(seconds, nx, ny, paper) {
      const travel = seconds - nx * 1.45 - ny * 0.34 - paper.delay * 0.72;
      const envelope = 0.58 + 0.42 * Math.sin(0.39 * travel + 0.75 * Math.sin(0.17 * travel));
      const breath = Math.sin(1.34 * travel + 0.52 * Math.sin(0.41 * travel)) * (0.34 + 0.22 * envelope);
      const swell = Math.sin(2.02 * travel - 0.85 * ny + paper.phase * 0.35) * (0.15 + 0.08 * envelope);
      const base = clamp(0.48 + breath + swell, 0.03, 1.22);
      const flutter = Math.sin(paper.flutterFreq * 1.35 * travel + paper.phase) * 0.095 * (base * base);
      return clamp(base + flutter, 0.02, 1.30);
    }

    // 受约束的建筑感挂点布局：引用真实 DOM 组件坐标，保留刷新变化与缩放身份连续性。
    function createPaperMounts() {
      const jitterSeeds = Array.from({ length: MAX_NOTES }, () => ({
        dx: Math.random() - 0.5,
        dy: Math.random() - 0.5,
        ringSeed: Math.random() * Math.PI * 2
      }));

      function readBox(selector) {
        const node = document.querySelector(selector);
        if (!node) return null;
        const r = node.getBoundingClientRect();
        if (r.width < 1 || r.height < 1) return null;
        return {
          left: r.left + scrollX, right: r.right + scrollX,
          top: r.top + scrollY, bottom: r.bottom + scrollY,
          width: r.width, height: r.height
        };
      }

      function layout(viewW, viewH) {
        const page = readBox(".page");
        const panel = readBox(".panel");
        const clock = readBox("#wheelWrap");
        const topbar = readBox(".topbar");
        const title = readBox(".setup-title");
        const form = readBox(".setup-form");
        const filters = readBox("#filtersToggle");
        if (!page || !panel || !clock || !topbar || !title || !filters) {
          return papers.map(() => ({ x: 0, y: 0, width: 0, visible: false, deltaY: 0 }));
        }

        const stacked = matchMedia("(max-width: 980px)").matches;
        const narrow = viewW <= 620;
        const tiny = viewW <= 355;
        const compactDesktop = !stacked && viewW < 1120;
        const wallH = Math.max(viewH, page.bottom);
        const limit = tiny ? 3 : narrow ? 4 : stacked ? 5 : compactDesktop ? 8 : MAX_NOTES;

        const dialX = (clock.left + clock.right) / 2;
        const dialY = (clock.top + clock.bottom) / 2;
        const radius = clock.width / 2;
        // 钟表外缘实际白底半径为 300/320 * radius。
        const faceRadius = radius * (300 / 320);

        const rightEdge = Math.min(viewW - 22, Math.max(page.right, filters.right + 36));
        const formLeft = form ? form.left : filters.left;
        const formRight = form ? form.right : filters.right;
        const formX = (t) => mix(formLeft, formRight, t);
        const lowerBandTop = filters.bottom + 14;
        const lowerBandBottom = Math.max(wallH - 16, panel.bottom);

        // 桌面 9 点：打破均匀外框环，左壁 5 点（含 1 点 10:30 轻贴表盘外缘）+ 右壁 4 点，
        // 不在标题与“开始”之间强行塞入便签；窄屏 3–5 点聚焦标题两侧与表盘外周留白。
        const targets = stacked ? [
          [mix(16, title.left, 0.56), mix(title.top, title.top + title.height * 0.46, 0.52)],
          [mix(title.right, viewW - 16, 0.54), mix(title.top + title.height * 0.52, title.bottom + 24, 0.65)],
          [mix(12, clock.left, 0.52), dialY + radius * 0.56],
          [mix(clock.right, viewW - 12, 0.52), dialY - radius * 0.52],
          [mix(formRight - 24, viewW - 18, 0.45), Math.min(wallH - 36, clock.bottom + 10)]
        ] : [
          [mix(clock.right + 16, panel.left - 18, 0.48), dialY - radius * 0.46],
          [mix(title.right - 36, rightEdge, 0.54), mix(topbar.bottom + 12, title.top - 16, 0.46)],
          [Math.max(30, dialX - radius * 1.12), dialY + radius * 0.68],
          [mix(formX(0.76), rightEdge, 0.46), mix(lowerBandTop, lowerBandBottom, 0.46)],
          [dialX + Math.sin(rimTuckAngle) * (faceRadius + 13), dialY - Math.cos(rimTuckAngle) * (faceRadius + 13)],
          [mix(panel.left + 26, title.left + 20, 0.50), mix(topbar.bottom + 24, title.top - 12, 0.56)],
          [dialX + radius * 0.52, mix(clock.bottom + 12, wallH - 22, 0.46)],
          [formX(0.16), mix(lowerBandTop, lowerBandBottom, 0.68)],
          [dialX + radius * 0.16, mix(topbar.bottom + 10, clock.top - 14, 0.44)]
        ];

        // 严格保护所有可见文字、控件、提示、历史入口与分隔线，确保便签绝不覆盖可读内容。
        const keepSelectors = [
          ".brand", ".topbar-meta", ".setup-title .brand-latin", ".setup-title-chinese",
          ".field-head", ".setup-row", ".form-error", ".draw-order-row",
          ".pool-summary", "#filtersToggle"
        ];
        const keepClear = keepSelectors.map(readBox).filter(Boolean);
        keepClear.push(stacked
          ? { left: panel.left, right: panel.right, top: panel.top - 2, bottom: panel.top + 3 }
          : { left: panel.left - 3, right: panel.left + 4, top: panel.top, bottom: panel.bottom });

        const result = [];
        for (let i = 0; i < MAX_NOTES; i++) {
          const p = papers[i];
          const seed = jitterSeeds[i];
          const size = tiny ? (19 + p.sizeNorm * 6)
            : narrow ? (21 + p.sizeNorm * 7)
            : stacked ? (24 + p.sizeNorm * 9)
            : (28 + p.sizeNorm * 11.5);
          const point = { x: 0, y: 0, width: size, visible: false, deltaY: 0 };

          if (i < limit) {
            const isRimTuck = !stacked && i === 4 && viewW >= 1120;
            const [tx, ty] = targets[i];
            const jitterX = narrow ? 20 : 50;
            const jitterY = narrow ? 18 : 42;
            const minGapFactor = narrow ? 1.38 : 1.72;
            const noteH = size * p.ratio;
            const padX = narrow ? (size * 0.62 + 8) : Math.max(size * 0.80 + 18, 44);
            const padTop = size * 0.24 + 8;
            const padBot = noteH + 10;

            if (isRimTuck) {
              // 极坐标直接锚定在 10:30 表盘外缘：右下约 18–25% 轻藏于不透明表盘后，
              // 顶部胶带与左下卷角完整外露，永不跳过也不过深遮埋。
              for (let attempt = 0; attempt < 24; attempt++) {
                const ang = rimTuckAngle + (attempt % 2 === 0 ? 1 : -1) * Math.floor(attempt / 2) * 0.045;
                const dist = faceRadius + size * (0.36 + 0.07 * (seed.dx + 0.5));
                const cx = dialX + Math.sin(ang) * dist;
                const cy = dialY - Math.cos(ang) * dist;
                const x = cx - (0.5 - p.anchor) * size;
                const y = cy - noteH * 0.5;
                if (x < padX || x > viewW - padX || y < padTop || y > wallH - padBot) continue;
                if (Math.hypot(x - dialX, y - dialY) < faceRadius + 8) continue;
                const left = x - p.anchor * size - 6;
                const right = x + (1 - p.anchor) * size + 6;
                const top = y - size * 0.16 - 5;
                const bottom = y + noteH + 6;
                if (keepClear.some(b => right > b.left && left < b.right && bottom > b.top && top < b.bottom)) continue;
                if (result.some(o => o.visible && Math.hypot(cx - (o.x + (0.5 - papers[o.index].anchor) * o.width),
                    cy - (o.y + o.width * papers[o.index].ratio * 0.5)) < (o.width + size) * minGapFactor)) continue;
                point.x = x;
                point.y = y;
                point.index = i;
                point.visible = true;
                break;
              }
            } else {
              for (let attempt = 0; attempt < 84; attempt++) {
                const ring = Math.sqrt(attempt) * (narrow ? 6.5 : 10.5);
                const theta = attempt * 2.39996 + seed.ringSeed;
                const x = clamp(tx + seed.dx * jitterX + Math.cos(theta) * ring, padX, viewW - padX);
                const y = clamp(ty + seed.dy * jitterY + Math.sin(theta) * ring, padTop, wallH - padBot);
                const cx = x + (0.5 - p.anchor) * size;
                const cy = y + noteH * 0.5;
                const distDial = Math.hypot(cx - dialX, cy - dialY);
                if (distDial < radius + size * 0.52) continue;

                const left = x - p.anchor * size - 6;
                const right = x + (1 - p.anchor) * size + 6;
                const top = y - size * 0.16 - 5;
                const bottom = y + noteH + 6;
                if (keepClear.some(b => right > b.left && left < b.right && bottom > b.top && top < b.bottom)) continue;
                if (result.some(o => o.visible && Math.hypot(cx - (o.x + (0.5 - papers[o.index].anchor) * o.width),
                    cy - (o.y + o.width * papers[o.index].ratio * 0.5)) < (o.width + size) * minGapFactor)) continue;

                point.x = x;
                point.y = y;
                point.index = i;
                point.visible = true;
                break;
              }
            }
          }
          result.push(point);
        }

        // 为离场便签按纵向顺序分配轻微分流的航道，减少飞行中相互靠近或重叠。
        const visibleRows = result.filter(m => m.visible).sort((a, b) => a.y - b.y);
        visibleRows.forEach((m, rank) => {
          const lane = wallH * (rank + 0.5) / Math.max(1, visibleRows.length);
          m.deltaY = clamp((lane - m.y) * 0.58 + (rank % 2 === 0 ? -18 : 18), -125, 125);
        });
        return result;
      }

      return { layout };
    }

    function drawPaper(ctx, paper, state) {
      const { x, y, width, wind, peel, flight, deltaX, deltaY, hover } = state;
      if (flight >= 1 || width <= 0) return;

      const f = flight;
      const p = smooth(peel);
      const tp = smooth((peel - 0.32) / 0.68); // 胶带自左向右剥离进度
      const arc = Math.sin(Math.PI * f);

      // 水平位移：顺风渐加速（起飞平滑承接剥离动量，离开视口时轻盈加速），加轻微波浪飘动。
      const moveX = 0.34 * f + 0.66 * f * f;
      const flutterX = arc * Math.sin(Math.PI * 2 * f + paper.phase) * width * 0.22;
      // 纵向位移：微升弧线 + 航道分流 + 轻盈纸片飘荡，完全由 f 参数化以保证可逆零漂移。
      const laneEase = smooth(f);
      const liftArc = -arc * (20 + width * paper.arcLift);
      const glideWave = arc * Math.sin(Math.PI * paper.waveCycles * f + paper.phase) * (8 + width * paper.waveAmp);
      // 剥离末段向风向产生 2–4px 极轻滑移，使剥离与起飞衔接连续。
      const peelSlipX = tp * tp * width * 0.14;
      const peelSlipY = -tp * tp * width * 0.06;

      const px = x + peelSlipX + deltaX * moveX + flutterX;
      const py = y + peelSlipY + deltaY * laneEase + liftArc + glideWave;

      // 受风与形变强度：附着时随呼吸微风自然掀起、舒展与回落，剥离与飞行平滑衔接。
      const liveAir = clamp(wind, 0, 2.0) * (1 - 0.62 * p * p);
      const flightFlex = arc * (0.22 + 0.12 * Math.sin(Math.PI * 2.4 * f + paper.phase));
      const bend = clamp(0.02 + (0.22 + paper.softness * 0.30) * liveAir + p * 0.34 + flightFlex, 0.02, 1.15);

      // 绕顶部胶带附着点轻柔摇摆（常态约 3–6° 呼吸式摆动，风息时轻缓回落）。
      const swingRad = -(0.068 + 0.064 * paper.softness) * (liveAir - 0.10) - p * 0.22;
      const flightTilt = arc * (0.32 * Math.sin(Math.PI * 1.9 * f + paper.phase) - 0.15)
        + f * paper.rollDir * 0.38;
      const angle = paper.lean + swingRad + flightTilt + hover;

      // 飞行中的柔和翻面与透视压缩：沿纸长加入柔性扭转（底部微滞后于顶部），
      // 静态受风期附带轻度离墙鼓起（billow），增强纸片被微风轻托的呼吸感。
      const roll = f * paper.rollTurns * paper.rollDir
        + arc * 0.32 * Math.sin(Math.PI * 2 * f + paper.phase);
      const twist = arc * 0.46 * paper.rollDir;
      const midCos = Math.cos(roll - twist * 0.5);
      const rawSin = Math.sin(roll - twist * 0.5);
      const showingFront = midCos >= 0;
      const topFront = Math.cos(roll) >= 0;
      const botFront = Math.cos(roll - twist * 0.88) >= 0;
      const absCos = Math.abs(midCos);
      const billow = (0.044 + 0.052 * paper.softness) * Math.min(1.25, liveAir) * (1 - p * 0.5);
      const pitchY = 1 - billow - p * 0.08 - arc * 0.14 * Math.abs(rawSin);

      const left = -paper.anchor;
      const right = 1 - paper.anchor;
      const H = paper.ratio;
      const shear = (0.115 * bend + arc * 0.045) * absCos * (showingFront ? 1 : -1);
      const edgeBow = rawSin * (1 - absCos) * 0.12 * (arc > 0.01 ? 1 : 0);

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(angle);
      ctx.scale(width, width * pitchY);

      const xMap = (ux, uy) => {
        const v = clamp01(uy / H);
        const localCos = Math.cos(roll - twist * v);
        return ux * localCos + uy * shear + edgeBow * Math.sin(Math.PI * v);
      };
      const faceLeft = xMap(left, 0), faceRight = xMap(right, 0);

      const shape = paper.shape;
      const sFold = clamp(paper.lip + bend * 0.24, 0.14, 0.48);
      const rollLx = clamp(0.025 + bend * 0.18, 0.02, 0.26);
      const rollLy = clamp(paper.lip * 0.58 + bend * 0.30, 0.06, 0.44);
      const flatLx = bend * 0.085;
      const flatLy = bend * 0.13;
      const altFold = clamp(paper.lip + bend * 0.11, 0.11, 0.30);

      // 1. 与局部纸张掀起一致的呼吸感贴墙微影（风息贴墙淡隐，风起轻扬柔和加深并微扩）。
      if (f < 0.14 && showingFront) {
        const wallFade = 1 - f / 0.14;
        const shadowAlpha = (0.042 + 0.135 * bend) * wallFade;
        ctx.fillStyle = "rgba(74, 64, 48, " + shadowAlpha.toFixed(4) + ")";
        ctx.beginPath();
        if (shape === "fold") {
          const sx1 = xMap(left + 0.02, H - sFold * 0.94);
          const sy1 = H - sFold * 0.94;
          const sx2 = xMap(left + sFold * 1.18 + bend * 0.18, H + 0.01);
          const sxC = xMap(left + 0.02 + bend * 0.11, H + 0.032 + 0.115 * bend);
          ctx.moveTo(sx1, sy1);
          ctx.quadraticCurveTo(sxC, H + 0.040 + 0.125 * bend, sx2, H + 0.018 + 0.02 * bend);
          ctx.lineTo(xMap(left + sFold * 0.55, H - sFold * 0.24), H - sFold * 0.24);
          ctx.closePath();
        } else if (shape === "roll") {
          const rSpan = clamp(0.56 + bend * 0.20, 0.48, 0.84);
          ctx.moveTo(xMap(left + 0.02, H - rollLy * 0.78), H - rollLy * 0.78);
          ctx.quadraticCurveTo(
            xMap(left + 0.08 + bend * 0.09, H + 0.040 + 0.125 * bend),
            H + 0.040 + 0.125 * bend,
            xMap(left + rSpan, H + 0.014 + 0.018 * bend), H + 0.014 + 0.018 * bend
          );
          ctx.lineTo(xMap(left + rSpan * 0.5, H - rollLy * 0.28), H - rollLy * 0.28);
          ctx.closePath();
        } else if (shape === "altFold") {
          ctx.moveTo(xMap(left + 0.06, H - 0.02), H - 0.02);
          ctx.quadraticCurveTo(
            xMap(left + 0.45, H + 0.024 + 0.085 * bend),
            H + 0.024 + 0.085 * bend,
            xMap(right + 0.015, H + 0.028 + 0.075 * bend), H + 0.018 + 0.04 * bend
          );
          ctx.lineTo(xMap(right - 0.01, H - altFold * 0.88), H - altFold * 0.88);
          ctx.lineTo(xMap(right - altFold * 0.45, H - altFold * 0.28), H - altFold * 0.28);
          ctx.closePath();
        } else {
          ctx.moveTo(xMap(left + 0.02, H - 0.08 - bend * 0.06), H - 0.08 - bend * 0.06);
          ctx.quadraticCurveTo(
            xMap(left + 0.24 + bend * 0.06, H + 0.026 + 0.105 * bend),
            H + 0.026 + 0.105 * bend,
            xMap(right - 0.04, H + 0.010 + 0.015 * bend), H + 0.010 + 0.015 * bend
          );
          ctx.lineTo(xMap(right - 0.08, H - 0.03), H - 0.03);
          ctx.closePath();
        }
        ctx.fill();
      }

      // 2. 纸身主体轮廓（完全不透明，保留扁平纸张轮廓与柔和风弯）。
      const topBow = 0.012 * p + arc * 0.028 * rawSin;
      const rightBowX = 0.026 * bend;
      const leftBowX = -0.020 * bend;
      ctx.fillStyle = showingFront ? paper.ink[0] : paper.ink[2];
      ctx.beginPath();
      ctx.moveTo(faceLeft, 0);
      ctx.quadraticCurveTo(xMap(0, 0), topBow, faceRight, 0);

      if (shape === "fold") {
        const p1y = H - sFold * 1.04;
        const p2x = left + sFold * 1.12;
        ctx.quadraticCurveTo(xMap(right + rightBowX, H * 0.52), H * 0.52, xMap(right, H), H);
        ctx.quadraticCurveTo(xMap(mix(right, p2x, 0.5), H), H + 0.01 * bend, xMap(p2x, H), H);
        ctx.lineTo(xMap(left, p1y), p1y);
        ctx.quadraticCurveTo(xMap(left + leftBowX, p1y * 0.52), p1y * 0.52, faceLeft, 0);
      } else if (shape === "roll") {
        const cx = left + rollLx;
        const cy = H - rollLy;
        ctx.quadraticCurveTo(xMap(right + rightBowX, H * 0.52), H * 0.52, xMap(right, H), H);
        ctx.quadraticCurveTo(xMap(left + 0.54, H + 0.012 * bend), H + 0.012 * bend, xMap(cx, cy), cy);
        ctx.quadraticCurveTo(xMap(left + leftBowX, cy * 0.55), cy * 0.55, faceLeft, 0);
      } else if (shape === "altFold") {
        const p1x = right - altFold * 1.06;
        const p2y = H - altFold * 1.02;
        ctx.quadraticCurveTo(xMap(right + rightBowX, p2y * 0.54), p2y * 0.54, xMap(right, p2y), p2y);
        ctx.lineTo(xMap(p1x, H), H);
        ctx.quadraticCurveTo(xMap(left + 0.35, H + 0.01 * bend), H + 0.01 * bend, xMap(left + flatLx, H - flatLy), H - flatLy);
        ctx.quadraticCurveTo(xMap(left + leftBowX, H * 0.50), H * 0.50, faceLeft, 0);
      } else {
        ctx.quadraticCurveTo(xMap(right + rightBowX, H * 0.52), H * 0.52, xMap(right, H), H);
        ctx.quadraticCurveTo(xMap(left + 0.48, H + 0.012 * bend), H + 0.012 * bend, xMap(left + flatLx, H - flatLy), H - flatLy);
        ctx.quadraticCurveTo(xMap(left + leftBowX, H * 0.50), H * 0.50, faceLeft, 0);

      if (shape === "fold") {
        const p1y = H - sFold * 1.04;
        const p2x = left + sFold * 1.12;
        const tipX = left + sFold * (0.86 + bend * 0.34);
        const tipY = H - sFold * (0.76 + bend * 0.28);
        ctx.fillStyle = botFront ? paper.ink[1] : paper.ink[0];
        ctx.beginPath();
        ctx.moveTo(xMap(left, p1y), p1y);
        ctx.quadraticCurveTo(
          xMap(left + sFold * 0.56, p1y + sFold * 0.08), p1y + sFold * 0.08,
          xMap(tipX, tipY), tipY
        );
        ctx.quadraticCurveTo(
          xMap(p2x - sFold * 0.06, H - sFold * 0.44), H - sFold * 0.44,
          xMap(p2x, H), H
        );
        ctx.closePath();
        ctx.fill();
      } else if (shape === "roll") {
        const cx = left + rollLx;
        const cy = H - rollLy;
        const spanX = left + clamp(0.54 + bend * 0.18, 0.48, 0.78);
        const lipThickness = clamp(0.055 + bend * 0.13, 0.05, 0.21);
        ctx.fillStyle = botFront ? paper.ink[1] : paper.ink[0];
        ctx.beginPath();
        ctx.moveTo(xMap(cx, cy), cy);
        ctx.quadraticCurveTo(
          xMap(mix(cx, spanX, 0.46), cy + rollLy * 0.45 - lipThickness),
          cy + rollLy * 0.45 - lipThickness,
          xMap(spanX, H - 0.008), H - 0.008
        );
        ctx.quadraticCurveTo(
          xMap(mix(cx, spanX, 0.42), H - rollLy * 0.26),
          H - rollLy * 0.26,
          xMap(cx, cy), cy
        );
        ctx.closePath();
        ctx.fill();
      } else if (shape === "altFold") {
        const p1x = right - altFold * 1.06;
        const p2y = H - altFold * 1.02;
        const tipX = right - altFold * (0.82 + bend * 0.20);
        const tipY = H - altFold * (0.76 + bend * 0.18);
        ctx.fillStyle = botFront ? paper.ink[1] : paper.ink[0];
        ctx.beginPath();
        ctx.moveTo(xMap(right, p2y), p2y);
        ctx.quadraticCurveTo(
          xMap(right - altFold * 0.50, p2y + altFold * 0.08), p2y + altFold * 0.08,
          xMap(tipX, tipY), tipY
        );
        ctx.quadraticCurveTo(
          xMap(p1x + altFold * 0.06, H - altFold * 0.42), H - altFold * 0.42,
          xMap(p1x, H), H
        );
        ctx.closePath();
        ctx.fill();
      }

      // 4. 抽象手写笔迹（仅正面绘制，随纸身弯曲且在侧视边缘平滑淡隐）。

        ctx.lineCap = "round";
        ctx.beginPath();

          const liftBias = m.y * m.y * bend * 0.055;
          const x0 = xMap(m.x + liftBias, my0);
          const y0 = my0 - liftBias * 0.65;
          const x1 = xMap(m.x + m.len + liftBias * 0.5, my0 + m.rise);
          const y1 = my0 + m.rise - liftBias * 0.35;
          const xc = xMap(m.x + m.len * 0.48 + liftBias * 0.75, my0 + m.rise * 0.45);

          ctx.moveTo(x0, y0);
          ctx.quadraticCurveTo(xc, yc, x1, y1);
        }

      // 5. 顶部哑光纸胶带：附着期稳固贴墙不随纸身摇摆（作为清晰视觉支点，放大纸片呼吸摇曳感），
      // 剥离期自左端逐步掀起并平滑汇入纸身倾角，飞行期保持材质与身份一致。

      const [tlx, tly] = tPt(-halfT + liftL * 0.34, tTop - liftL);

        ctx.fillStyle = "#D6CCBA";
        ctx.beginPath();
        ctx.moveTo(mlx, mly); ctx.lineTo(mrx, mry); ctx.lineTo(brx, bry); ctx.lineTo(blx, bly);
        ctx.closePath();
        ctx.fill();

        if (liftL > 0.003 && f < 0.12) {

          ctx.beginPath();
          ctx.moveTo(blx, bly);
          ctx.lineTo(xMap(halfT * 0.15, tBot), tBot);
          ctx.lineTo(xMap(-halfT + 0.01, tBot), tBot + 0.008);
          ctx.closePath();
          ctx.fill();
        }

        ctx.fillStyle = "#DFD8CA";
        ctx.beginPath();
        ctx.moveTo(tlx, tly); ctx.lineTo(trx, try_); ctx.lineTo(mrx, mry); ctx.lineTo(mlx, mly);

        ctx.fill();

      const retraceStep = Math.min(retraceAvail, delta * retraceBoost);
      const remainDelta = Math.max(0, delta - retraceStep / retraceBoost);

      const maxWork = lastVisibleDetach();
      const maxNewWork = Math.max(0, maxWork + 0.05 - work);
      const newStep = Math.min(maxNewWork, remainDelta * gain);

        ? Math.max(frontier, activeGlideEnd(frontier))

      let coastTime = dt;

        );

          Math.max(canGlide ? drift * dt : 0.04, followRate));

            if (!Number.isFinite(p.launchT) && nextW >= detach - 0.0005) {

            }

          work = nextW;

          const maxWork = lastVisibleDetach();

            goal = Math.min(goal, end);

          }

        if (cursor < 0.0001 && goal === 0) {

          glides.length = 0;

      if (coastTime > 0 && direction > 0 && Math.abs(goal - cursor) < 0.0005) {
        if (cursor >= frontier - 0.0001) {
          const end = activeGlideEnd(frontier);
          if (end <= frontier + 0.0001) return;
          const next = Math.min(end, frontier + coastTime * drift);
          const lastGap = glides[glides.length - 1];

        } else {

          const gap = findGlideContaining(cursor);
          if (gap) {
            const targetEnd = Math.min(gap.to, activeGlideEnd(cursor));
            if (targetEnd > cursor + 0.0001) {
              const next = Math.min(targetEnd, cursor + coastTime * drift);
              cursor = goal = next;
            }

      }
    }

        height = h;
        scale = dpr;
        canvas.width = Math.round(w * dpr);

        clean = true;
      }
      if (!measureHome) return;
      mounted = mounts.layout(w, h);
    }

    function paint(dt, speed) {

      if (!width || !height) return;

      if (stepDt > 0) advance(stepDt);
      secondsOnWall += stepDt;

      const driven = cursor >= frontier - 0.0001 ? work : workAt(cursor);
      // 仅顺时针拨动叠加正向强风压力；逆时针仅驱动时间回溯，不制造反向风力。
      const targetPressure = speed > 0 ? Math.tanh(speed / 195) : 0;

      if (!clean) ctx.clearRect(0, 0, width, height);
      clean = true;

      for (let i = 0; i < mounted.length; i++) {

        const paper = papers[i];
        if (!mount || !mount.visible) continue;

        if (stepDt > 0) {
          const pResp = -Math.expm1(-stepDt / (0.075 + paper.delay * 0.16));
          paper.pressure += (targetPressure - paper.pressure) * pResp;

          const targetWind = ambientWind(secondsOnWall, mount.x / width, mount.y / height, paper)
            + paper.pressure * (1.22 - 0.26 * paper.adhesion);

          const acc = omega * omega * (targetWind - paper.gust) - 2 * zeta * omega * paper.gustVel;
          paper.gustVel += acc * stepDt;
          paper.gust = clamp(paper.gust + paper.gustVel * stepDt, 0, 2.05);
        }

        if (Number.isFinite(paper.launchT) && cursor >= paper.launchT + paper.flightSpan) continue;

        const peel = clamp01((driven - paper.peelStart) / paper.peelSpan);
        const flight = Number.isFinite(paper.launchT)
          ? clamp01((cursor - paper.launchT) / paper.flightSpan)
          : 0;
        // 若在回溯途中暂停于空中，保留极微弱空气悬浮感，不改变其精确轨迹位置。
        const hover = flight > 0 && Math.abs(goal - cursor) < 0.001
          ? Math.sin(secondsOnWall * 1.4 + paper.phase) * 0.012
          : 0;

        drawPaper(ctx, paper, {
          x: mount.x - scrollX,
          y: mount.y - scrollY,
          width: mount.width,
          wind: paper.gust,
          peel,
          flight,
          deltaX: width + mount.width * 2.1 - mount.x,
          deltaY: mount.deltaY,
          hover
        });
        clean = false;
      }
    }

    return { resize, paint, turn };
  }

    function homeControl() {

    // 共享表盘直接从屏幕上的位置移动。旋转设备或布局重排时从上一帧的可见位置接续。

  function createClock(svg, memoryTrack) {
    const ns = "http://www.w3.org/2000/svg";
    const ticks = svg.querySelector("#ticks");
    const markers = svg.querySelector("#hourMarkers");
    const minuteHand = svg.querySelector("#minuteHand");
    const hourHand = svg.querySelector("#hourHand");
    const initialMinuteAngle = minuteHand.transform.baseVal.getItem(0).angle;
    const initialHourAngle = hourHand.transform.baseVal.getItem(0).angle;
    const mainGear = svg.querySelector("#mainGear");
    const auxGear = svg.querySelector("#auxGear");
    const orbit = svg.querySelector("#orbitRing");
    const pressLever = svg.querySelector("#pressLever");
    const engraving = svg.querySelector("#dialEngraving");

    function add(parent, name, attributes) {
      const part = document.createElementNS(ns, name);
      for (const [key, value] of Object.entries(attributes)) part.setAttribute(key, value);

    }

    for (let minute = 0; minute < 60; minute++) {
      const major = minute % 5 === 0;
      const transform = `rotate(${minute * 6} 320 320)`;
      add(ticks, "line", { class: major ? "tick is-major" : "tick", x1: 320, y1: 26,
        x2: 320, y2: major ? 49 : 37, transform });
      if (!major) continue;
      add(engraving, "path", { class: "dial-engraving-mark", d: "M320 104l3.2 5-3.2 5-3.2-5z", transform });
      if (minute % 15 !== 0) {
        add(markers, "path", { class: "hour-lozenge", d: "M320 73l2.8 6-2.8 6-2.8-6z", transform });
      }
    }

    function buildGear(group, radius, teeth, spokes) {
      const inner = radius * .79;
      const hub = radius * .18;
      const outline = [];
      const toothProfile = [[-.5, -4.5], [-.32, -4.5], [-.24, -1.6], [-.16, 3.5],
        [.16, 3.5], [.24, -1.6], [.32, -4.5]];
      for (let tooth = 0; tooth < teeth; tooth++) {
        for (const [offset, distance] of toothProfile) {
          const angle = (tooth + offset) * 2 * Math.PI / teeth;
          const r = radius + distance;
          outline.push(`${(r * Math.cos(angle)).toFixed(2)},${(r * Math.sin(angle)).toFixed(2)}`);
        }
      }
      const bore = `M ${inner} 0 a ${inner} ${inner} 0 1 0 ${-2 * inner} 0 a ${inner} ${inner} 0 1 0 ${2 * inner} 0Z`;
      add(group, "path", { class: "gear-body", "fill-rule": "evenodd", d: "M" + outline.join(" L") + "Z " + bore });
      add(group, "circle", { class: "gear-engraving", r: radius - 6.5 });
      add(group, "circle", { class: "gear-engraving", r: inner + 2.3 });
      const width = radius * .048;
      const spoke = `M ${-hub * .56} ${-hub * .58} Q ${-width * 2.2} ${-inner * .54} ${-width} ${-inner - 1}
        h ${2 * width} Q ${-width * .35} ${-inner * .54} ${hub * .56} ${-hub * .58} Z`;
      for (let i = 0; i < spokes; i++) {
        add(group, "path", { class: "gear-body", d: spoke, transform: `rotate(${i * 360 / spokes})` });
      }

      add(group, "circle", { class: "gear-engraving", r: hub * .7 });

    const mainTeeth = 30, auxTeeth = 18;
    buildGear(mainGear, 85, mainTeeth, 6);
    buildGear(auxGear, 51, auxTeeth, 5);

    memoryTrack.append(memoryTrack.firstElementChild.cloneNode(true));

    const topSpeed = .78; // degrees per millisecond
    const accelerationMs = 290;
    const releaseMs = 165;
    let frame = 0;
    let speed = 0;
    let handTravel = 0;
    let gearTravel = 0;
    let leverLift = 0;
    const rest = { minute: initialMinuteAngle, hour: initialHourAngle, gear: 0, orbit: 0, lever: 0 };
    let pose = { ...rest };

    function smoothstep(progress) {
      const t = Math.max(0, Math.min(1, progress));
      return t * t * (3 - 2 * t);
    }

    function position(next) {
      if (next.minute !== pose.minute) minuteHand.setAttribute("transform", `rotate(${next.minute})`);
      if (next.hour !== pose.hour) hourHand.setAttribute("transform", `rotate(${next.hour})`);
      if (next.gear !== pose.gear) {
        mainGear.setAttribute("transform", `rotate(${next.gear})`);
        auxGear.setAttribute("transform", `rotate(${10 - next.gear * mainTeeth / auxTeeth})`);
      }
      if (next.orbit !== pose.orbit) orbit.setAttribute("transform", `rotate(${next.orbit})`);
      if (next.lever !== pose.lever) pressLever.setAttribute("transform", `rotate(${next.lever})`);
      pose = next;
    }

    function paint({ minute, hour, gear, orbitAngle, ink, lift }) {
      position({ minute: initialMinuteAngle - minute, hour: initialHourAngle - hour,

    function paintRewind(hand, gears, lift) {
      handTravel = hand;
      gearTravel = gears;

    function cancel() {

    }

    function rewind() {

      }

      const hand = handTravel, gears = gearTravel;
      const travel = (elapsed) => {
        const ramp = Math.min(elapsed, accelerationMs);
        return topSpeed * (ramp * ramp / (2 * accelerationMs) + Math.max(0, elapsed - accelerationMs));
      };
      function advance(now) {
        const elapsed = Math.max(0, now - start);
        speed = topSpeed * Math.min(1, elapsed / accelerationMs);
        paintRewind(hand + travel(elapsed), gears + travel(Math.max(0, elapsed - 60)), smoothstep(elapsed / releaseMs));
        frame = window.requestAnimationFrame(advance);
      }
      frame = window.requestAnimationFrame(advance);
    }

    function settle(onStop) {
      cancel();
      if (REDUCED_MOTION.matches) {
        frame = window.requestAnimationFrame(() => {
          frame = 0;
          speed = 0;
          paintRewind(handTravel, gearTravel, 0);

        const hands = elapsed < handBrake
          ? hand + (stop + overshoot - hand) * easeOut(elapsed / handBrake)
          : stop + overshoot * (1 + Math.cos(Math.PI * recoil)) / 2;

          entrySpeed * gearBrake / 3 * easeOut(Math.max(0, elapsed - gearLag) / gearBrake);
        paintRewind(hands, gears + runout, lift * smoothstep((duration - elapsed) / releaseMs));

          speed = 0;
          onStop();
        }
      }
      frame = window.requestAnimationFrame(advance);
    }

    function turnOnce(duration, onBrake, onStop) {
      cancel();
      if (REDUCED_MOTION.matches) {
        frame = window.requestAnimationFrame(() => {
          frame = 0;
          onBrake();
          onStop();
        });
        return;
      }

      const start = performance.now();
      const hand = handTravel, gears = gearTravel;
      let braking = false;
      function advance(now) {
        const elapsed = Math.max(0, now - start);
        if (!braking && elapsed >= duration - 570) {
          braking = true;
          onBrake();
        }
        if (elapsed >= duration) {
          // Carry the hour advance into the next draw while the gears return to their starting angles.
          paintRewind(hand + 360, gears, 0);
          frame = 0;
          onStop();
          return;
        }
        const turn = smoothstep(elapsed / duration);
        const minute = hand + 360 * turn;
        const gearTurns = 3 * smoothstep((elapsed - 60) / (duration - 60));
        paint({
          minute,
          hour: minute / 12,
          gear: gears * .32 + 360 * gearTurns,
          orbitAngle: gears / 10 + 360 * turn,
          ink: hand + duration * .64 * turn,
          lift: smoothstep(Math.min(elapsed, duration - elapsed) / releaseMs)
        });
        frame = window.requestAnimationFrame(advance);
      }
      frame = window.requestAnimationFrame(advance);
    }

    function reset() {
      cancel();
      speed = 0;
      paintRewind(0, 0, 0);
    }

    return { rewind, settle, turnOnce, cancel, reset, rest, position, get pose() { return pose; } };
  }

  function updateStepperButtons() {
    const value = Number.parseInt(el.peopleInput.value, 10);
    el.minusBtn.disabled = el.plusBtn.disabled = !Number.isFinite(value);
    el.minusBtn.setAttribute("aria-disabled", String(el.minusBtn.disabled || value <= 2));
    el.plusBtn.setAttribute("aria-disabled", String(el.plusBtn.disabled || value >= 99));
  }

  const peopleLimit = document.getElementById("peopleLimit");
  let limitTimer;
  function clearPeopleLimit() {

  function showPeopleLimit(direction) {
