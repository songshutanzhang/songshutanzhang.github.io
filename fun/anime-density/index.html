## 一、数据

\`此处填入json内容\`

JSON 的 \`field_semantics\` 说明了字段含义，分析时请以它为准。尤其注意：

- \`progress_percent\` / \`progress_level\` 描述对本条目已播出内容的观看进度，不是喜好评分，也允许未知。
- \`favorite\` 是用户主动表达的强烈喜爱或推崇，与是否看完相互独立。
- \`want_to_watch\` 是尚未观看的观看意愿，不等于接触经验。
- \`unmarked\` 表示未标记为看过或想看。

## 二、分析目标

**1. 观看经历的结构**

看过作品在年代、完成度和题材上如何分布？观看进度集中在哪些区域，哪些作品处于“看过但进度未知或未完成”的状态？

**2. 明确偏好：激推作品**

激推作品是强偏好的直接证据。请优先关注这些作品之间是否存在共同的题材、叙事方式、人物关系、情感基调、美术或时代联系，但不要把少数作品强行归纳为唯一的审美核心。

如果激推样本很小，请明确说明其证据有限。

**3. 观看接触与偏好之间的关系**

观看进度能够提供接触程度的证据，但不应被解释为好感。请比较：

- 观看接触较多的题材与激推作品集中的题材是否重合；
- 是否存在“看了不少但并未激推”的区域，或“进度不高但明确激推”的作品；
- 这些差异可能说明什么，以及是否还有其他解释。

**4. 想看与探索方向**

\`want_works\` 和 \`genres_want\` 代表尚未观看但存在明确兴趣的方向。请不要把它们混入已观看题材，而是比较它们与已观看作品、激推作品之间的重叠和缺口。

如果记录足够，可以基于具体作品组合提出探索方向；不要只输出热门番单。

**5. 其他值得发现的现象**

如果发现比上述问题更有解释价值的特征、反例或作品组合，可以主动提出。也可以讨论同一系列、同一改编源或同一创作者的关系，但不要把系列相关性当作独立的审美证据重复计算。

## 三、分析原则

- **区分事实与解释**：频数、排序、目录占比和记录口径是事实；关于“偏好核心”“审美倾向”的判断是解释，应说明依据与不确定性。
- **注意样本量**：不要用一两部激推推导稳定人格或唯一爱好；样本较大时也应保留反例。
- **注意目录偏差**：年表由年度热门作品策展而成，题材与年代供给不均。某个题材占比高，可能来自目录供给，不必然代表用户偏好。
- **区分观看与喜爱**：看完不等于喜欢，未完成不等于不喜欢，激推才是主动偏好标记。
- **不要过度心理分析**：不要根据动画记录推断真实人格、心理健康、社会身份、文化水平或价值取向。
- **不要空泛赞美**：不要为了制造独特性而强行寻找证据不足的模式。
- **具体优先**：尽量用记录中的具体作品支持分析；不要编造情节、人物关系或作品事实。
- **保留差异**：一个人的兴趣可以横跨多个类型，也可以存在相互矛盾的偏好。不要强行合并。

  <body>
    <a class="skip-link" href="#catalog">跳到作品目录</a>

    <header class="topbar">
      <div class="controls">
        <div class="search-field" role="search">
          <svg class="icon-search" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="4.5"></circle>
            <path d="m10 10 4 4"></path>
          </svg>
          <label class="visually-hidden" for="search-input">搜索作品</label>
          <input
            id="search-input"
            type="search"
            inputmode="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="搜索中文名、日文名、别名"
          />
          <button class="search-clear" id="search-clear" type="button" data-action="clear-search" aria-label="清除搜索" hidden>清除</button>
        </div>

        <div class="control-cluster range-cluster">
          <label class="control-label" for="year-range-select">年份</label>
          <select id="year-range-select">
            <option value="all">全部</option>
            <option value="2021-2026">2021-2026</option>
            <option value="2016-2026">2016-2026</option>
            <option value="2006-2026">2006-2026</option>
          </select>
        </div>

        <div class="control-cluster genre-cluster">
          <label class="control-label" for="genre-filter">题材</label>
          <select id="genre-filter" aria-label="按题材筛选"></select>
        </div>

        <div class="control-cluster view-cluster">
          <div class="segmented view-switch" role="group" aria-label="目录视图">
            <button type="button" class="is-active" data-action="set-view" data-view="index" aria-pressed="true">年鉴</button>
            <button type="button" data-action="set-view" data-view="wall" aria-pressed="false">海报墙</button>
          </div>
        </div>

        <div class="year-jump">
          <button type="button" class="icon-button" data-action="step-year" data-delta="-1" aria-label="上一年">←</button>
          <label class="visually-hidden" for="year-select">选择年份</label>
          <select id="year-select" aria-label="选择年份"></select>
          <button type="button" class="icon-button" data-action="step-year" data-delta="1" aria-label="下一年">→</button>
        </div>

        <div class="toolbar-actions">
          <details class="yearbook-export" id="yearbook-export">
            <summary class="toolbar-button">导出年鉴</summary>
            <div class="yearbook-export-menu">
              <p>当前年份范围 · 不含封面</p>
              <button type="button" data-action="export-yearbook-original">
                <b>原图</b><small>不含标记</small>
              </button>
              <button type="button" data-action="export-yearbook-marked">
                <b>标记图</b><small>当前记录与进度</small>
              </button>
            </div>
          </details>
          <button class="toolbar-button report-button" type="button" data-action="open-report">查看分析</button>
        </div>
      </div>
    </header>

    <main class="content" id="main">
      <section class="sheet" aria-labelledby="sheet-title">
        <header class="sheet-head">
          <div class="sheet-title">
            <h1 id="sheet-title">动画浓度鉴定</h1>
            <p class="sheet-scope" id="scope-line">1995—2026 · 日本动画 · 327 部</p>
          </div>
          <div class="sheet-tally" aria-live="polite">
            <p class="tally-main"><span>我看过</span> <strong id="count-watched">0</strong> <span class="tally-divider">/</span> <span id="header-total">327</span> <span>部动画</span></p>
            <p class="tally-sub">已看完 <b id="count-completed">0</b><i>·</i>激推 <b id="count-favorites">0</b><i>·</i>想看 <b id="count-want">0</b><i>·</i>已标记 <b id="header-marked">0</b></p>
          </div>
        </header>

        <div class="sheet-subbar">
          <p class="result-summary" id="result-summary" aria-live="polite">327 部作品 · 32 个年份</p>
        </div>

        <div class="storage-banner" id="storage-banner" hidden>
          <p>本地存储不可用，记录只保留在当前页面。可在「查看分析」中导出 JSON。</p>
          <button type="button" data-action="open-report">查看分析</button>
        </div>

        <div class="catalog" id="catalog" role="region" aria-label="动画作品目录" tabindex="-1"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        数据来自 <a href="https://bgm.tv" target="_blank" rel="noopener noreferrer">Bangumi 番组计划</a>
        · 条目信息 CC BY-SA 3.0 · 目录版本 <span id="footer-catalog-version">2026.11</span>
        · <span id="footer-work-count">327</span> 部
      </p>
      <p class="footer-right">
        <a href="../">返回 FUN</a>
        <span id="footer-local">记录保存在本地浏览器</span>
        <button type="button" class="text-button" data-action="open-about">数据说明与许可</button>
      </p>
    </footer>

    <div id="dialog-root"></div>
    <div id="work-popover-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input id="record-file" type="file" accept="application/json,.json" hidden />

    <script src="./data/works.js"></script>

  </body>
</html>
